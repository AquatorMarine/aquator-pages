    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Track your ISM compliance records &mdash; certificate expiry, the drill schedule, and crew rest hours &mdash; all under <strong>ISM</strong>.</p>\n\n<h2 id=\"where\">Where to find it</h2>\n<p>Open from <strong>Home &rsaquo; Applications &rsaquo; ISM</strong>. This guide covers the <strong>ISM Records</strong> group in the sidebar.</p>\n\n<h2 id=\"inside\">What&rsquo;s inside</h2>\n<ul class=\"bul\">\n<li><strong>Certificates</strong> &mdash; track certificates and their expiry with a Red / Orange / Green status.</li>\n<li><strong>Drill Matrix</strong> &mdash; a year-long grid that schedules the required drills.</li>\n<li><strong>Hours of Work and Rest</strong> &mdash; the MLC&nbsp;2006 / STCW rest-hours logging tool.</li>\n</ul>\n<div class=\"callout note\"><div class=\"co-h\">Hours of Work and Rest &mdash; documentation pending</div><p>This page is still being captured from the live UI and isn&rsquo;t documented here yet. Until then, use it directly under <strong>ISM &rsaquo; Hours Of Work And Rest</strong>.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Where do I start?</summary><div class=\"faq-a\"><p>For expiry tracking, go to <strong>ISM &rsaquo; Certificates</strong> and <strong>Bulk Upload</strong> your certificates. For drills, open <strong>ISM &rsaquo; Drill Matrix</strong>.</p></div></details>\n<details><summary>Why is a grid empty (&ldquo;No Rows To Show&rdquo;)?</summary><div class=\"faq-a\"><p>Nothing has been added to that record set yet &mdash; upload a certificate or add a drill to populate it.</p></div></details>\n</div>\n"
          },
          {
            "id": "certificates",
            "name": "Certificates",
            "icon": "badge",
            "body": "\n<p class=\"lead\">The Certificates page tracks every certificate and warns you before it expires, using a Red / Orange / Green traffic-light status.</p>\n\n<h2 id=\"add\">Add a certificate</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>Have the certificate as a <strong>PDF or image</strong> to upload.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>ISM &rsaquo; Certificates</strong>.</li>\n<li>Click <strong>Bulk Upload</strong> (top right).</li>\n<li>In the <strong>Bulk Upload Certificates</strong> window, drag files onto the drop zone or click <strong>Browse PDF or Images</strong>.</li>\n<li>Click <strong>Add Certificate</strong>.</li>\n</ol>\n<p>The certificate appears in the tracking grid and is counted in the summary cards (<strong>Expired</strong> / <strong>0&ndash;90 days</strong> / <strong>90+ days</strong>).</p>\n\n<h2 id=\"edit\">Edit the parsed details</h2>\n<p>Open a row&rsquo;s <strong>&#8942;</strong> menu and choose <strong>Edit</strong> to adjust the parsed fields: <strong>Certificate Name, Tags, Frequency, Issuer, Duration, Issue Date, Expiry Date, Notification Date</strong> and <strong>Certificate Number</strong>. The same menu also has <strong>View</strong>, <strong>Upload Document</strong> and <strong>Delete</strong>.</p>\n<div class=\"callout note\"><div class=\"co-h\">Wrong dates after upload?</div><p>Open <strong>&#8942; &rarr; Edit</strong> to correct them. If the grid shows <strong>&ldquo;No Rows To Show&rdquo;</strong>, no certificates have been added yet.</p></div>\n\n<h2 id=\"colours\">Understanding the status colours</h2>\n<p>The traffic-light status appears both as summary cards and in the <strong>Status</strong> column:</p>\n<table class=\"ftab\"><thead><tr><th>Status</th><th>What it means</th></tr></thead><tbody>\n<tr><td><span class=\"chip badchip\">Red &mdash; Expired</span></td><td>Past its expiry date &mdash; &ldquo;Past expiry &mdash; renew now.&rdquo;</td></tr>\n<tr><td><span class=\"chip warnchip\">Orange &mdash; 0&ndash;90 days</span></td><td>Expiring within 90 days.</td></tr>\n<tr><td><span class=\"chip okchip\">Green &mdash; 90+ days</span></td><td>Valid beyond 90 days.</td></tr>\n</tbody></table>\n<p>The <strong>Notification Date</strong> column drives when you&rsquo;re reminded ahead of expiry.</p>\n<div class=\"callout tip\"><div class=\"co-h\">Focus the list</div><p>Use <strong>Filters &rarr; Expiring Status, Issuer, Expiry Date, Uploaded File</strong> to narrow the grid (e.g. show only Red).</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I see only expiring or expired certificates?</summary><div class=\"faq-a\"><p>Use <strong>Filters &rarr; Expiring Status</strong> and pick the status (e.g. Red) to focus the list.</p></div></details>\n<details><summary>What file types can I upload?</summary><div class=\"faq-a\"><p>PDF or image files, via <strong>Bulk Upload &rarr; Browse PDF or Images</strong>.</p></div></details>\n</div>\n"
          },
          {
            "id": "drills",
            "name": "Drill Matrix",
            "icon": "calendar",
            "body": "\n<p class=\"lead\">The Drill Matrix is a year-long calendar grid that shows each drill&rsquo;s required frequency at a glance.</p>\n\n<h2 id=\"how\">How the Drill Matrix works</h2>\n<p>Open it at <strong>ISM &rsaquo; Drill Matrix</strong>. <strong>Rows</strong> are drill types; <strong>columns</strong> are the twelve months (Jan&ndash;Dec) for the selected year. Each cell holds the scheduled date(s) for that drill in that month, so a drill&rsquo;s cadence is visible at a glance (e.g. Abandon Ship monthly, Emergency Steering Gear every two months, First Aid quarterly).</p>\n<p>Drill types include Fire, Abandon Ship, Enclosed Space Rescue/Entry, Recovery of Persons from Water, Fire Engine Room, Man Overboard, Rescue Boat Launching to Water, Emergency Steering Gear, First Aid, Collision/Grounding, ISPS, SSAS Quarterly Test, and MARPOL &amp; SOPEP.</p>\n\n<h2 id=\"add\">Add a drill</h2>\n<ol class=\"steps\">\n<li>Go to <strong>ISM &rsaquo; Drill Matrix</strong>.</li>\n<li>Click <strong>Add</strong> (or <strong>Add New</strong> at the bottom of the drill list) to create a new drill row.</li>\n<li>Set the drill&rsquo;s scheduled dates across the relevant months.</li>\n<li>Use <strong>Export</strong> to download the matrix.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Give it a moment</div><p>The full-year grid can take a few seconds to render &mdash; wait for it to finish before editing cells.</p></div>\n"
          }
        ]
      }
