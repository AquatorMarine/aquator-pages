    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Accounting is where you plan budgets, track spend by category, compare budget against actuals, and record and manage a yacht&rsquo;s financial transactions &mdash; all in one place.</p>\n\n<h2 id=\"inside\">What&rsquo;s inside</h2>\n<p>Four screens, each under <strong>Accounting</strong>:</p>\n<ul class=\"bul\">\n<li><strong>Budget</strong> &mdash; plan how much each category can spend, month by month.</li>\n<li><strong>Category</strong> &mdash; see actual spend grouped by category (what really happened).</li>\n<li><strong>Budget vs Actual</strong> &mdash; compare the two, with variance, a heatmap and a monthly grid.</li>\n<li><strong>Transactions</strong> &mdash; record and manage expenses, income, transfers and more.</li>\n</ul>\n\n<h2 id=\"currency\">Before you start</h2>\n<div class=\"callout warn\"><div class=\"co-h\">Primary Currency required</div><p>You can&rsquo;t create transactions until a <strong>Primary Currency</strong> is set for the yacht (<strong>Admin Console &rarr; Settings &rarr; Currencies</strong>). It&rsquo;s also the currency every report is shown in &mdash; see <strong>Currency &amp; FX Rates</strong>.</p></div>\n\n<h2 id=\"shared\">The same on every screen</h2>\n<ul class=\"bul\">\n<li><strong>Filters</strong> narrow by date range, category and more.</li>\n<li><strong>Export</strong> downloads a report (PDF or spreadsheet).</li>\n<li><strong>Summary cards</strong> at the top recalculate to match your filters.</li>\n<li>Every report shows amounts in your <strong>primary currency</strong>, whatever currency the transactions were entered in.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>What&rsquo;s the difference between Budget, Category, and Budget vs Actual?</summary><div class=\"faq-a\"><p><strong>Budget</strong> is where you enter planned figures per category per month. <strong>Category</strong> shows actual spend grouped by category. <strong>Budget vs Actual</strong> compares the two and flags over/under-budget categories.</p></div></details>\n<details><summary>Why does it say &ldquo;Primary Currency Required&rdquo; when I add a transaction?</summary><div class=\"faq-a\"><p>No primary currency is configured yet. Go to <strong>Admin Console &rarr; Settings &rarr; Currencies</strong>, set one, then return to <strong>Accounting &rarr; Transactions &rarr; Add</strong>.</p></div></details>\n<details><summary>What currency are the reports in?</summary><div class=\"faq-a\"><p>Always your <strong>primary currency</strong>. Amounts entered in other currencies are converted using the FX rate &mdash; see <strong>Currency &amp; FX Rates</strong>.</p></div></details>\n</div>\n"
          },
          {
            "id": "budget",
            "name": "Budget",
            "icon": "chart",
            "body": "\n<p class=\"lead\">Plan how much each category can spend, month by month. Budgets are the planned figures that <strong>Budget vs Actual</strong> measures real spend against.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Accounting &rarr; Budget.</p>\n\n<h2 id=\"before\">Before you start</h2>\n<p>Your Chart of Accounts / budget categories must already exist (e.g. <strong>1.000 CREW</strong>, <strong>2.000 PAYROLL</strong>). Budgets attach to existing categories and their sub-lines &mdash; you can&rsquo;t budget a category that hasn&rsquo;t been created.</p>\n\n<h2 id=\"set\">Set a budget for a category</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Accounting &rarr; Budget</strong>.</li>\n<li>Use <strong>Filters &rarr; Date Range</strong> to set the budget year (defaults to January&ndash;December of the current year).</li>\n<li>In the <strong>CATEGORY</strong> column, click the arrow on a parent category (e.g. 1.000 CREW) to expand its line items (e.g. 1.100 Accomodation &amp; Utilities).</li>\n<li>Click the month cell you want to budget (JAN&hellip;DEC) &mdash; it becomes editable.</li>\n<li>Type the amount and move off the cell to save.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The cell, the row <strong>TOTAL</strong> (far right) and the summary cards (Total Budget, This Month, Categories, Line Items) all recalculate. Figures are in your primary currency.</p></div>\n\n<h2 id=\"export\">Export a budget report</h2>\n<ol class=\"steps\">\n<li>(Optional) Set <strong>Filters &rarr; Date Range / Category</strong> to scope what you export.</li>\n<li>Click <strong>Export</strong> (top right).</li>\n<li>Choose <strong>Detailed Budget Report</strong> or <strong>Simple Budget Report</strong>.</li>\n<li>Pick the format with the icon beside the option (PDF or spreadsheet) &mdash; the file downloads for the filtered period.</li>\n</ol>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>The current month shows in red</strong> &mdash; that&rsquo;s the live-month highlight (e.g. JUN), not an error.</li>\n<li><strong>I can&rsquo;t find a category to budget</strong> &mdash; it hasn&rsquo;t been created yet. Budgets only attach to existing categories and line items.</li>\n</ul>\n"
          },
          {
            "id": "category",
            "name": "Category",
            "icon": "tag",
            "body": "\n<p class=\"lead\">A read-only view of <strong>actual spend grouped by category</strong> over the selected period. It answers one question: where did the money actually go.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Accounting &rarr; Category.</p>\n\n<h2 id=\"read\">What it shows</h2>\n<ul class=\"bul\">\n<li>Summary cards: <strong>Total Actuals</strong>, <strong>This Month</strong>, <strong>Top Spending</strong> (the highest-spend category) and <strong>Line Items</strong>.</li>\n<li>Expand a category to see its breakdown across the months of the period.</li>\n<li>All amounts are shown in your <strong>primary currency</strong>.</li>\n<li><strong>Filters:</strong> Category Type &middot; Category &middot; Payment Method &middot; Date Range. <strong>Export</strong> downloads the report.</li>\n</ul>\n\n<h2 id=\"diff\">How it differs from the other reports</h2>\n<ul class=\"bul\">\n<li><strong>Budget</strong> holds planned figures.</li>\n<li><strong>Category</strong> shows actual spend &mdash; what really happened.</li>\n<li><strong>Budget vs Actual</strong> compares the two.</li>\n</ul>\n\n<div class=\"callout note\"><div class=\"co-h\">Where an unallocated amount shows up</div><p>Figures here are driven by transactions <strong>allocated to a category</strong>. Anything that was never allocated isn&rsquo;t lost &mdash; it&rsquo;s grouped under an <strong>Uncategorized</strong> line rather than against a real category. Allocate it (see <strong>Transactions &rarr; allocations</strong>) to move it into the right category.</p></div>\n"
          },
          {
            "id": "bva",
            "name": "Budget vs Actual",
            "icon": "scale",
            "body": "\n<p class=\"lead\">Compares each category&rsquo;s <strong>budgeted</strong> figure against its <strong>actual</strong> spend, and flags what&rsquo;s over or under budget.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Accounting &rarr; Budget vs Actual.</p>\n\n<h2 id=\"read\">Read the report</h2>\n<ul class=\"bul\">\n<li>Summary cards: <strong>Used %</strong> of total budget, <strong>Over Budget</strong>, <strong>Under Budget</strong>, <strong>Avg Usage</strong> and <strong>Total Saved</strong>.</li>\n<li>Three view toggles (top right, next to Export):\n<strong>Detailed table</strong> (Budget / Actual / Remaining / Used % per category, with progress bars), <strong>Heatmap view</strong> (variance % per category per month) and <strong>Monthly grid</strong> (Actual / Budget side by side).</li>\n<li>Expand a category row to see its line items. All figures are in your <strong>primary currency</strong>. <strong>Filters &rarr; Date Range / Category</strong>, then <strong>Export</strong>.</li>\n</ul>\n\n<h2 id=\"variance\">How variance is calculated</h2>\n<table class=\"ftab\"><thead><tr><th>Measure</th><th>How it&rsquo;s worked out</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Remaining</td><td>Budget &minus; Actual (a positive number is budget left; the report sums it as <strong>Total Saved</strong>)</td></tr>\n<tr><td class=\"t-name\">Used %</td><td>Actual &divide; Budget &mdash; over 100% is <strong>Over Budget</strong>; at or under is <strong>Under Budget</strong> / on track</td></tr>\n<tr><td class=\"t-name\">Heatmap variance</td><td>The same comparison as a % per month &mdash; <span class=\"chip okchip\">green</span> under, <span class=\"chip badchip\">red</span> over</td></tr>\n</tbody></table>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Actuals come from transactions, so only spend that is <strong>approved and allocated</strong> to a category counts against its budget.</p></div>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>Used % shows over 100% / red</strong> &mdash; actuals exceeded the budget for that category (it counts toward Over Budget).</li>\n<li><strong>A month shows &ldquo;&mdash;&rdquo; in the heatmap</strong> &mdash; there&rsquo;s no budget and/or actuals for that category-month, so no variance can be calculated.</li>\n</ul>\n"
          },
          {
            "id": "transactions",
            "name": "Transactions",
            "icon": "receipt",
            "body": "\n<p class=\"lead\">Record and manage every financial transaction &mdash; expenses, income, transfers and more. Each one moves through a fixed lifecycle, which is why the actions on a row change with its status.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Accounting &rarr; Transactions.</p>\n\n<div class=\"callout warn\"><div class=\"co-h\">Before you start</div><p>A <strong>Primary Currency</strong> must be set first, or the create form blocks you: &ldquo;Primary Currency Required.&rdquo; Set one under <strong>Admin Console &rarr; Settings &rarr; Currencies</strong>.</p></div>\n\n<h2 id=\"record\">Record a transaction</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Accounting &rarr; Transactions</strong> and click <strong>Add</strong>.</li>\n<li>Choose the type tab: <strong>Expense / Income / Withdrawal / Transfer / Refund / Adjustment</strong>.</li>\n<li>Fill the header: Amount, Payment Method, Transaction Date, Due Date, From Account, Currency, Supplier, Type and Description. (The Transaction ID is generated automatically, e.g. Aqu-2026-jun-0001.)</li>\n<li>Under <strong>Classification / Allocations</strong>, click <strong>Add Allocation</strong>, pick a <strong>Chart Account</strong> and enter its <strong>Amount</strong>. Add more rows to split across accounts.</li>\n<li>(Optional) Add <strong>Notes</strong> and drag files into <strong>Documents</strong> (PNG, JPG, PDF, DOC, XLS &mdash; max 100 MB).</li>\n<li>Click <strong>Create</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The transaction saves as a <span class=\"chip neutralchip\">Draft</span>. Drafts aren&rsquo;t counted as approved spend &mdash; they must be sent for approval (see the lifecycle below).</p></div>\n\n<h2 id=\"allocations\">Allocations &amp; reconciliation</h2>\n<p>A single transaction can be split across multiple Chart Accounts. The form continuously reconciles four numbers &mdash; <strong>Transaction Amount</strong>, <strong>Total Allocated</strong>, <strong>Categorized</strong> and <strong>Uncategorized</strong>. The goal is for Total Allocated to equal the Transaction Amount so <strong>Uncategorized reaches 0.00</strong>.</p>\n<p>If the transaction is in another currency, each row also shows its <strong>Primary Eqv.</strong> &mdash; the amount converted to your primary currency at the transaction&rsquo;s FX rate. That converted figure is what reaches the reports.</p>\n<div class=\"callout note\"><div class=\"co-h\">Why this matters</div><p>Any unallocated remainder stays <strong>Uncategorized</strong>. It still appears in the Category and Budget vs Actual reports &mdash; but grouped under an <strong>Uncategorized</strong> line rather than against a real category. Finish the allocation so the amount is counted where it belongs.</p></div>\n\n<h2 id=\"lifecycle\">The transaction lifecycle</h2>\n<p>Every transaction moves through the same core statuses &mdash; <strong>Draft &rarr; Pending Approval &rarr; Approved</strong> &mdash; and can be <strong>Reversed</strong>. A new transaction is created as a Draft; from the row menu you <strong>Send for Approval</strong>; once approved it&rsquo;s final.</p>\n<div class=\"callout note\"><div class=\"co-h\">Paid / Unpaid applies to expenses only</div><p>Only <strong>expenses</strong> have a payment step: an approved expense shows as <span class=\"chip badchip\">Unpaid</span> until it&rsquo;s paid (individually or via <strong>Bulk Payment</strong>), then <span class=\"chip okchip\">Paid</span>. <strong>Income, Withdrawal, Transfer, Refund and Adjustment</strong> have no payment step &mdash; they&rsquo;re complete once <strong>Approved</strong>.</p></div>\n<table class=\"ftab\"><thead><tr><th>Row status</th><th>Action menu</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Draft</td><td>View, History, <strong>Edit</strong>, Send for Approval, <strong>Delete</strong> &mdash; still editable and removable</td></tr>\n<tr><td class=\"t-name\">Approved / Paid</td><td>View, History, <strong>Reverse</strong>, <strong>Lock</strong> &mdash; correct it by reversing, or freeze it with Lock</td></tr>\n</tbody></table>\n<p>The practical rule: if you can&rsquo;t <strong>Edit</strong> or <strong>Delete</strong> a transaction, it&rsquo;s past Draft &mdash; use <strong>Reverse</strong> to undo a finalized entry.</p>\n<div class=\"callout warn\"><div class=\"co-h\">What Lock does</div><p><strong>Lock</strong> freezes a transaction&rsquo;s amounts and FX rate. A locked transaction is the <em>only</em> kind that won&rsquo;t be re-priced if someone later updates the exchange rate for its period &mdash; see <strong>Currency &amp; FX Rates</strong>.</p></div>\n\n<h2 id=\"bulk\">Pay several expenses at once &mdash; Bulk Payment</h2>\n<div class=\"callout warn\"><div class=\"co-h\">What&rsquo;s included</div><p>Bulk Payment only lists <strong>expenses</strong> that are <strong>Approved and Unpaid</strong>, and only for <strong>one vendor at a time</strong>. Drafts, already-paid items, other vendors and non-expense transactions won&rsquo;t appear.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Accounting &rarr; Transactions</strong> and click <strong>Bulk Payment</strong>.</li>\n<li>Use the search box or the chips &mdash; <strong>All / Overdue / Due Soon / This Month</strong> &mdash; to find the vendor&rsquo;s expenses.</li>\n<li>Tick individual expenses, or use <strong>Select all</strong>.</li>\n<li>(Optional) Enter a <strong>Reference Number</strong>.</li>\n<li>Review <strong>Payment Overview</strong> (vendor, count) and <strong>Total by Currency</strong>.</li>\n<li>Click <strong>Confirm Bulk Payment (n)</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The selected expenses are marked <strong>Paid</strong> and drop out of the unpaid pool; the Expense card&rsquo;s unpaid balance updates.</p></div>\n\n<h2 id=\"filter\">Filter &amp; export the list</h2>\n<p>Click <strong>Filters</strong> and narrow by Transaction Date, Created Date, Transaction Type, Status, COA, Transaction Currency, Contact, Account or Search &mdash; or type in the <strong>Search</strong> box (ID, description, amount). To export, click <strong>Export &rarr; Transactions Report</strong> and choose PDF or spreadsheet. The grid and the summary cards (Expense, Income, Withdrawal, Transfer, Refund) recalculate to match.</p>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>&ldquo;Primary Currency Required&rdquo; banner</strong> &mdash; set one under Admin Console &rarr; Settings &rarr; Currencies.</li>\n<li><strong>Total Allocated doesn&rsquo;t match Transaction Amount</strong> &mdash; adjust allocation rows until Uncategorized is 0.00.</li>\n<li><strong>Can&rsquo;t pick a Supplier / Account</strong> &mdash; those records must exist first; create them in their setup areas.</li>\n<li><strong>Can&rsquo;t edit or delete a transaction</strong> &mdash; it&rsquo;s past Draft. Use <strong>Reverse</strong>.</li>\n<li><strong>An approved transaction&rsquo;s amount changed on its own</strong> &mdash; the FX rate for its period was updated; unlocked transactions are re-priced automatically. Lock it to freeze it.</li>\n<li><strong>An expense isn&rsquo;t listed in Bulk Payment</strong> &mdash; it&rsquo;s a Draft, already Paid, or belongs to a different vendor.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why does it say &ldquo;Primary Currency Required&rdquo; when I add a transaction?</summary><div class=\"faq-a\"><p>No primary currency is configured. Set one under <strong>Admin Console &rarr; Settings &rarr; Currencies</strong>, then return to Transactions &rarr; Add.</p></div></details>\n<details><summary>Why can&rsquo;t I edit or delete a transaction?</summary><div class=\"faq-a\"><p>Edit and Delete are only available while a transaction is a <strong>Draft</strong>. Once approved or paid, use <strong>Reverse</strong> to correct it, or <strong>Lock</strong> to freeze it.</p></div></details>\n<details><summary>Do income or transfers get marked Paid?</summary><div class=\"faq-a\"><p>No. Only <strong>expenses</strong> have a Paid/Unpaid step. Income, Withdrawal, Transfer, Refund and Adjustment are complete once <strong>Approved</strong>.</p></div></details>\n<details><summary>Why isn&rsquo;t an expense showing in Bulk Payment?</summary><div class=\"faq-a\"><p>Bulk Payment only lists <strong>Approved and Unpaid expenses</strong> for <strong>one vendor</strong>. Drafts, paid items, other vendors and non-expense types are excluded.</p></div></details>\n<details><summary>Can I split one transaction across multiple accounts?</summary><div class=\"faq-a\"><p>Yes. Under <strong>Classification / Allocations</strong>, click <strong>Add Allocation</strong> for each Chart Account and enter its amount &mdash; keep adding rows until <strong>Uncategorized</strong> reads 0.00.</p></div></details>\n</div>\n"
          },
          {
            "id": "currency",
            "name": "Currency & FX Rates",
            "icon": "cash",
            "body": "\n<p class=\"lead\">How multi-currency works in Accounting &mdash; your primary currency, exchange rates, and what happens to existing transactions when a rate changes.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Admin Console &rarr; Settings &rarr; Currencies.</p>\n\n<h2 id=\"primary\">Primary currency</h2>\n<ul class=\"bul\">\n<li>Each yacht has one <strong>primary currency</strong> &mdash; the currency every Accounting <strong>report</strong> is shown in, whatever currencies the transactions were entered in.</li>\n<li>Set it under <strong>Admin Console &rarr; Settings &rarr; Currencies</strong> &rarr; the <strong>Primary Currency</strong> pencil &rarr; <strong>Select Primary Currency</strong>.</li>\n<li>It must be set before you can create any transaction.</li>\n</ul>\n<div class=\"callout warn\"><div class=\"co-h\">Choose it carefully</div><p>Once transactions exist you <strong>can&rsquo;t change</strong> the primary currency &mdash; &ldquo;Changing the primary currency is strictly prohibited if transactions exist to preserve ledger integrity.&rdquo;</p></div>\n\n<h2 id=\"rates\">Exchange (FX) rates</h2>\n<p>When a transaction is in a different currency from your primary, Aquator converts it with an FX rate &mdash; that&rsquo;s the <strong>Primary Eqv.</strong> on its allocations and the amount that lands in your reports.</p>\n<ol class=\"steps\">\n<li>Go to <strong>Admin Console &rarr; Settings &rarr; Currencies</strong> (you need at least two currencies added to set a rate).</li>\n<li>On the currency-pair card under <strong>FX Rates</strong>, click <strong>Add</strong> / <strong>Edit</strong>.</li>\n<li>Set the <strong>Start Date</strong> (Effective From &mdash; required) and an optional <strong>End Date</strong>.</li>\n<li>Enter the rate (<strong>1 FROM = X TO</strong>); the inverse fills in automatically. Click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Rates are <strong>dated</strong>, so each pair keeps a history &mdash; the rate effective on a transaction&rsquo;s date is the one used. Deleting a rate restores the previous one as the active rate.</p></div>\n\n<h2 id=\"reprice\">Updating a rate re-prices existing transactions</h2>\n<div class=\"callout warn\"><div class=\"co-h\">Important</div><p>When you add or change an FX rate, Aquator <strong>automatically re-prices every transaction dated within that rate&rsquo;s period</strong> &mdash; including ones that are already <strong>Approved</strong> or <strong>Paid</strong>. Their primary-currency amounts, allocations and the figures in your reports all update, and each change is recorded in the transaction&rsquo;s <strong>History</strong>.</p></div>\n<ul class=\"bul\">\n<li><strong>Which transactions update:</strong> any <em>unlocked</em> transaction (Draft, Pending Approval, Approved or Paid) whose date falls in the rate&rsquo;s effective window and uses that currency pair.</li>\n<li><strong>What&rsquo;s protected:</strong> a <strong>Locked</strong> transaction is never re-priced &mdash; Lock it to pin its amounts to the rate that was in force. Reversed transactions are left alone too.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why did an approved (or paid) transaction&rsquo;s amount change?</summary><div class=\"faq-a\"><p>Someone updated the FX rate covering that date. Unlocked transactions in the period are re-priced automatically so reports stay consistent. To freeze one, open its row menu and choose <strong>Lock</strong>.</p></div></details>\n<details><summary>How do I stop a transaction from changing when rates update?</summary><div class=\"faq-a\"><p><strong>Lock</strong> it (row menu &rarr; Lock). A locked transaction keeps its amounts and FX rate no matter what later rate changes are made.</p></div></details>\n<details><summary>What currency are reports in?</summary><div class=\"faq-a\"><p>Always your <strong>primary currency</strong>. Other-currency amounts are converted using the FX rate effective on each transaction&rsquo;s date.</p></div></details>\n<details><summary>Can I change my primary currency later?</summary><div class=\"faq-a\"><p>Not once transactions exist &mdash; it&rsquo;s locked to protect ledger integrity. Set it correctly before you start recording transactions.</p></div></details>\n</div>\n"
          }
        ]
      }
    </script>
