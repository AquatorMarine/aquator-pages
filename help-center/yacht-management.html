    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Yacht Management covers two things: managing the <strong>yachts in your fleet</strong> (the company-level Yachts list) and the <strong>day-to-day collaboration tools inside each yacht</strong> &mdash; Chat, Calendar, To Do and Task Tracker.</p>\n\n<h2 id=\"two\">Two places, two jobs</h2>\n<ul class=\"bul\">\n<li><strong>Fleet (Yachts list)</strong> &mdash; add, edit, view and remove the vessels in your fleet, with each yacht&rsquo;s profile and regional settings. Found at <strong>Home &rsaquo; Company &rsaquo; Yachts</strong> (the <strong>Yachts</strong> item in the left navigation rail).</li>\n<li><strong>In-yacht tools</strong> &mdash; once you <strong>View</strong> (enter) a yacht, open <strong>Applications &rsaquo; Yacht Management</strong> in the sidebar for <strong>Chat, Calendar, To Do</strong> and <strong>Task Tracker</strong>.</li>\n</ul>\n<div class=\"callout tip\"><div class=\"co-h\">Fleet list vs a single yacht</div><p>The <strong>Yachts</strong> list is the company-wide fleet view. To work <em>inside</em> a yacht, open its <strong>&#8942; &rarr; View</strong> &mdash; that switches you into the selected yacht&rsquo;s workspace.</p></div>\n\n<h2 id=\"tools\">The collaboration tools</h2>\n<p>Inside a yacht these four are complementary:</p>\n<ul class=\"bul\">\n<li><strong>Chat</strong> &mdash; real-time messaging with crew and contacts.</li>\n<li><strong>Calendar</strong> &mdash; schedule events (one-off or recurring).</li>\n<li><strong>To Do</strong> &mdash; a personal checklist for quick reminders.</li>\n<li><strong>Task Tracker</strong> &mdash; formal, assignable work with due dates, departments, sub-tasks and a review status workflow.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>What&rsquo;s the difference between Chat, To Do and Task Tracker?</summary><div class=\"faq-a\"><p><strong>Chat</strong> is real-time messaging with crew and contacts. <strong>To Do</strong> is a personal checklist for quick reminders. <strong>Task Tracker</strong> is for formal, assignable tasks with due dates, departments, sub-tasks, attachments and a review status workflow. <strong>Calendar</strong> rounds it out for scheduling.</p></div></details>\n<details><summary>When should I use To Do vs Task Tracker?</summary><div class=\"faq-a\"><p><strong>To Do</strong> is for quick, personal items (title, description, priority, checkbox). <strong>Task Tracker</strong> is for trackable, shareable work (auto ID, Due Date, Assign To User, Department, Sub Tasks, attachments, full status workflow). To Do is for yourself; Task Tracker is for assigning and tracking work across the yacht.</p></div></details>\n</div>\n"
          },
          {
            "id": "fleet",
            "name": "Fleet (Yachts)",
            "icon": "id",
            "body": "\n<p class=\"lead\">The Yachts list is your company-wide fleet view &mdash; add, edit, view and remove vessels, each with its profile details and regional settings. Open it from <strong>Yachts</strong> in the left navigation rail (<strong>Home &rsaquo; Company &rsaquo; Yachts</strong>).</p>\n\n<h2 id=\"add\">Add a new yacht</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>Have the yacht&rsquo;s basic particulars ready (builder, model, length, GT, year, flag) &mdash; but everything can be edited later, so you don&rsquo;t need it all up front.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Yachts</strong> and click <strong>Add</strong> (top right).</li>\n<li>In the <strong>Add Yacht</strong> window, fill in: <strong>Yacht Name, Account Name, Yacht Builder, Yacht Model, Length, GT, Year, Flag</strong>.</li>\n<li>Set <strong>Date Format</strong> (DD MMM YYYY, DD/MM/YYYY, MM/DD/YYYY or YYYY/MM/DD) and <strong>Currency</strong> (the yacht&rsquo;s operating currency).</li>\n<li>Add <strong>Employer Name</strong> and <strong>Employer Address</strong>.</li>\n<li>(Optional) Use the camera icon for a cover image and <strong>Profile Picture</strong> for the avatar.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The window closes and the yacht appears as a row in the Yachts list (name, account, builder, model, length, GT, year, flag).</p>\n<div class=\"callout note\"><div class=\"co-h\">Window closed but no yacht appeared?</div><p>The record didn&rsquo;t save &mdash; re-open <strong>Add</strong> and make sure at least <strong>Yacht Name</strong> and <strong>Account Name</strong> are completed before Save. &ldquo;No Rows To Show&rdquo; means no yachts exist yet, or a Search/Filter is hiding them &mdash; clear them.</p></div>\n\n<h2 id=\"edit\">Edit a yacht&rsquo;s details</h2>\n<ol class=\"steps\">\n<li>On the yacht&rsquo;s row, click the actions menu (<strong>&#8942;</strong>) in the <strong>Action</strong> column.</li>\n<li>Click <strong>Edit</strong>.</li>\n<li>Update any field &mdash; the form matches Add Yacht and is pre-filled with current values.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The list reflects your changes immediately.</p>\n<div class=\"callout note\"><div class=\"co-h\">Changes didn&rsquo;t appear?</div><p>Confirm you clicked <strong>Save</strong> (not Cancel or <strong>&times;</strong>) on the right yacht. If <strong>Currency</strong> shows &ldquo;Select&hellip;&rdquo; on an existing yacht, it was never set &mdash; choose one and Save.</p></div>\n\n<h2 id=\"actions\">View vs Edit vs Delete</h2>\n<p>Each row&rsquo;s <strong>&#8942;</strong> menu has three actions that do very different things:</p>\n<table class=\"ftab\"><thead><tr><th>Action</th><th>What it does</th></tr></thead><tbody>\n<tr><td class=\"t-name\">View</td><td>Opens that yacht&rsquo;s full workspace/dashboard &mdash; you leave the fleet list and switch into the yacht to work in its modules.</td></tr>\n<tr><td class=\"t-name\">Edit</td><td>Opens the Edit Yacht form in a pop-up to change profile details without leaving the list.</td></tr>\n<tr><td class=\"t-name\">Delete</td><td>Permanently removes the yacht and its related data, after a confirmation prompt.</td></tr>\n</tbody></table>\n<div class=\"callout note\"><div class=\"co-h\">The &ldquo;+&rdquo; expander</div><p>The <strong>+</strong> at the start of each row isn&rsquo;t View or Edit &mdash; it expands an inline status panel summarising that yacht&rsquo;s Payslips, Crew Leave, YM/PMS/Refit tasks, Board (In/Out), HOWR, SMS, Certificates and Drills at a glance.</p></div>\n\n<h2 id=\"regional\">Date Format &amp; Currency</h2>\n<p>These are <strong>per-yacht</strong> regional settings, so different yachts in the same fleet can differ:</p>\n<ul class=\"bul\">\n<li><strong>Date Format</strong> &mdash; how dates display for the yacht (DD MMM YYYY, DD/MM/YYYY, MM/DD/YYYY, YYYY/MM/DD).</li>\n<li><strong>Currency</strong> &mdash; the yacht&rsquo;s operating currency, from the currency list (e.g. AUD, BRL&hellip;).</li>\n</ul>\n<p>They&rsquo;re independent &mdash; set both &mdash; and can be changed any time via <strong>Edit</strong>.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Can I delete a yacht, and what happens to its data?</summary><div class=\"faq-a\"><p>Yes &mdash; <strong>&#8942; &rarr; Delete</strong>, then confirm. This is a <strong>cascading, permanent</strong> action: it removes the yacht&rsquo;s associated records, not just the list entry. If you only need to fix details, use <strong>Edit</strong>. Nothing is removed until you confirm with <strong>Delete</strong>.</p></div></details>\n</div>\n"
          },
          {
            "id": "chat",
            "name": "Chat",
            "icon": "phone",
            "body": "\n<p class=\"lead\">Chat is real-time messaging with the crew and contacts on a yacht. Open it inside a yacht at <strong>Yacht Management &rsaquo; Chat</strong>.</p>\n\n<h2 id=\"send\">Send a message</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>You must be inside a yacht. The person you want needs to appear under <strong>Contacts</strong> (e.g. crew members, Aquator SMS).</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Yacht Management &rsaquo; Chat</strong>.</li>\n<li>Pick who to message: click an existing thread under <strong>Chats</strong>, or a name under <strong>Contacts</strong> to start a new one. You can also use <strong>Search or start a new chat</strong> at the top.</li>\n<li>Type in the <strong>Type your message&hellip;</strong> box at the bottom.</li>\n<li>Click <strong>Send</strong>.</li>\n</ol>\n<p>Your message appears in the thread on the right, grouped by date with a timestamp, and the thread moves into your <strong>Chats</strong> list for quick access.</p>\n<div class=\"callout note\"><div class=\"co-h\">Right pane only shows &ldquo;Start Conversation&rdquo;?</div><p>No thread is selected &mdash; click a contact or existing chat first. If you can&rsquo;t find a person, they may not be a contact on this yacht; use the search box.</p></div>\n"
          },
          {
            "id": "calendar",
            "name": "Calendar",
            "icon": "calendar",
            "body": "\n<p class=\"lead\">The Calendar schedules events inside a yacht &mdash; one-off or recurring &mdash; with colour coding and multiple views.</p>\n\n<h2 id=\"add\">Add an event</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Yacht Management &rsaquo; Calendar</strong>.</li>\n<li>Click <strong>New Event</strong> (or <strong>New Recurring Event</strong> for something that repeats).</li>\n<li>Fill in the event window: <strong>Event Color, Title, Location, Start</strong> and <strong>End</strong> (each with date + time pickers), <strong>Assign To</strong>, <strong>All day</strong> and/or <strong>Timezone</strong>, <strong>Repeat</strong> (default Never) and <strong>Description</strong>.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The event appears on the grid in the chosen colour. Use the view toggles (Day, Week, WorkWeek, Month, Year, Agenda, Timeline Views, Grid) and <strong>Today</strong> / the date navigator to find it. <strong>Print</strong> or <strong>Export</strong> from the toolbar.</p>\n<div class=\"callout note\"><div class=\"co-h\">Event on the wrong day/time?</div><p>Check the <strong>Start/End</strong> pickers and the <strong>Timezone</strong> checkbox &mdash; the header clock shows current UTC for reference. To repeat an event, use <strong>Repeat</strong> in the form or start from <strong>New Recurring Event</strong>.</p></div>\n\n<h2 id=\"edit\">Edit an event</h2>\n<ol class=\"steps\">\n<li>Locate the event (switch views or use the date navigator if needed) and click it to open.</li>\n<li>Update any field &mdash; Title, Location, Start, End, Assign To, Repeat, Description, etc.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The calendar updates immediately. If you can&rsquo;t find an event, switch to <strong>Month</strong> or <strong>Agenda</strong> view, or use <strong>Today</strong> and the date arrows.</p>\n"
          },
          {
            "id": "todo",
            "name": "To Do",
            "icon": "receipt",
            "body": "\n<p class=\"lead\">To Do is a lightweight personal checklist inside a yacht. For assignable, tracked work, use <strong>Task Tracker</strong> instead.</p>\n\n<h2 id=\"add\">Add a To Do task</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Yacht Management &rsaquo; To Do</strong> and click <strong>Add</strong>.</li>\n<li>In <strong>Add Task</strong>, set the priority (<strong>High, Medium</strong> or <strong>Low</strong> &mdash; defaults to Low) and add a <strong>Title</strong> and <strong>Description</strong>. The icon row also lets you set a date and label.</li>\n<li>Click <strong>Add Task</strong>.</li>\n</ol>\n<p>The task appears in the list. Tick its checkbox to mark it complete &mdash; completed items show with a strikethrough; un-tick to undo.</p>\n<div class=\"callout note\"><div class=\"co-h\">Can&rsquo;t find a task?</div><p>Use <strong>Search tasks&hellip;</strong> or check <strong>Filters</strong> at the top.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>When should I use To Do vs Task Tracker?</summary><div class=\"faq-a\"><p>Use <strong>To Do</strong> for quick, personal checklist items. Use <strong>Task Tracker</strong> for trackable, shareable work with an auto ID, Due Date, Assign To User, Department, Sub Tasks, attachments and a full status workflow. To Do is for yourself; Task Tracker is for assigning and tracking work across the yacht.</p></div></details>\n</div>\n"
          },
          {
            "id": "tasktracker",
            "name": "Task Tracker",
            "icon": "contract",
            "body": "\n<p class=\"lead\">Task Tracker handles formal, assignable work inside a yacht &mdash; with due dates, departments, sub-tasks, attachments and a review status workflow.</p>\n\n<h2 id=\"add\">Create a task</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>To assign the task, the person should appear in <strong>Assign To User</strong> and the relevant <strong>Department</strong> should exist.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Yacht Management &rsaquo; Task Tracker</strong> and click <strong>Add</strong>.</li>\n<li>Enter a <strong>Title</strong> and, optionally, <strong>Sub Tasks</strong> via <strong>+ Add Sub Task</strong>.</li>\n<li>Set <strong>Due Date</strong> (date + time), <strong>Assign To User</strong>, <strong>Priority</strong> (None, Low, Medium, High &mdash; defaults to None) and <strong>Department</strong>.</li>\n<li>Add a <strong>Description</strong> and any <strong>Images / Files</strong> (PNG, JPG, PDF, DOC, XLS; max 100&nbsp;MB).</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The task appears as a row (Title, ID, Due Date, Assign To User, Priority, Status, Department, Actions) with Status <span class=\"chip neutralchip\">Open</span> and an auto-assigned ID.</p>\n<div class=\"callout note\"><div class=\"co-h\">No Status field in the Add form?</div><p>That&rsquo;s expected &mdash; new tasks start as <strong>Open</strong>; you set status afterward from the list. If a department/assignee is missing from the dropdown, it hasn&rsquo;t been set up for this yacht yet.</p></div>\n\n<h2 id=\"update\">Update status or priority</h2>\n<ol class=\"steps\">\n<li>Find the task&rsquo;s row (scroll the table sideways to reach the <strong>Priority</strong> and <strong>Status</strong> columns if needed).</li>\n<li>Click the <strong>Status</strong> cell and choose a value (Open, On Hold, In Progress, Done, Approved, Rejected), or click the <strong>Priority</strong> cell to change it inline.</li>\n</ol>\n<p>The change saves on selection and the row&rsquo;s badge updates immediately. If you don&rsquo;t see a dropdown, click directly on the Status value/chevron in that row.</p>\n\n<h2 id=\"statuses\">How statuses work</h2>\n<p>Each task carries a <strong>Status</strong> reflecting where it sits in its lifecycle. Status is set from the row, not the Add form &mdash; new tasks always begin as <strong>Open</strong>.</p>\n<table class=\"ftab\"><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody>\n<tr><td><span class=\"chip neutralchip\">Open</span></td><td>Newly created, not yet started (the default).</td></tr>\n<tr><td><span class=\"chip warnchip\">On Hold</span></td><td>Paused &mdash; work intentionally stopped for now.</td></tr>\n<tr><td><span class=\"chip warnchip\">In Progress</span></td><td>Actively being worked on.</td></tr>\n<tr><td><span class=\"chip neutralchip\">Done</span></td><td>Finished and ready for review.</td></tr>\n<tr><td><span class=\"chip okchip\">Approved</span></td><td>Reviewed and signed off (terminal &ldquo;accepted&rdquo;).</td></tr>\n<tr><td><span class=\"chip badchip\">Rejected</span></td><td>Reviewed and not accepted (terminal &ldquo;declined&rdquo;).</td></tr>\n</tbody></table>\n<div class=\"callout tip\"><div class=\"co-h\">Done vs Approved/Rejected</div><p>The split after Done is what lets the tracker double as a review/sign-off workflow: <strong>Done</strong> signals ready for review, while <strong>Approved</strong> / <strong>Rejected</strong> record the review outcome.</p></div>\n"
          }
        ]
      }
    </script>
