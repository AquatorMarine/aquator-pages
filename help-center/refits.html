    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Plan, schedule, track, and budget yacht refit projects across six linked views &mdash; <strong>Project Tracker</strong>, <strong>Project Planner</strong>, <strong>Calendar</strong>, <strong>Gantt Chart</strong>, <strong>Project Finance</strong> and <strong>Scrum Board</strong>.</p>\n\n<h2 id=\"where\">Where to find it</h2>\n<p>Open from the sidebar at <strong>Technical &rarr; Refits</strong>, or via the breadcrumb <strong>Home &rsaquo; Applications &rsaquo; Refits</strong>.</p>\n\n<h2 id=\"inside\">The six views</h2>\n<p>Every view reads from the same set of refit tasks &mdash; a change in one is reflected in the others:</p>\n<ul class=\"bul\">\n<li><strong>Project Tracker</strong> &mdash; the master task table, with inline status and filters.</li>\n<li><strong>Project Planner</strong> &mdash; a marker table plus a Plan View for placing pins on an uploaded deck plan.</li>\n<li><strong>Calendar</strong> &mdash; scheduled work shown by date.</li>\n<li><strong>Gantt Chart</strong> &mdash; tasks plotted as bars across a timeline.</li>\n<li><strong>Project Finance</strong> &mdash; budgets, balances and expense charts per project.</li>\n<li><strong>Scrum Board</strong> &mdash; a kanban board with customizable columns and per-assignee swimlanes.</li>\n</ul>\n\n<h2 id=\"start\">Before you start</h2>\n<ul class=\"bul\">\n<li>Make sure a <strong>yacht is selected</strong> (e.g. M/Y Horizon) &mdash; tasks are created against the active yacht.</li>\n<li>To assign a task to someone, that person must already be a <strong>user on the yacht</strong>; the Assign To User list only shows existing users.</li>\n</ul>\n<div class=\"callout tip\"><div class=\"co-h\">Heads up</div><p>The <strong>Project Planner</strong> table ships with a <strong>Type</strong> filter applied by default, so it can look empty even when tasks exist. See <strong>Project Planner</strong> for how to clear it.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Do the views share the same tasks?</summary><div class=\"faq-a\"><p>Yes. Add or update a task in any view and it syncs to Project Tracker, Calendar, Gantt, Scrum Board and Planner.</p></div></details>\n<details><summary>Where do I add my first task?</summary><div class=\"faq-a\"><p><strong>Technical &rarr; Refits &rarr; Project Tracker</strong> (or Project Planner) &rarr; <strong>Add</strong>. See <strong>Tasks</strong>.</p></div></details>\n</div>\n"
          },
          {
            "id": "tasks",
            "name": "Tasks",
            "icon": "contract",
            "body": "\n<p class=\"lead\">A refit task (also called a <strong>marker</strong>) is one work item. Create it once and it appears across every Refit view. This page covers adding, tracking, grouping and the status options.</p>\n\n<h2 id=\"add\">Add a task (marker)</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>A <strong>yacht</strong> must be selected, and anyone you want to assign must already be a <strong>user</strong> on that yacht.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Project Planner</strong> (or <strong>Project Tracker</strong>).</li>\n<li>Click <strong>Add</strong> (top right) &mdash; the <strong>Add Markers</strong> dialog opens.</li>\n<li>Enter a <strong>Title</strong> and pick a <strong>Type</strong>: Charter, Contractor, Deck maintenance, Engineer maintenance, Equipment, Interior, Maintenance, Provisions, Refit or Safety.</li>\n<li>Set the rest as needed: <strong>Tags</strong>, <strong>Progress</strong> (0&ndash;100), <strong>Status</strong>, <strong>Due Date</strong>, <strong>Priority</strong> (None, High, Medium, Low), <strong>Assign To User</strong>, <strong>Price</strong> and <strong>Description</strong>.</li>\n<li>Optionally attach evidence under <strong>Images / Files</strong>.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The task appears in the Project Tracker table and is reflected in the Calendar, Gantt Chart and Scrum Board. If you set a <strong>Due Date</strong>, it lands on the Calendar on that date.</p>\n<div class=\"callout warn\"><div class=\"co-h\">Assign To User list empty?</div><p>That person isn&rsquo;t a user on this yacht yet &mdash; add them under Crew/Users first.</p></div>\n\n<h2 id=\"track\">Track tasks in Project Tracker</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Project Tracker</strong>.</li>\n<li>Use <strong>Search</strong> to find a task by title, or <strong>Filters</strong> to narrow the list.</li>\n<li>Review tasks across the columns: <strong>Title, ID, Start Date, End Date, Assign To User, Priority, Status, Department, Actions</strong>.</li>\n<li>To change a task&rsquo;s status inline, use the status dropdown in its row.</li>\n<li>Use <strong>Add</strong> to create a task, <strong>Export</strong> to download the list, and <strong>Events</strong> to group tasks.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Reading the table</div><p>A task showing two or more names (e.g. &ldquo;Jim Blue, +2&rdquo;) has multiple assignees &mdash; the &ldquo;+2&rdquo; means two more. A number on the <strong>Active View</strong> badge means a saved filter is applied; click <strong>Clear All</strong> to see every task.</p></div>\n\n<h2 id=\"events\">Group tasks into an Event</h2>\n<p>In Project Tracker, click <strong>Events</strong>. In the <strong>All Events</strong> panel, click <strong>+ Create</strong> to make a new event, or use the icons next to an existing event to run (play), edit (pencil) or delete (trash) it. Each event bundles one or more tasks (shown as &ldquo;1 task&rdquo;, etc.) so related jobs can be managed together.</p>\n<div class=\"callout warn\"><div class=\"co-h\">Deleting is destructive</div><p>Deleting an event removes the grouping. Confirm before deleting.</p></div>\n\n<h2 id=\"statuses\">How task statuses work</h2>\n<p>Six statuses are available when creating or editing a task:</p>\n<table class=\"ftab\"><thead><tr><th>Status</th><th>What it means</th></tr></thead><tbody>\n<tr><td><span class=\"chip neutralchip\">Open</span></td><td>Logged; active work not yet started or sitting in the queue.</td></tr>\n<tr><td><span class=\"chip warnchip\">In Progress</span></td><td>Active work underway.</td></tr>\n<tr><td><span class=\"chip warnchip\">On Hold</span></td><td>Paused without closing.</td></tr>\n<tr><td><span class=\"chip neutralchip\">Done</span></td><td>Work finished.</td></tr>\n<tr><td><span class=\"chip okchip\">Approved</span></td><td>Accepted on review.</td></tr>\n<tr><td><span class=\"chip badchip\">Rejected</span></td><td>Not accepted on review.</td></tr>\n</tbody></table>\n<div class=\"callout tip\"><div class=\"co-h\">Statuses are not Scrum columns</div><p>These six are fixed. The <strong>Scrum Board</strong> columns are fully customizable per yacht, so a column labeled &ldquo;Competed&rdquo; or &ldquo;Purchase&rdquo; is a crew-created lane, not one of the six statuses.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Can I attach files to a task?</summary><div class=\"faq-a\"><p>Yes &mdash; use the <strong>Images / Files</strong> area in the Add Markers dialog (drag &amp; drop or browse). Accepted: PNG, JPG, PDF, DOC, XLS, up to 100&nbsp;MB per file.</p></div></details>\n<details><summary>My new task doesn&rsquo;t show in Project Planner.</summary><div class=\"faq-a\"><p>Project Planner applies a <strong>Type</strong> filter by default. Click <strong>Filters &rarr; Clear All</strong>. See <strong>Project Planner</strong>.</p></div></details>\n<details><summary>What does &ldquo;Jim Blue, +2&rdquo; mean?</summary><div class=\"faq-a\"><p>The task has multiple assignees &mdash; one named plus two more.</p></div></details>\n</div>\n"
          },
          {
            "id": "planner",
            "name": "Project Planner",
            "icon": "tag",
            "body": "\n<p class=\"lead\">Project Planner has two faces: a <strong>marker table</strong> and a <strong>Plan View</strong> that places task markers as pins on an uploaded deck plan.</p>\n\n<h2 id=\"toggle\">Switch between table and Plan View</h2>\n<p>Use the two view-toggle icons at the top right of the toolbar: the <strong>grid</strong> icon shows the marker table; the <strong>map-pin</strong> icon opens <strong>Plan View</strong>.</p>\n\n<h2 id=\"upload\">Upload a plan and place markers</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Project Planner</strong>.</li>\n<li>Click <strong>Upload</strong> to add a yacht plan or deck drawing (image or document).</li>\n<li>Switch to <strong>Plan View</strong> (map-pin icon) to place and view markers on the plan.</li>\n</ol>\n<p>Markers (tasks created via <strong>Add</strong>) appear as pins on the uploaded plan, giving a visual layout of where each refit job is located onboard.</p>\n<div class=\"callout note\"><div class=\"co-h\">Plan View is blank?</div><p>Either no plan has been uploaded yet, or a <strong>Type</strong> filter is hiding the markers. A <strong>&ldquo;Location permission required&rdquo;</strong> notice is informational &mdash; it doesn&rsquo;t block uploading or placing markers.</p></div>\n\n<h2 id=\"norows\">Why does it say &ldquo;No Rows To Show&rdquo;?</h2>\n<p>The Project Planner table applies a <strong>Type</strong> filter by default &mdash; shown by the <strong>Active View</strong> badge reading <strong>1</strong>. An empty marker list usually means tasks exist but are hidden by that filter, not that data is missing.</p>\n<div class=\"callout tip\"><div class=\"co-h\">Fix</div><p>Click <strong>Filters &rarr; Clear All</strong> (or <strong>Clear All</strong> next to Active View) to show everything. If unsure whether tasks exist, check <strong>Project Tracker</strong>, which doesn&rsquo;t carry the same default filter.</p></div>\n"
          },
          {
            "id": "schedule",
            "name": "Calendar &amp; Gantt",
            "icon": "calendar",
            "body": "\n<p class=\"lead\">The Calendar and Gantt Chart both visualize the same refit tasks by date &mdash; the Calendar by day/week/month, the Gantt as bars across a timeline.</p>\n\n<h2 id=\"calendar\">Schedule and view work on the Calendar</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Calendar</strong>.</li>\n<li>Choose a view: <strong>Day, Week, WorkWeek, Month, Year, Agenda, Timeline Views</strong> or <strong>Grid</strong>.</li>\n<li>Click <strong>New Event</strong> or <strong>New Recurring Event</strong> to add scheduled work.</li>\n<li>Navigate with the arrows or <strong>Today</strong>; use <strong>Print</strong> or <strong>Export</strong> to output the schedule.</li>\n</ol>\n<p>Tasks with due/scheduled dates from Project Tracker appear as colored bars (e.g. &ldquo;Plumbing System Check&rdquo;, &ldquo;Engine Overhaul&rdquo;).</p>\n<div class=\"callout note\"><div class=\"co-h\">A day shows &ldquo;+2 more&rdquo;?</div><p>More events exist than fit in the cell &mdash; click it to expand.</p></div>\n\n<h2 id=\"gantt\">Read and update the Gantt Chart</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Gantt Chart</strong>.</li>\n<li>Each row is a task (by <strong>ID</strong> and <strong>Name</strong>) plotted as a bar across the timeline.</li>\n<li>Use the toolbar: <strong>Add, Expand all, Collapse all, Previous timespan, Next timespan, Excel export, CSV export</strong>.</li>\n</ol>\n<p>The chart visualizes start/end dates and overlaps across the refit. Exports produce an Excel or CSV copy of the schedule.</p>\n"
          },
          {
            "id": "finance",
            "name": "Project Finance",
            "icon": "cash",
            "body": "\n<p class=\"lead\">Project Finance gives each refit project a fixed budget in a chosen currency, then tracks spend against it &mdash; with a remaining balance and expense charts.</p>\n\n<h2 id=\"create\">Create a refit budget</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>Decide the project&rsquo;s <strong>date range</strong>, <strong>budget amount</strong> and <strong>currency</strong> first.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Project Finance</strong>.</li>\n<li>Click <strong>Add</strong> and set <strong>Name</strong>, <strong>Project Date</strong> (range), <strong>Yacht</strong>, <strong>Budget</strong> and <strong>Currency</strong>. Click <strong>Save</strong>.</li>\n<li>On the projects list (columns: <strong>Name, Project Date, Yacht, Budget, Balance, Actions</strong>), open a row&rsquo;s <strong>&#8942;</strong> menu for <strong>View, Fill, Edit, Delete</strong> or <strong>Export</strong>.</li>\n<li>Click <strong>View</strong> to open <strong>Project Details</strong>.</li>\n</ol>\n\n<h2 id=\"details\">Reading Project Details</h2>\n<p>Project Details shows summary cards (<strong>Name, Yacht, Project Date, Budget, Vendors</strong>) and three charts:</p>\n<ul class=\"bul\">\n<li><strong>Expenses &raquo; Date</strong> &mdash; a burn-down line of spend over time, from the full budget.</li>\n<li><strong>Expenses By Category</strong> &mdash; where the money went.</li>\n<li><strong>Budget &raquo; Total Expenses</strong> &mdash; a donut showing the percentage of budget consumed.</li>\n</ul>\n\n<h2 id=\"relate\">How budget, balance and expenses relate</h2>\n<p>The <strong>Budget</strong> is fixed when the project is created. <strong>Balance</strong> is what remains after logged expenses are deducted &mdash; it starts equal to Budget and drops as costs are recorded with <strong>Fill</strong>. Because currency is set <strong>per project</strong>, two projects can display different symbols (one &euro;, one $) and are never merged or converted.</p>\n<div class=\"callout note\"><div class=\"co-h\">Balance looks unchanged?</div><p>No expenses have been logged yet &mdash; use <strong>Fill</strong> on the project to record spend.</p></div>\n"
          },
          {
            "id": "scrum",
            "name": "Scrum Board",
            "icon": "chart",
            "body": "\n<p class=\"lead\">The Scrum Board is a kanban view of refit tasks &mdash; cards in customizable columns, grouped into swimlanes by assignee.</p>\n\n<h2 id=\"use\">Use the board</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Technical &rarr; Refits &rarr; Scrum Board</strong>.</li>\n<li>Cards sit in columns (default: <strong>Task, In Progress, Open, Review, Competed, Purchase</strong>) and in swimlane rows grouped by assignee (e.g. &ldquo;Jack &ndash; 8 items&rdquo;, &ldquo;Jane &ndash; 1 items&rdquo;).</li>\n<li>Drag a card between columns to change its state.</li>\n<li>Click <strong>Settings</strong> to manage columns (<strong>Label / Actions</strong> tabs): add, rename (pencil), reorder (drag handle) or delete columns. Use <strong>Add</strong> to add a card and <strong>Save</strong> to persist changes.</li>\n</ol>\n<div class=\"callout warn\"><div class=\"co-h\">A column named &ldquo;Competed&rdquo;</div><p>This is a custom, user-renamed column (a typo for &ldquo;Completed&rdquo;), not a system status. Rename it via <strong>Settings &rarr; Label &rarr; pencil</strong> if needed.</p></div>\n<div class=\"callout note\"><div class=\"co-h\">&ldquo;No cards to display&rdquo;</div><p>That assignee simply has no cards in that column &mdash; nothing is wrong.</p></div>\n\n<h2 id=\"vs-status\">Columns vs statuses</h2>\n<p>Scrum columns are fully customizable per yacht and can be renamed or added to. They are <strong>not</strong> the six fixed task statuses (Open, On Hold, In Progress, Done, Approved, Rejected) &mdash; see <strong>Tasks</strong> for those.</p>\n"
          }
        ]
      }
    </script>
