    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Your personal profile area in Aquator Marine &mdash; manage your account identity, security, personal and contact details, employment (SEA) records, certificates, leave, and files. Reached via <strong>Admin Console &rarr; Personal &rarr; Personal Settings</strong>, then the horizontal tab bar.</p>\n\n<h2 id=\"tabs\">The tab bar</h2>\n<p>Left to right: <strong>Account &middot; Change Password &middot; Personal Information &middot; Address &middot; Employment &middot; Certificates &middot; Leave &middot; Emergency Contact &middot; File Manager &middot; Social Links</strong>. The bar scrolls horizontally &mdash; use the <strong>&lsaquo; &rsaquo;</strong> arrows at either end if a tab is off-screen.</p>\n<div class=\"callout note\"><div class=\"co-h\">Subcollection: SEA (under Employment)</div><p>The <strong>Employment</strong> tab nests its own sub-tabs: <strong>SEA, Leave Details, Bank Details</strong> and <strong>Payslip</strong>. That&rsquo;s where contracts, salary and pay live &mdash; see <strong>Employment &amp; SEA</strong> and <strong>Leave</strong>.</p></div>\n\n<h2 id=\"concepts\">The non-obvious bits worth reading first</h2>\n<p>A few things the UI never explains cause most questions:</p>\n<ul class=\"bul\">\n<li><strong>Salary calculation</strong> &mdash; why a payslip total differs from the headline salary (see <strong>Employment &amp; SEA</strong>).</li>\n<li><strong>Leave types</strong> &mdash; why your balance sometimes doesn&rsquo;t drop after a leave is approved (see <strong>Leave</strong>).</li>\n<li><strong>&ldquo;No active contract&rdquo;</strong> &mdash; why a payslip can&rsquo;t generate (see <strong>Employment &amp; SEA</strong>).</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why can&rsquo;t I edit my email or company on the Account tab?</summary><div class=\"faq-a\"><p>The <strong>Email</strong> and <strong>Yacht / Company</strong> fields show a lock icon and are read-only &mdash; they&rsquo;re managed at the company/administrator level. Contact your administrator to change them.</p></div></details>\n<details><summary>Do tabs save independently?</summary><div class=\"faq-a\"><p>Most tabs have their own <strong>Save</strong> and <strong>Reset</strong> &mdash; save the tab you&rsquo;re working on before switching.</p></div></details>\n</div>\n"
          },
          {
            "id": "account",
            "name": "Account &amp; Security",
            "icon": "id",
            "body": "\n<p class=\"lead\">The Account and Change Password tabs hold your identity, profile branding, two-factor authentication and password.</p>\n\n<h2 id=\"branding\">Profile picture &amp; cover image</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>Have an image ready in <strong>JPG, GIF or PNG, max 2&nbsp;MB</strong>.</p></div>\n<ol class=\"steps\">\n<li>On the <strong>Account</strong> tab, find <strong>Profile Branding</strong>.</li>\n<li>Click <strong>Upload Cover</strong> for the banner, or <strong>Upload</strong> (under Profile Picture) for your avatar.</li>\n<li>Select your image &mdash; it previews immediately. Use <strong>Remove</strong> to clear an existing image.</li>\n</ol>\n\n<h2 id=\"identity\">Account identity</h2>\n<ol class=\"steps\">\n<li>In <strong>Account Identity</strong>, edit <strong>Username, First Name</strong> and <strong>Last Name</strong>.</li>\n<li>Click <strong>Save</strong> (or <strong>Reset</strong> to discard).</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Locked fields</div><p><strong>Email</strong> and <strong>Yacht / Company</strong> show a lock icon and are read-only &mdash; they&rsquo;re managed at the company/admin level. Contact your administrator to change them.</p></div>\n\n<h2 id=\"2fa\">Two-factor authentication (2FA)</h2>\n<p>On the <strong>Account</strong> tab, scroll to <strong>Two-Factor Authentication</strong> and toggle on <strong>Email verification</strong> (&ldquo;Enable to require a verification code on each login&rdquo;). At each future login you&rsquo;ll enter a code sent to your account email &mdash; so make sure your email is correct first.</p>\n\n<h2 id=\"password\">Change your password</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Change Password</strong> tab.</li>\n<li>Enter your <strong>Old Password</strong>, then your <strong>New Password</strong> and <strong>Confirm Password</strong> (use the eye icon to show/hide).</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>Your password updates immediately. If you see &ldquo;passwords don&rsquo;t match,&rdquo; the New and Confirm fields must be identical.</p>\n"
          },
          {
            "id": "personal",
            "name": "Personal Information",
            "icon": "receipt",
            "body": "\n<p class=\"lead\">The Personal Information tab holds your basic details plus passport, visa and seaman&rsquo;s book records.</p>\n\n<h2 id=\"basic\">Complete your personal information</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Personal Information</strong> tab.</li>\n<li>Fill in: <strong>ID, Birth Date, Birth Place, Languages</strong> (add multiple as tags), <strong>Phone Number</strong> (with country-code selector), <strong>Nationality, Rank</strong> (dropdown), <strong>Gender</strong> (Male / Female / Others) and <strong>Bio</strong>.</li>\n<li>Click <strong>Save</strong> (or <strong>Reset</strong> to revert).</li>\n</ol>\n<p>Your details feed other areas of the platform (e.g. crew records).</p>\n\n<h2 id=\"documents\">Passport, visa &amp; seaman&rsquo;s book</h2>\n<p>Scroll below the basic details:</p>\n<ul class=\"bul\">\n<li><strong>Passport Details</strong> &mdash; complete the Primary Passport (Passport Number, Country of Passport, Expiry Date). Click <strong>Add Passport Details</strong> for an additional passport.</li>\n<li><strong>Visa Details</strong> &mdash; complete the Primary Visa (Issuing Country, Name of Visa, Issue Date, Expiry Date). Click <strong>Add Visa Details</strong> for more.</li>\n<li><strong>Seamans Book Details</strong> &mdash; enter the Issuing Country and Seamans Book Number.</li>\n</ul>\n<p>Click <strong>Save</strong> to store them for travel and maritime identification.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Can I record more than one passport or visa?</summary><div class=\"faq-a\"><p>Yes &mdash; use <strong>Add Passport Details</strong> and <strong>Add Visa Details</strong> to record additional documents beyond the primary one.</p></div></details>\n</div>\n"
          },
          {
            "id": "contact",
            "name": "Contact &amp; Social",
            "icon": "phone",
            "body": "\n<p class=\"lead\">Your address, emergency contact and social links.</p>\n\n<h2 id=\"address\">Address</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Address</strong> tab.</li>\n<li>Complete <strong>Address Line 1, Address Line 2, Post Code, City, State, Country</strong> (dropdown) and <strong>Zip/Postal Code</strong>.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>Your address is stored for official correspondence.</p>\n\n<h2 id=\"emergency\">Emergency contact</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Emergency Contact</strong> tab.</li>\n<li>Enter <strong>Name, Relationship, Phone Number, Email, Address, Country</strong> (dropdown), <strong>City, State, Post Code</strong>.</li>\n<li>Answer <strong>&ldquo;Does the Contact Speak English? (Yes/No)&rdquo;</strong> and click <strong>Save</strong>.</li>\n</ol>\n\n<h2 id=\"social\">Social links</h2>\n<p>On the <strong>Social Links</strong> tab, fill in any of <strong>Website, Facebook, Instagram, Youtube, Twitter, LinkedIn</strong> and click <strong>Save</strong> (or <strong>Reset</strong> to revert).</p>\n"
          },
          {
            "id": "certs-files",
            "name": "Certificates &amp; Files",
            "icon": "badge",
            "body": "\n<p class=\"lead\">Manage your certificates and your personal files.</p>\n\n<h2 id=\"certificates\">Certificates</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Certificates</strong> tab.</li>\n<li>Each row shows: Certificate Name, Number, Frequency, Issuer, Duration, Issue Date, Notification Date, Expiry Date, Notes, Status, plus <strong>Actions</strong> (scroll horizontally for all columns).</li>\n<li>Click <strong>Bulk Upload</strong> to add many certificates at once, or <strong>Export</strong> to download your list.</li>\n</ol>\n<p>Certificates appear with their status; expiry and notification dates drive renewal reminders. <strong>&ldquo;No Rows To Show&rdquo;</strong> means none exist yet (or the list is loading) &mdash; add one via Bulk Upload, then <strong>Refresh</strong>.</p>\n\n<h2 id=\"files\">File Manager</h2>\n<ol class=\"steps\">\n<li>Open the <strong>File Manager</strong> tab.</li>\n<li>Browse the folder tree on the left (e.g. SEA, Medical Info, Leave Request, Crew Docs) or the grid on the right.</li>\n<li>Click <strong>New folder</strong> to create a folder, or <strong>Upload</strong> to add files. Use <strong>Sort by</strong>, <strong>Refresh</strong>, the search box, and the grid/list toggle (top-right).</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Downloading or uploading files may require confirmation depending on your environment&rsquo;s policies.</p></div>\n"
          },
          {
            "id": "employment",
            "name": "Employment &amp; SEA",
            "icon": "contract",
            "body": "\n<p class=\"lead\">The Employment tab (sub-tabs: SEA, Leave Details, Bank Details, Payslip) holds your seafarer employment agreement, bank details for payroll, and your payslips. This is where pay is calculated &mdash; and where most pay questions are answered.</p>\n\n<h2 id=\"sea\">View and manage your SEA</h2>\n<p>The <strong>SEA</strong> sub-tab opens by default. Review <strong>SEA Details</strong>: Hire Date, End Date, SEA Type, Currency, Salary, Salary Calculation, Insurance, Social Security, Bank Charges, Location Agreement and Reason &mdash; each shows a <strong>Previous:</strong> value so you can see what changed. A status badge (e.g. <strong>Ended</strong>) shows the current state, and the right-hand timeline lists every <strong>SEA Start</strong> and <strong>Amendment</strong> (each with view/edit/delete icons). To begin a new contract, click <strong>SEA Actions &rarr; Start SEA</strong>.</p>\n\n<h2 id=\"salary\">How salary calculation works</h2>\n<p>Your SEA defines both a <strong>Salary</strong> and a <strong>Salary Calculation</strong> method &mdash; and the <em>method</em> determines the figure on a payslip, not just the headline salary. For example <strong>&ldquo;Salary &divide; 30 days&rdquo;</strong> divides the monthly salary across 30 days to get a daily rate; for a partial period the payslip multiplies that daily rate by days worked, which is why a payslip can be smaller than the full monthly salary.</p>\n<div class=\"callout tip\"><div class=\"co-h\">Payslip total surprised you?</div><p>Two crew with the same headline salary can see different totals &mdash; a different <strong>Salary Calculation</strong> method, a different <strong>Currency</strong>, or deductions (Insurance, Social Security, Bank Charges) and adjustments (Location Agreement) all feed the final number. Check the SEA&rsquo;s Salary Calculation and deduction fields first.</p></div>\n\n<h2 id=\"bank\">Bank details for payroll</h2>\n<div class=\"callout warn\"><div class=\"co-h\">Enter your own bank details</div><p>This is sensitive financial information &mdash; enter your own account numbers yourself; don&rsquo;t have anyone else fill these in for you.</p></div>\n<ol class=\"steps\">\n<li>Open <strong>Employment &rarr; Bank Details</strong>.</li>\n<li>Complete the Primary Bank fields: Notes, Account Name, Account Number, Iban, Swift Code, BIC, Bank Name, Bank Address, Bank Zip Code, Country.</li>\n<li>Click <strong>Add Bank Details</strong> for a second account, then <strong>Save</strong>.</li>\n</ol>\n\n<h2 id=\"payslip\">Generate a payslip</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>You need an <strong>active SEA</strong> covering the pay period &mdash; without one, the total stays at $0.00 and you&rsquo;ll see an error.</p></div>\n<ol class=\"steps\">\n<li>Open <strong>Employment &rarr; Payslip</strong> and click <strong>Generate Payslip</strong> (top-right).</li>\n<li>Expand <strong>Payslip Information</strong> and set the <strong>Payslip Range Date</strong>.</li>\n<li>Tick <strong>Biweekly</strong> for a two-week period instead of monthly.</li>\n<li>Review the <strong>Total Monthly Salary</strong> summary, then click <strong>Confirm</strong>.</li>\n</ol>\n<p>The payslip is added to the <strong>Payslip History</strong> table (Payslip Range Date, Paid Status, Deduction, Bonus, Gratuity, Salary).</p>\n<div class=\"callout warn\"><div class=\"co-h\">&ldquo;You don&rsquo;t have any active contract in this time period&rdquo;</div><p>The selected range falls outside any active SEA, so there&rsquo;s nothing to calculate (Total stays $0.00). Pick a range your SEA covers, or start/amend a SEA on the <strong>SEA</strong> sub-tab first.</p></div>\n"
          },
          {
            "id": "leave",
            "name": "Leave",
            "icon": "calendar",
            "body": "\n<p class=\"lead\">Request leave, track your balance, and understand how different leave types affect accrual and deductions. Leave entitlement is set on <strong>Employment &rarr; Leave Details</strong>.</p>\n\n<h2 id=\"types\">How leave types affect your balance</h2>\n<p>Not every leave type behaves the same way &mdash; the most common source of balance confusion. The Request Leave form spells out the rules:</p>\n<ul class=\"bul\">\n<li><strong>Don&rsquo;t deduct</strong> from available leave: Sick, Study, Unpaid and Shore Leave.</li>\n<li><strong>Stop accrual</strong> while taken: Annual, Study and Unpaid.</li>\n<li><strong>Keep accruing</strong> while taken: Compassionate, Compensatory, Rest Days, Rotation, Shore Leave and Sick Leave.</li>\n<li><strong>Travel Days</strong> &mdash; don&rsquo;t deduct from your balance, but you do keep accruing.</li>\n</ul>\n<div class=\"callout tip\"><div class=\"co-h\">Balance didn&rsquo;t drop?</div><p>If your <strong>Available Leave</strong> didn&rsquo;t fall after a leave was approved, it&rsquo;s almost always because that leave type is <strong>non-deducting</strong> &mdash; not a bug.</p></div>\n\n<h2 id=\"request\">Request leave</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Leave</strong> tab and click <strong>Leave</strong> (top-right) to open the Request Leave form.</li>\n<li>Read the <strong>Leave Guidelines</strong>, then choose a <strong>Leave Type</strong>.</li>\n<li>Set the <strong>Leave Date Range</strong>.</li>\n<li>Review <strong>Leave Days Deducted</strong> and <strong>Flight Deducted</strong>, add <strong>Comments</strong>, and use <strong>Add Travel Days</strong> if applicable.</li>\n<li>Attach any documents under <strong>Images / Files</strong>, then submit.</li>\n</ol>\n<p>Your request appears in the leave table with a status (Approved/Pending) and updates your balance per the leave type&rsquo;s rules.</p>\n\n<h2 id=\"balance\">View your balance &amp; history</h2>\n<p>The Leave tab shows three summary cards &mdash; <strong>Total Approved Leave</strong>, <strong>Daily Accrued Leave</strong> (how much you earn per day, e.g. 0.093) and <strong>Available Leave</strong> (current usable balance) &mdash; above a table of <strong>Leave Type, Start Date, End Date, Travel Days, Leave Days Deducted, Flight Deducted, Status, Comments</strong> and <strong>Actions</strong>.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How is my leave entitlement calculated?</summary><div class=\"faq-a\"><p>It&rsquo;s set on <strong>Employment &rarr; Leave Details</strong>: Leave Type, Calculation Method (e.g. <strong>Days Per Year &divide; 365</strong>), Leave Entitlement, Leave Renewal Date, Leave Carried Over, Daily Accrued Leave and Available Leave. &ldquo;Days Per Year &divide; 365&rdquo; converts your annual entitlement into a daily accrual rate that builds your balance day by day; unused balance at renewal shows as &ldquo;carried over.&rdquo;</p></div></details>\n</div>\n"
          }
        ]
      }
    </script>
