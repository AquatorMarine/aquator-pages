    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Build, store, distribute, and track the controlled documents and fillable forms that make up the vessel&rsquo;s Safety Management System. SMS lives under <strong>Compliance &rarr; ISM &rarr; SMS</strong>.</p>\n\n<h2 id=\"sections\">The four sections</h2>\n<p>The left sidebar splits SMS into four stores &mdash; they are <strong>not</strong> interchangeable; each holds a different kind of record:</p>\n<ul class=\"bul\">\n<li><strong>Editor</strong> &mdash; a drag-and-drop form builder where you design a form from scratch.</li>\n<li><strong>Templates</strong> &mdash; the register of reusable, fillable blank forms (e.g. &ldquo;Pre Departure&rdquo;, &ldquo;Incident Report Form&rdquo;). Crew fill these, they don&rsquo;t edit them.</li>\n<li><strong>Library</strong> &mdash; the register of controlled reference documents, typically uploaded PDFs such as manuals and procedures (e.g. &ldquo;EPM 3.0.0 Abandon Ship&rdquo;).</li>\n<li><strong>Populated</strong> &mdash; the record of every completed submission, each carrying a Priority, Status, optional Note and the submitter&rsquo;s name.</li>\n</ul>\n<div class=\"callout tip\"><div class=\"co-h\">The mental model</div><p><strong>Editor</strong> builds it &rarr; <strong>Templates</strong> stores the blank &rarr; someone <strong>Fills the Form</strong> &rarr; the result lands in <strong>Populated</strong>. The <strong>Library</strong> is a parallel store for static reference PDFs.</p></div>\n\n<h2 id=\"register\">Search, filter &amp; export</h2>\n<p>Library, Templates and Populated share the same controls:</p>\n<ul class=\"bul\">\n<li>Use the <strong>Search</strong> box to find a record by name.</li>\n<li>Click <strong>Filters</strong> to filter by <strong>Category</strong> or <strong>Created At</strong>; use <strong>Clear All</strong> to reset.</li>\n<li>Click <strong>Export</strong> to generate the <strong>SMS Library Report</strong> as a PDF or spreadsheet (the two icons).</li>\n</ul>\n<div class=\"callout note\"><div class=\"co-h\">Filters return nothing?</div><p>A previous filter may still be active &mdash; open <strong>Filters</strong> and click <strong>Clear All</strong>.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>What&rsquo;s the difference between the Library and Templates?</summary><div class=\"faq-a\"><p>The <strong>Library</strong> stores reference documents (uploaded PDFs like manuals and procedures). <strong>Templates</strong> stores fillable forms crew complete. You add to the Library by uploading a PDF; you create a template by building it in the <strong>Editor</strong>.</p></div></details>\n<details><summary>Where do completed forms go after I fill them out?</summary><div class=\"faq-a\"><p>They appear under <strong>Populated</strong>, not Templates. Templates only holds the blank master forms.</p></div></details>\n</div>\n"
          },
          {
            "id": "editor",
            "name": "Editor",
            "icon": "chart",
            "body": "\n<p class=\"lead\">The Editor is a drag-and-drop builder for designing a form&rsquo;s layout. A form designed here becomes a reusable template.</p>\n\n<h2 id=\"build\">Build a form</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>The Editor builds the <strong>layout</strong> only. Decide your fields (text, dates, checkboxes, signatures) and their order first.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Compliance &rarr; ISM &rarr; SMS &rarr; Editor</strong>.</li>\n<li>From the component palette on the left, drag a component onto the <strong>Drag and Drop a form component</strong> canvas. Components are grouped under <strong>Basic, Advanced, Layout, Data</strong> and <strong>Premium</strong>. Basic includes Text Field, Text Area, Number, Password, Checkbox, Select Boxes, Select, Radio and Button.</li>\n<li>When you drop a component, its configuration window opens with four tabs (<strong>Display, Data, Validation, Conditional</strong>). Set the <strong>Label</strong> (required) and any other options &mdash; a live <strong>Preview</strong> shows on the right.</li>\n<li>Repeat to add all fields. Use the <strong>Search field(s)</strong> box at the top of the palette to find a component quickly.</li>\n<li>Click <strong>Save</strong> (bottom-right) when the form is complete.</li>\n</ol>\n<p>The saved form becomes available as a reusable form. Closing the configuration window with the <strong>&times;</strong> discards an unsaved component.</p>\n<div class=\"callout warn\"><div class=\"co-h\">Save does nothing?</div><p>The <strong>Label</strong> field is required on each component &mdash; an empty label blocks the save. (An empty canvas reading &ldquo;Drag and Drop a form component&rdquo; is just the normal starting state, not an error.)</p></div>\n\n<h2 id=\"components\">Form field components (the four tabs)</h2>\n<p>Each component&rsquo;s settings are organised into four tabs &mdash; knowing what each controls prevents most &ldquo;why is my field behaving like this&rdquo; questions:</p>\n<table class=\"ftab\"><thead><tr><th>Tab</th><th>What it controls</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Display</td><td>How the field looks &mdash; the <strong>Label</strong>, <strong>Label Position</strong> (e.g. Top) and <strong>Placeholder</strong> text shown inside an empty field.</td></tr>\n<tr><td class=\"t-name\">Data</td><td>The underlying value &mdash; default values and how the field&rsquo;s data is stored.</td></tr>\n<tr><td class=\"t-name\">Validation</td><td>Rules that must pass before the form can be submitted &mdash; for example marking a field <strong>required</strong>.</td></tr>\n<tr><td class=\"t-name\">Conditional</td><td>When a field appears &mdash; show or hide it based on the answer given in another field.</td></tr>\n</tbody></table>\n<p>The palette groups components into <strong>Basic</strong> (the everyday fields) plus <strong>Advanced, Layout, Data</strong> and <strong>Premium</strong> for more specialised needs.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I add a signature field to a form?</summary><div class=\"faq-a\"><p>Signature fields are part of the form&rsquo;s design in the Editor. Once present, they appear as a <strong>&ldquo;Sign above&rdquo;</strong> pad in the Fill Form / Submit Form window.</p></div></details>\n</div>\n"
          },
          {
            "id": "library",
            "name": "Library",
            "icon": "receipt",
            "body": "\n<p class=\"lead\">The Library is the register of controlled reference documents &mdash; uploaded PDFs such as manuals and procedures. These are read/reference documents, not fillable forms.</p>\n\n<h2 id=\"upload\">Upload a document</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>Have the <strong>PDF</strong> ready &mdash; Library documents are uploaded, not built in the Editor.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Compliance &rarr; ISM &rarr; SMS &rarr; Library</strong>.</li>\n<li>Click <strong>Add</strong> (top-right).</li>\n<li>In the <strong>Bulk Upload Documents</strong> window, drag the PDF into the drop zone or use <strong>Browse PDF</strong>.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The document appears as a new row showing <strong>Name, Document Number, Category</strong> and <strong>Created At</strong>.</p>\n\n<h2 id=\"edit\">Edit a document&rsquo;s details</h2>\n<p>Only the document&rsquo;s metadata and file are editable here: Name, Document Number, Category and the attached file.</p>\n<ol class=\"steps\">\n<li>On the document&rsquo;s row, click the actions menu (<strong>three dots</strong>) in the <strong>Actions</strong> column.</li>\n<li>Click <strong>Edit</strong>.</li>\n<li>In the <strong>Edit Document</strong> window, update the <strong>Name, Document Number</strong> or <strong>Category</strong>. To replace the file, remove the current PDF (the <strong>&times;</strong> on the file tile) and drag a new one into the <strong>Drag &amp; Drop Document here</strong> / <strong>Browse Document</strong> area.</li>\n<li>Click <strong>Save</strong> (or <strong>Cancel</strong> to discard).</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Can&rsquo;t find Edit?</div><p>It&rsquo;s inside the three-dot actions menu on the row, alongside <strong>View, Delete</strong> and <strong>Download</strong>. If the table is empty, no documents have been uploaded yet.</p></div>\n\n<h2 id=\"categories\">Document categories explained</h2>\n<p>Both Library documents and Templates are filed under a <strong>category</strong>, which drives filtering and reporting. A misfiled document still exists but won&rsquo;t surface where users expect it. The categories are:</p>\n<ul class=\"bul\">\n<li>Safety Management Manual (SMM)</li>\n<li>Ship Operation Procedures (SOP)</li>\n<li>Permit To Work (PTW)</li>\n<li>Risk Assessments (RA)</li>\n<li>Bridge (B)</li>\n<li>Engineering (E)</li>\n<li>Reports (R)</li>\n<li>Emergency Procedure (EPM)</li>\n</ul>\n<div class=\"callout note\"><div class=\"co-h\">Document has no/incorrect category?</div><p>Categories aren&rsquo;t always set on upload &mdash; open the row&rsquo;s actions menu &rarr; <strong>Edit</strong> to assign one.</p></div>\n"
          },
          {
            "id": "templates",
            "name": "Templates",
            "icon": "contract",
            "body": "\n<p class=\"lead\">Templates is the register of reusable, fillable blank forms. Crew <strong>fill</strong> these rather than editing the master &mdash; each completed copy lands in Populated.</p>\n\n<h2 id=\"fill\">Fill out a template</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>The blank form must already exist under <strong>Templates</strong>. If it doesn&rsquo;t, build it in the <strong>Editor</strong> first.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Compliance &rarr; ISM &rarr; SMS &rarr; Templates</strong>.</li>\n<li>On the template&rsquo;s row, click the actions menu (<strong>three dots</strong>).</li>\n<li>Click <strong>Fill Form</strong>.</li>\n<li>In the <strong>Submit Form</strong> window, complete the fields (e.g. Name, Date/Time, Rank, Location). Signature fields are signed in the <strong>&ldquo;Sign above&rdquo;</strong> pad.</li>\n<li>Submit the form.</li>\n</ol>\n<p>The completed form is saved as a new entry under <strong>Populated</strong>, where it&rsquo;s tracked with a Status and Priority.</p>\n<div class=\"callout warn\"><div class=\"co-h\">Use Fill Form, not Edit</div><p><strong>Edit</strong> changes the master template for everyone; <strong>Fill Form</strong> creates one completed copy. If you can&rsquo;t submit, a required field (set in the form&rsquo;s Validation rules) is likely empty.</p></div>\n\n<h2 id=\"actions\">The actions menu</h2>\n<p>Each template&rsquo;s three-dot menu offers more than edit:</p>\n<table class=\"ftab\"><thead><tr><th>Action</th><th>What it does</th></tr></thead><tbody>\n<tr><td class=\"t-name\">View</td><td>Opens a read-only preview.</td></tr>\n<tr><td class=\"t-name\">Edit</td><td>Reopens the form to change its design (affects everyone).</td></tr>\n<tr><td class=\"t-name\">Fill Form</td><td>Opens a blank copy to complete.</td></tr>\n<tr><td class=\"t-name\">Duplicate</td><td>Creates a copy you can modify into a new template without altering the original.</td></tr>\n<tr><td class=\"t-name\">Revision Control</td><td>Tracks versions so you can see and manage change history.</td></tr>\n<tr><td class=\"t-name\">Delete</td><td>Removes the template.</td></tr>\n<tr><td class=\"t-name\">Download</td><td>Saves a copy of the form.</td></tr>\n<tr><td class=\"t-name\">Copy Link</td><td>Copies a direct link to the template.</td></tr>\n</tbody></table>\n<div class=\"callout tip\"><div class=\"co-h\">For ISM compliance</div><p>Use <strong>Duplicate</strong> (rather than editing a master) when you want a variant, and <strong>Revision Control</strong> when you need an audit trail of changes.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Can I reuse an existing form as a starting point for a new one?</summary><div class=\"faq-a\"><p>Yes &mdash; in Templates, open the row&rsquo;s actions menu and choose <strong>Duplicate</strong>, then edit the copy.</p></div></details>\n<details><summary>Can I get a direct link to a specific form?</summary><div class=\"faq-a\"><p>Yes &mdash; the actions menu on <strong>Templates</strong> and <strong>Populated</strong> rows includes <strong>Copy Link</strong>.</p></div></details>\n</div>\n"
          },
          {
            "id": "populated",
            "name": "Populated",
            "icon": "badge",
            "body": "\n<p class=\"lead\">Populated is the record of every completed submission. Each entry carries a Status and Priority you set inline to drive the review-and-sign-off workflow.</p>\n\n<h2 id=\"lifecycle\">Status and Priority</h2>\n<p><strong>Status</strong> moves a submission through its lifecycle. A typical path is <strong>Open &rarr; In Progress &rarr; Done &rarr; Approved</strong>, with <strong>Rejected</strong> sending it back and <strong>Archived</strong> closing it out.</p>\n<table class=\"ftab\"><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody>\n<tr><td><span class=\"chip neutralchip\">Open</span></td><td>Logged, not yet started.</td></tr>\n<tr><td><span class=\"chip warnchip\">In Progress</span></td><td>Being worked.</td></tr>\n<tr><td><span class=\"chip warnchip\">On Hold</span></td><td>Paused.</td></tr>\n<tr><td><span class=\"chip neutralchip\">Done</span></td><td>Form complete.</td></tr>\n<tr><td><span class=\"chip okchip\">Approved</span></td><td>Signed off.</td></tr>\n<tr><td><span class=\"chip badchip\">Rejected</span></td><td>Sent back.</td></tr>\n<tr><td><span class=\"chip neutralchip\">Archived</span></td><td>Closed out / removed from active view.</td></tr>\n</tbody></table>\n<p><strong>Priority</strong> flags urgency: <strong>None, Low, Medium, High</strong>. Each row also shows the <strong>Name</strong> of the submitter, and you can add a free-text <strong>Note</strong>.</p>\n\n<h2 id=\"update\">Update Status, Priority or Note</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Compliance &rarr; ISM &rarr; SMS &rarr; Populated</strong> and find the submission&rsquo;s row.</li>\n<li>To change urgency, click the <strong>Priority</strong> dropdown (None, Low, Medium, High).</li>\n<li>To change workflow state, click the <strong>Status</strong> dropdown (Open, On Hold, In Progress, Done, Approved, Rejected, Archived).</li>\n<li>To add context, click the <strong>Note</strong> cell (&ldquo;Add notes ---&rdquo;) and type your note.</li>\n</ol>\n<p>Changes save inline on the row &mdash; there&rsquo;s no separate save button for these fields.</p>\n<div class=\"callout note\"><div class=\"co-h\">No Edit option for the answers?</div><p>Populated submissions are records: you can change <strong>Status, Priority</strong> and <strong>Note</strong>, plus use <strong>Revision Control</strong>, but the submitted answers aren&rsquo;t edited here. The row actions menu offers <strong>View, Download, Copy Link, Delete</strong> and <strong>Revision Control</strong>.</p></div>\n"
          }
        ]
      }
    </script>
