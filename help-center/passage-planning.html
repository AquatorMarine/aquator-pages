    <script id="kb" type="application/json">

        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "anchor",
            "body": "\n<p class=\"lead\">Plan, execute, and log a yacht&rsquo;s passage &mdash; from pre-departure preparation and route/tide planning through the live ship&rsquo;s log, watch rotations, power/battery budgeting, and fuel tracking. Passage Planning lives under <strong>Charter</strong>.</p>\n\n<h2 id=\"subapps\">The five sub-apps</h2>\n<p>Passage Planning is split into five tools, each reached from the sidebar under <strong>Passage Planning</strong>:</p>\n<table class=\"ftab\"><thead><tr><th>Sub-app</th><th>What it&rsquo;s for</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Passage Preparation</td><td>Pre-departure set-up &mdash; emergency contacts, equipment, crew manifest, briefings and a buddy boat.</td></tr>\n<tr><td class=\"t-name\">Passage Plan</td><td>The navigational plan &mdash; route, waypoints, tides, ports, radio schedule and watch system.</td></tr>\n<tr><td class=\"t-name\">Passage Log</td><td>The live ship&rsquo;s log &mdash; one timed entry per hour or watch change.</td></tr>\n<tr><td class=\"t-name\">Power Usage Log</td><td>Power and battery budgeting by operating condition.</td></tr>\n<tr><td class=\"t-name\">Fuel Management</td><td>Fuel level, consumption and reserve tracking.</td></tr>\n</tbody></table>\n<div class=\"callout note\"><div class=\"co-h\">Open the correct yacht first</div><p>Passage Planning is scoped to the yacht you have selected &mdash; the top-right shows the active vessel (e.g. &ldquo;M/Y Horizon&rdquo;). Switch vessel there before adding records.</p></div>\n\n<h2 id=\"prep-vs-plan\">Passage Preparation vs. Passage Plan</h2>\n<p><strong>Passage Preparation</strong> is everything you set up before leaving: emergency contacts (SAR, DPA, piracy response), the equipment inventory and where it&rsquo;s stowed, the crew manifest, crew briefings, and any buddy boat you&rsquo;re travelling with. It answers &ldquo;are we ready, and who/what is aboard?&rdquo;</p>\n<p><strong>Passage Plan</strong> is the navigational plan for the trip itself: legs and waypoints, course to steer, tides, port and alternative-port details, radio schedule, and the watch system. It answers &ldquo;how do we get there safely?&rdquo;</p>\n<div class=\"callout tip\"><div class=\"co-h\">A practical rule</div><p>If it&rsquo;s about <strong>people, kit and contacts</strong>, it&rsquo;s Preparation; if it&rsquo;s about <strong>route, tides, ports and watches</strong>, it&rsquo;s the Plan. What actually happened then goes in <strong>Passage Log</strong> (navigation) and <strong>Watch System Log</strong> (duties).</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why does it ask for location permission?</summary><div class=\"faq-a\"><p>Some views (notably the Route Tracking System area and certain log lists) request your browser&rsquo;s location, showing a &ldquo;Location permission required&rdquo; message. You can still add and view records without granting it &mdash; it doesn&rsquo;t block data entry. To enable location features, allow location for the site in your browser&rsquo;s address-bar prompt. The permission is handled entirely by your browser.</p></div></details>\n<details><summary>Can I attach documents to a passage record?</summary><div class=\"faq-a\"><p>Yes &mdash; every <strong>Add</strong> form across Passage Planning includes an <strong>Images / Pdfs</strong> uploader (drag-and-drop or browse). Accepted formats are PNG, JPG, PDF, DOC, XLS, up to 100 MB per file &mdash; useful for tide tables, port guides, equipment certificates or crew documents.</p></div></details>\n<details><summary>What do the icons on each row do?</summary><div class=\"faq-a\"><p>Each row has four action icons: <strong>Edit</strong> (pencil) reopens the record for changes, <strong>View</strong> (eye) opens it read-only, and <strong>Delete</strong> (trash) removes it. The <strong>calendar</strong> icon creates a linked calendar event from that record &mdash; it opens the Calendar with a new-event dialog so you can schedule a reminder tied to the entry (for example a tide window or a watch change).</p></div></details>\n</div>\n"
          },
          {
            "id": "preparation",
            "name": "Passage Preparation",
            "icon": "users",
            "body": "\n<p class=\"lead\">Everything you set up before leaving. Passage Preparation has five tabs &mdash; <strong>Contact Details</strong>, <strong>Passage Equipment</strong>, <strong>Crew List</strong>, <strong>Crew Briefing</strong> and <strong>Buddy Boat</strong>. Each tab has its own <strong>Add</strong> button and its own fields.</p>\n\n<h2 id=\"contact\">Add an emergency contact</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Charter &rarr; Passage Preparation</strong>.</li>\n<li>Stay on the <strong>Contact Details</strong> tab (the default).</li>\n<li>Click <strong>Add</strong> (top-right).</li>\n<li>Fill in <strong>Item</strong> (e.g. SAR, DPA, Piracy Response, Buddy Vessel, Manager), <strong>Details</strong> and <strong>Notes</strong>.</li>\n<li>Optionally drop a file into <strong>Images / Pdfs</strong>.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The contact appears as a new row in the Contact Details table (<strong>Item &middot; Details &middot; Notes &middot; Actions</strong>).</p>\n<div class=\"callout note\"><div class=\"co-h\">Field labels are generic</div><p>Labels are <strong>Item</strong> / <strong>Details</strong> rather than &ldquo;name / phone&rdquo;. Put the role in <strong>Item</strong> and the name or number in <strong>Details</strong>, matching existing rows (e.g. &ldquo;DPA &rarr; Stan Smith&rdquo;, with the phone in Notes).</p></div>\n\n<h2 id=\"equipment-crew\">Record equipment, crew, briefings and a buddy boat</h2>\n<p>Click the tab you need, then <strong>Add</strong>. Each tab&rsquo;s fields:</p>\n<table class=\"ftab\"><thead><tr><th>Tab</th><th>Fields</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Passage Equipment</td><td>Category, Item, Description, Details, Storage, Notes.</td></tr>\n<tr><td class=\"t-name\">Crew List</td><td>Role, First Name, Last Name, Contact Details, Nationality, Date of Birth, Passport Number, Qualifications, Medical, Next of Kin Name, Next of Kin Contact, Comments.</td></tr>\n<tr><td class=\"t-name\">Crew Briefing</td><td>Topics, Description, Status, Progress, Crew, Priority, Notes.</td></tr>\n<tr><td class=\"t-name\">Buddy Boat</td><td>Yacht Name, Yacht Brand, Captain, Crew, Contact, Notes.</td></tr>\n</tbody></table>\n<p>Click <strong>Save</strong> to add the record to that tab&rsquo;s table. On <strong>Crew Briefing</strong>, Progress displays as a progress bar (e.g. 50%) and Status shows a badge.</p>\n<div class=\"callout note\"><div class=\"co-h\">Crew Briefing dropdowns are fixed</div><p>Status = <strong>Active / Inactive</strong> &middot; Progress = <strong>0% / 25% / 50% / 75% / 100%</strong> &middot; Priority = <strong>None / High / Medium / Low</strong>.</p></div>\n<div class=\"callout warn\"><div class=\"co-h\">Crew List is a separate manifest</div><p>This is a full manifest (passport, next-of-kin, medical) and is separate from the yacht&rsquo;s main crew records &mdash; entries here don&rsquo;t auto-sync from the Crew module.</p></div>\n"
          },
          {
            "id": "plan",
            "name": "Passage Plan",
            "icon": "compass",
            "body": "\n<p class=\"lead\">The navigational plan for the trip. Passage Plan has ten tabs, each a standalone table with its own <strong>Add</strong> form: <strong>Passage Details &middot; Navigation &middot; Route &middot; Tide Times &middot; Port Details &middot; Alternative Ports &middot; Radio Schedule &middot; Route Tracking System &middot; Watch System &middot; Watch System Log</strong>.</p>\n\n<h2 id=\"build\">Build a passage plan</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>The plan is built up tab by tab &mdash; there is no single &ldquo;save plan&rdquo; that fills every tab at once. Visit the tabs you need. If a browser prompt says &ldquo;Location permission required&rdquo;, it does not block data entry (see the Introduction FAQ).</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Charter &rarr; Passage Plan</strong>.</li>\n<li>Click the relevant tab and <strong>Add</strong>.</li>\n<li>Complete the fields (see the table below) and click <strong>Save</strong>.</li>\n</ol>\n<table class=\"ftab\"><thead><tr><th>Tab</th><th>Fields</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Passage Details</td><td>Date, Waypoints (e.g. &ldquo;3&gt;4&rdquo;), Distance, Est Time, Speed, Notes.</td></tr>\n<tr><td class=\"t-name\">Navigation</td><td>Navigation Items, Details, Notes, Storage.</td></tr>\n<tr><td class=\"t-name\">Route</td><td>Date, Route, Waypoints, Course to Steer True, Variation/Deviation, Distance, Time, Speed, Hazards, Notes.</td></tr>\n<tr><td class=\"t-name\">Tide Times</td><td>Date, HW Height, HW Time, LW Height, LW Time, Springs, Neaps, Departure Port, En Route, Arrival Port, Notes.</td></tr>\n<tr><td class=\"t-name\">Port Details</td><td>Port, Hazards, Lights/Landmarks, Harbourmaster/Marina Contact &amp; Call Sign, Customs/Immigration Requirements, Notes.</td></tr>\n<tr><td class=\"t-name\">Alternative Ports</td><td>Alternative Ports, Contact, Customs, Notes.</td></tr>\n<tr><td class=\"t-name\">Radio Schedule</td><td>Radio, Channel, Time, Notes.</td></tr>\n</tbody></table>\n<p>Each entry is added to its tab&rsquo;s table; the plan is built up tab by tab.</p>\n<div class=\"callout note\"><div class=\"co-h\">Tab shows &ldquo;No Rows To Show&rdquo;?</div><p>That tab simply has no entries yet (normal for a new passage) &mdash; click <strong>Add</strong> to create the first one. Course/heading fields (Course to Steer True, Variation/Deviation) are free-text &mdash; enter values exactly as your navigation source gives them (e.g. &ldquo;030&rdquo;, &ldquo;2N&rdquo;).</p></div>\n\n<h2 id=\"watch\">Set up the watch rotation and log it</h2>\n<p>Watch-keeping uses two tabs: <strong>Watch System</strong> (the planned rotation) and <strong>Watch System Log</strong> (what actually happened on each watch). They are separate &mdash; setting up Watch System does not auto-populate the log.</p>\n<ol class=\"steps\">\n<li>On <strong>Watch System</strong>, click <strong>Add</strong> and fill in Date, Watch Start, Watch End, Crew Name, Watch Leader, Lookout, Time Of Day, Notes. Click <strong>Save</strong>.</li>\n<li>On <strong>Watch System Log</strong>, click <strong>Add</strong> and fill in Date, Time, Crew, Duties, Priority, Progress, Notes. Click <strong>Save</strong>.</li>\n</ol>\n<p>Watch System rows show as a roster (Date &middot; Watch Start &middot; Watch End &middot; Crew Name&hellip;); Watch System Log records each logged duty.</p>\n<div class=\"callout note\"><div class=\"co-h\">Route Tracking System is not a map</div><p>The <strong>Route Tracking System</strong> tab only has <strong>System</strong> and <strong>Notes</strong> fields &mdash; it&rsquo;s a lightweight reference list, not a live GPS tracker, so don&rsquo;t expect a map here.</p></div>\n\n<h2 id=\"tabs\">How the tabs fit together</h2>\n<p>Each tab is an independent list, so building a complete plan means visiting the ones you need &mdash; nothing cascades automatically from one tab to another. <strong>Passage Details</strong> captures leg-level summaries (waypoints, distance, estimated time, speed); <strong>Route</strong> holds the detailed legs (course to steer true, variation/deviation, hazards); <strong>Navigation</strong> lists the equipment in use; <strong>Tide Times</strong> records high/low water heights and times plus springs/neaps for departure, en-route and arrival ports; <strong>Port Details</strong> and <strong>Alternative Ports</strong> capture harbour info, hazards, lights and customs; <strong>Radio Schedule</strong> lists radio watch channels and times. The last three &mdash; <strong>Watch System</strong>, <strong>Watch System Log</strong> and <strong>Route Tracking System</strong> &mdash; cover watch-keeping and reference tracking.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Does setting up the Watch System fill in the Watch System Log?</summary><div class=\"faq-a\"><p>No &mdash; they are separate tabs. <strong>Watch System</strong> is the planned rotation; <strong>Watch System Log</strong> is what each watch actually did. You add to the log as the passage runs.</p></div></details>\n</div>\n"
          },
          {
            "id": "log",
            "name": "Passage Log",
            "icon": "contract",
            "body": "\n<p class=\"lead\">The navigational ship&rsquo;s log. Passage Log is a single table (no tabs) &mdash; each row is one timed entry, typically made hourly or at each watch change underway.</p>\n\n<h2 id=\"entry\">Add a log entry</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Charter &rarr; Passage Log</strong>.</li>\n<li>Click <strong>Add</strong>.</li>\n<li>Fill in Date, Position Lat/Long, Compass Course, True Course, Speed, Sail/Motor, Wind, Sea State, Visibility, Barometer, Status, Priority, Crew, Notes.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The entry is added to the log table (<strong>Date &middot; &hellip; &middot; True Course &middot; Speed &middot; Actions</strong>).</p>\n<div class=\"callout note\"><div class=\"co-h\">List slow or showing &ldquo;No Rows To Show&rdquo;?</div><p>Give it a moment to load &mdash; existing entries appear once the table finishes loading. <strong>Status</strong> options are <strong>Active / Inactive</strong>.</p></div>\n\n<h2 id=\"vs-watch\">Passage Log vs. Watch System Log</h2>\n<p>Both are &ldquo;what actually happened&rdquo; records, but they answer different questions. The <strong>Passage Log</strong> is the navigational ship&rsquo;s log: position, compass and true course, speed, sail/motor, wind, sea state, visibility and barometer at each timed entry &mdash; the formal record of the vessel&rsquo;s progress. The <strong>Watch System Log</strong> (in Passage Plan) is about crew duties: who was on, at what time, what tasks they performed, and progress against them.</p>\n<div class=\"callout tip\"><div class=\"co-h\">Which one do I use?</div><p>Use <strong>Passage Log</strong> for the boat&rsquo;s navigational state over time; use <strong>Watch System Log</strong> for the human side of each watch. They&rsquo;re complementary &mdash; a complete passage typically has both running in parallel.</p></div>\n"
          },
          {
            "id": "power",
            "name": "Power Usage Log",
            "icon": "chart",
            "body": "\n<p class=\"lead\">Power and battery budgeting. Power Usage Log has two tabs &mdash; <strong>Power Usage Log</strong> (consumption by item) and <strong>Battery Usage Log</strong> (battery condition). Each has its own <strong>Add</strong> form.</p>\n\n<h2 id=\"record\">Record power and battery usage</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Charter &rarr; Power Usage Log</strong>.</li>\n<li>On <strong>Power Usage Log</strong>, click <strong>Add</strong>: Item, Amps Draw, Underway Day, Underway Night, Anchor Day, Anchor Night, Status, Check, Notes. Click <strong>Save</strong>.</li>\n<li>On <strong>Battery Usage Log</strong>, click <strong>Add</strong>: Item, Description, Watts, Amps, Voltage, Load Testing, Charging, Notes. Click <strong>Save</strong>.</li>\n</ol>\n<p>Entries appear in their respective tab tables, giving an at-a-glance energy budget across operating states (underway/anchor, day/night).</p>\n<div class=\"callout note\"><div class=\"co-h\">Charging is a fixed dropdown</div><p><strong>Charging</strong> is battery state of charge &mdash; <strong>0% / 25% / 50% / 75% / 100%</strong>, not a free-text field.</p></div>\n<div class=\"callout tip\"><div class=\"co-h\">Why four draw columns?</div><p>The four draw columns (Underway/Anchor &times; Day/Night) are deliberately separate so you can budget consumption per operating condition &mdash; fill the ones that apply.</p></div>\n"
          },
          {
            "id": "fuel",
            "name": "Fuel Management",
            "icon": "receipt",
            "body": "\n<p class=\"lead\">Fuel level, consumption and reserve tracking. Fuel Management is a single table (no tabs) &mdash; each row is a dated fuel snapshot.</p>\n\n<h2 id=\"fuel-log\">Log fuel and track consumption</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Charter &rarr; Fuel Management</strong>.</li>\n<li>Click <strong>Add</strong>.</li>\n<li>Fill in Date, Tanks, Tank Capacity, Consumption Rate, Total Hours, Usage, Costs, Fuel Reserve, Notes.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The entry is added to the table (<strong>Date &middot; Tanks &middot; Tank Capacity &middot; Consumption Rate &middot; Total Hours &middot; &hellip;</strong>), building a running fuel/consumption history.</p>\n<div class=\"callout note\"><div class=\"co-h\">Keep the Tanks convention consistent</div><p><strong>Tanks</strong> is recorded as a percentage (e.g. &ldquo;100%&rdquo;) while <strong>Tank Capacity</strong> is a volume (e.g. 50000). Keep that convention consistent so range/reserve figures stay meaningful.</p></div>\n\n<h2 id=\"budgets\">How the power and fuel budgets work together</h2>\n<p>Power Usage Log and Fuel Management together let you forecast how long the yacht can operate before charging or refuelling. <strong>Power Usage Log</strong> breaks electrical draw down by operating condition (Underway Day, Underway Night, Anchor Day, Anchor Night) because consumption varies a lot between motoring at night and lying at anchor by day; <strong>Battery Usage Log</strong> tracks the batteries themselves (watts, amps, voltage, load testing, and state of charge via the Charging field). <strong>Fuel Management</strong> mirrors this for diesel &mdash; tank level, capacity, consumption rate, total engine hours, usage, cost and reserve. Read together, the day/night and underway/anchor breakdown plus fuel reserve give a realistic picture of range and endurance, rather than a single average that hides the difference between conditions.</p>\n"
          }
        ]
      }
