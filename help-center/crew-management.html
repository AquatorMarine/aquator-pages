<script id="kb" type="application/json">{"modules": [{"id": "overview", "name": "Introduction", "icon": "compass", "body": "\n<p class=\"lead\">Crew Management is where you manage every record about your crew &mdash; across the whole fleet, in one place.</p>\n\n<h2 id=\"inside\">What&rsquo;s inside</h2>\n<p>Six areas, each its own screen under <strong>Crew</strong>:</p>\n<ul class=\"bul\">\n<li><strong>Personal Information</strong> &mdash; identity, passport, visa and seaman&rsquo;s-book details.</li>\n<li><strong>Employment</strong> &mdash; contract terms, and where you create and manage each person&rsquo;s SEA.</li>\n<li><strong>Payroll</strong> &mdash; generate and track pay for a period.</li>\n<li><strong>Certificates</strong> &mdash; track validity and flag what&rsquo;s expiring.</li>\n<li><strong>Leave &amp; Rotation</strong> &mdash; balances, approvals, and on/off-duty rotation groups.</li>\n<li><strong>Emergency Contacts</strong> &mdash; each crew member&rsquo;s next of kin.</li>\n</ul>\n\n<h2 id=\"how\">How it works</h2>\n<p>One simple pattern runs through every screen:</p>\n<ul class=\"bul\">\n<li><strong>Read on the screen</strong> &mdash; the Crew screens are fleet-wide views: search, filter and export across everyone.</li>\n<li><strong>Edit on the profile</strong> &mdash; to change one person&rsquo;s details, open their profile (Admin Console &rarr; Users &rarr; the person).</li>\n<li><strong>It flows back</strong> &mdash; save on the profile and the change shows on the screens.</li>\n</ul>\n\n<h2 id=\"shared\">The same on every screen</h2>\n<ul class=\"bul\">\n<li><strong>Search</strong> matches name, ID and rank; <strong>Filters</strong> narrow to a group.</li>\n<li><strong>Save View</strong> keeps your filters and column layout (just for you).</li>\n<li><strong>Export</strong> downloads a report (PDF or Excel).</li>\n<li><strong>View</strong> opens a read-only panel; <strong>Edit</strong> opens the profile.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I add a new crew member?</summary><div class=\"faq-a\"><p>Not from these screens &mdash; they manage existing crew. New people join through the <strong>Invite Users</strong> flow.</p></div></details>\n<details><summary>How do I edit someone&rsquo;s details?</summary><div class=\"faq-a\"><p>Click <strong>Edit</strong> on their row. It opens that person&rsquo;s profile at the right tab (Personal Information, Employment, Certificates, Leave or Emergency Contact). The grids themselves are for viewing and exporting.</p></div></details>\n<details><summary>Why can I see some crew but not edit them?</summary><div class=\"faq-a\"><p>Edit only appears for crew that belong to your account, and you need Edit access to that screen. Admins can edit everyone.</p></div></details>\n<details><summary>How do I export a report?</summary><div class=\"faq-a\"><p>Use the <strong>Export</strong> button on any screen (PDF or Excel). On most PDF exports you can pick which columns to include.</p></div></details>\n<details><summary>Why don&rsquo;t I see a certain screen or button?</summary><div class=\"faq-a\"><p>Your role doesn&rsquo;t grant access to it. Access is set per screen by an admin; admins see everything.</p></div></details>\n</div>\n"}, {"id": "personal", "name": "Personal Information", "icon": "id", "body": "\n<p class=\"lead\">The crew roster &mdash; one row per crew member with their identity, passport, visa and seaman&rsquo;s-book details. It feeds crew lists, port paperwork and compliance checks, and it&rsquo;s the source for the IMO Crew List, so keeping passports and visas current here saves you scrambling at arrival.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Crew &rarr; Personal Information.</p>\n\n<h2 id=\"do\">What you&rsquo;ll do here</h2>\n<ul class=\"bul\">\n<li>Find a crew member fast.</li>\n<li>Keep passport / visa details current.</li>\n<li>Produce an IMO Crew List for a port call.</li>\n<li>Pull a crew report for a manager or an audit.</li>\n</ul>\n\n<h2 id=\"find\">Find someone quickly</h2>\n<ul class=\"bul\">\n<li><strong>Search</strong> (top right) matches name, ID and rank.</li>\n<li><strong>Filters</strong> narrows the list by ID, gender, rank, nationality, languages, country of passport, visa name or seaman&rsquo;s book number &mdash; plus <strong>Yacht</strong> on the fleet view.</li>\n<li><strong>Tip:</strong> once you&rsquo;ve set a useful cut, click <strong>Save View</strong> to keep it (your filters and column layout are saved to your account only); <strong>Clear All</strong> resets it.</li>\n</ul>\n\n<h2 id=\"update\">Update a passport or visa</h2>\n<p>The grid is <strong>read-only</strong> &mdash; you edit on the person&rsquo;s profile.</p>\n<ol class=\"steps\">\n<li>On the crew member&rsquo;s row, click <strong>Edit</strong> (the row also has <strong>View</strong> for a read-only peek).</li>\n<li>Their profile editor &mdash; the <strong>User Settings</strong> page &mdash; opens on the <strong>Personal Information</strong> tab.</li>\n<li>Update the fields, then <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Why read-only here?</div><p>The grid is a fleet-wide view. Edits happen one person at a time on their profile, so every change is deliberate and auditable &mdash; you can&rsquo;t accidentally overwrite the roster.</p></div>\n\n<h2 id=\"imo\">Produce an IMO Crew List</h2>\n<ol class=\"steps\">\n<li>Click <strong>Export</strong> (top right) &rarr; <strong>IMO Crew List</strong>.</li>\n<li>Ship details pre-fill from the yacht &mdash; check them.</li>\n<li>Select the crew to include (at least one).</li>\n<li>Fill voyage, port and date fields.</li>\n<li>Optionally draw a signature, then <strong>Generate</strong>.</li>\n</ol>\n<div class=\"callout warn\"><div class=\"co-h\">Good to know</div><p>Fill in the ship and voyage details, and pick <strong>at least one crew member</strong> (miss that and you&rsquo;ll see &ldquo;Please select at least one crew member&rdquo;). It opens as a PDF in a new tab and <strong>saves nothing</strong>, so generate as many as you need.</p></div>\n\n<h2 id=\"export\">Export the roster</h2>\n<p>Click <strong>Export &rarr; Personal Information Report</strong> (PDF with a column picker, or Excel). Pick only the columns the recipient needs &mdash; e.g. just name, rank and passport for a port agent.</p>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>&ldquo;Please select at least one crew member&rdquo;</strong> &mdash; tick at least one person before generating the IMO list.</li>\n<li><strong>A field won&rsquo;t change in the grid</strong> &mdash; it&rsquo;s read-only by design; edit it on the profile.</li>\n<li><strong>No Yacht column / no &ldquo;Include Company Users&rdquo;</strong> &mdash; those appear only on the fleet view, not on a single-yacht account.</li>\n</ul>\n\n<h2 id=\"who\">Who can do this</h2>\n<ul class=\"bul\">\n<li><strong>View / search / filter / export:</strong> View access to Personal Information.</li>\n<li><strong>Editing details:</strong> Edit access (changes are made on the profile). Admins always have full access.</li>\n</ul>\n"}, {"id": "employment", "name": "Employment", "icon": "contract", "body": "\n<p class=\"lead\">Employment shows each crew member&rsquo;s currently active contract &mdash; their SEA. The SEA is the single record everything downstream is calculated from: salary, daily rate, leave accrual, travel/flight entitlements and every payslip. Get the SEA right and payroll and leave look after themselves; get it wrong and both will be wrong &mdash; so it&rsquo;s the record to take the most care over.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Crew &rarr; Employment.</p>\n\n<h2 id=\"do\">What you&rsquo;ll do here</h2>\n<ul class=\"bul\">\n<li>See who&rsquo;s on what contract, and who&rsquo;s expiring.</li>\n<li>Onboard a new crew member&rsquo;s contract.</li>\n<li>Give someone a pay rise or change their terms.</li>\n<li>Off-board someone.</li>\n<li>Export an employment report.</li>\n</ul>\n\n<h2 id=\"read\">Read the Employment list</h2>\n<ul class=\"bul\">\n<li>One row per crew member, showing their <strong>active</strong> contract &mdash; hire date, expiry, type, salary, daily rate and travel entitlements.</li>\n<li>The <strong>Contract Expiry Date</strong> is colour-coded so renewals jump out: <span class=\"chip badchip\">red</span> if expired or within 30 days, <span class=\"chip warnchip\">amber</span> within 60/90 days, plain otherwise. Hover for the exact &ldquo;Expires in N days.&rdquo;</li>\n<li><strong>Filters:</strong> Yacht (fleet) &middot; ID &middot; Rank &middot; Hire Date &middot; Contract Expiry Date &middot; Contract Type &middot; Contract Currency &middot; Contract Salary.</li>\n<li>Per row, <strong>View</strong> opens a read-only Employment Details panel.</li>\n<li>The grid is <strong>read-only</strong> &mdash; manage a contract from the person&rsquo;s profile (Admin Console &rarr; Users &rarr; the person &rarr; <strong>Employment &rarr; SEA</strong>).</li>\n</ul>\n\n<h2 id=\"sea\">The SEA &mdash; where you manage it</h2>\n<p>On the profile: Admin Console &rarr; Users &rarr; the person &rarr; <strong>Employment</strong> tab &rarr; <strong>SEA</strong> (its sibling tabs are Leave Details, Bank Details and Payslip).</p>\n<ul class=\"bul\">\n<li><strong>SEA Details</strong> (left) shows the selected agreement&rsquo;s terms, with a status chip.</li>\n<li>The <strong>timeline</strong> (right) is the person&rsquo;s full contract history &mdash; <strong>SEA Start &rarr; SEA Amendment(s) &rarr; SEA End</strong> &mdash; each node showing its date range; click the eye to view a version. Active nodes are green, future ones blue, past ones greyed.</li>\n<li><strong>SEA Actions</strong> (top right) is where you Start, Amend or End &mdash; disabled if you don&rsquo;t have edit access.</li>\n<li>No contract yet? The tab reads &ldquo;No Contract Details Found.&rdquo;</li>\n</ul>\n\n<h2 id=\"status\">Statuses</h2>\n<table class=\"ftab\"><thead><tr><th>Status chip</th><th>Meaning</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Active</td><td>The currently-running agreement</td></tr>\n<tr><td class=\"t-name\">Effective from {date}</td><td>Starts in the future</td></tr>\n<tr><td class=\"t-name\">End at {date}</td><td>A termination is scheduled but hasn&rsquo;t happened yet</td></tr>\n<tr><td class=\"t-name\">Amended</td><td>Superseded by a later amendment</td></tr>\n<tr><td class=\"t-name\">Ended</td><td>Already terminated</td></tr>\n</tbody></table>\n<p>You don&rsquo;t edit or delete an agreement directly. To change an active contract you <strong>Amend</strong> it; to stop it you <strong>End</strong> it. The chain keeps the full history.</p>\n\n<h2 id=\"start\">Onboard a contract &mdash; Start a SEA</h2>\n<p>SEA Actions &rarr; <strong>Start SEA</strong> opens a short wizard &mdash; <strong>Contract</strong> terms, then <strong>Leave</strong> terms, then <strong>Travel</strong> &mdash; with a live <strong>Daily Salary</strong> in the footer so you can confirm the figure as you go. Work through it with <strong>Next</strong>, then <strong>Finish</strong> to create the contract.</p>\n<p>A few things worth knowing as you fill it in:</p>\n<ul class=\"bul\">\n<li>Leave the <strong>expiry date</strong> blank for an open-ended (&ldquo;Indefinite&rdquo;) contract.</li>\n<li>The <strong>Salary Calculation</strong> you pick is what turns the salary into a daily rate &mdash; it drives every payslip, so choose the right basis (see <em>How salary is calculated</em>).</li>\n<li>Attach the <strong>signed agreement (PDF)</strong> here, so the contract and its document stay together.</li>\n<li>If the SEA Type is <strong>Rotation</strong>, leave is handled by the rotation pattern and the entitlement is fixed.</li>\n</ul>\n\n<h2 id=\"amend\">Give a pay rise or change terms &mdash; Amend a SEA</h2>\n<p>SEA Actions &rarr; <strong>Amend SEA</strong> (&ldquo;Modify SEA terms or duration&rdquo;). An amendment is a <strong>new linked version</strong> in the same chain &mdash; the original stays in the history.</p>\n<ul class=\"bul\">\n<li>You go through the same wizard, then record the <strong>reason</strong> for the change (and any internal notes) and the <strong>Amended Date</strong> it takes effect.</li>\n<li>On save, Aquator re-chains the agreements so the previous version ends the day before the amendment begins &mdash; no overlap, no gap.</li>\n<li><strong>Currency can&rsquo;t be changed</strong> on an amendment.</li>\n</ul>\n<div class=\"callout warn\"><div class=\"co-h\">Heads-up</div><p>You can&rsquo;t amend while a future contract is already scheduled. For a <strong>Rotation</strong> contract, remove the person from their active rotation group first.</p></div>\n\n<h2 id=\"end\">Off-board &mdash; End a SEA</h2>\n<p>SEA Actions &rarr; <strong>End SEA</strong> (&ldquo;Terminate the contract permanently&rdquo;). Set the <strong>end date</strong>, give a reason and comments, and it&rsquo;s done &mdash; ending is <strong>permanent</strong>.</p>\n<ul class=\"bul\">\n<li>The end date must sit after the contract&rsquo;s start and before the previous expiry / next hire date.</li>\n<li>For a Rotation contract, the person is automatically disabled from their rotation group on that date.</li>\n</ul>\n\n<h2 id=\"salary\">How salary is calculated</h2>\n<table class=\"ftab\"><thead><tr><th>Method</th><th>You enter</th><th>Daily rate</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Salary &divide; 30 days</td><td>Monthly salary</td><td>salary &divide; 30</td></tr>\n<tr><td class=\"t-name\">Salary &divide; 31 days</td><td>Monthly salary</td><td>salary &divide; 31</td></tr>\n<tr><td class=\"t-name\">Salary &times; 12 &divide; 365</td><td>Monthly salary</td><td>(salary &times; 12) &divide; 365</td></tr>\n<tr><td class=\"t-name\">Day Rate</td><td>A daily amount</td><td>the amount itself</td></tr>\n</tbody></table>\n<p>A full calendar month pays the full monthly salary (the method makes no difference). A partial period pays <strong>daily rate &times; days worked</strong> (both first and last day count). <span class=\"muted\">Example &mdash; 3,000/month, joining the 12th of a 30-day month (19 days): &divide;30 &rarr; 1,900.00; &divide;31 &rarr; 1,838.63; &times;12&divide;365 &rarr; 1,873.97.</span></p>\n<p><strong>Which method?</strong> &divide;30 is the simplest, consistent month basis (most common for monthly-salaried crew); &divide;31 gives a slightly lower daily rate where your payroll convention requires it; &times;12&divide;365 is the most precise across a full year; <strong>Day Rate</strong> is for crew paid per day (typically Dayworker and Temporary).</p>\n\n<h2 id=\"leave-accrual\">How leave accrues</h2>\n<ul class=\"bul\">\n<li><strong>Annual Leave</strong> &rarr; Days Per Year &divide; 365, or Leave Entitlement &minus; Leave Taken.</li>\n<li><strong>Accrued Leave Per Month</strong> &rarr; Days Accrued &divide; 30 / &divide; 31 / &times; 12 &divide; 365.</li>\n<li><strong>Rotation</strong> &rarr; Days Accrued &times; Days Worked.</li>\n</ul>\n<p>On the <strong>Leave Renewal Date</strong> the balance resets each year and unused days roll into <strong>carried-over</strong> leave. Travel days count as worked days for salary but <strong>don&rsquo;t</strong> accrue leave.</p>\n\n<h2 id=\"chain\">The contract chain</h2>\n<p>All versions of one engagement sit in a single timeline &mdash; <strong>Start &rarr; Amendments &rarr; End</strong> &mdash; so you always have the full history. Aquator keeps them chained automatically: each agreement ends the day before the next begins, with no gaps or overlaps.</p>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>&ldquo;Hire date cannot be more than 1 year in the future&rdquo;</strong> &mdash; pick an earlier hire date.</li>\n<li><strong>&ldquo;Hire date cannot create a gap with the previous contract&hellip;&rdquo;</strong> &mdash; align it with the prior agreement&rsquo;s end.</li>\n<li><strong>&ldquo;Payslip already exists after or on selected dates&rdquo;</strong> &mdash; a payslip is blocking that date; choose another, or remove the payslip first.</li>\n<li><strong>&ldquo;Please disable user from active rotation group to amend a contract of type rotation.&rdquo;</strong> &mdash; remove them from the rotation group, then amend.</li>\n<li><strong>&ldquo;SEA expiry date must be after hire date&rdquo; / &ldquo;Probation end date must be before contract expiry date&rdquo;</strong> &mdash; fix the date order.</li>\n<li><strong>SEA Actions is greyed out</strong> &mdash; you don&rsquo;t have Edit access to Employment.</li>\n</ul>\n\n<h2 id=\"who\">Who can do this</h2>\n<ul class=\"bul\">\n<li><strong>View the grid, details and history:</strong> View access to Employment.</li>\n<li><strong>Start, Amend or End a SEA:</strong> Edit access to Employment. Admins (and the legacy super-admin) always have full access.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Where do I set up someone&rsquo;s contract (SEA)?</summary><div class=\"faq-a\"><p>On their profile&rsquo;s <strong>SEA</strong> tab. The Employment screen shows the active contract; you create and change it from the profile.</p></div></details>\n<details><summary>How do I change contract terms like salary?</summary><div class=\"faq-a\"><p>Use <strong>Amend SEA</strong> &mdash; it records the change from a chosen date and keeps the history. Active contracts can&rsquo;t be edited directly.</p></div></details>\n<details><summary>Which salary calculation method should I use?</summary><div class=\"faq-a\"><p><strong>Salary &divide; 30 days</strong> for a simple monthly basis, <strong>&times; 12 &divide; 365 days</strong> for an annualised daily rate, or <strong>Day Rate</strong> for crew paid per day. It only changes pay for partial months &mdash; a full month always pays the full salary.</p></div></details>\n</div>\n"}, {"id": "payroll", "name": "Payroll &amp; Payslips", "icon": "cash", "body": "\n<p class=\"lead\">Payroll turns each crew member&rsquo;s active SEA into a payslip for a chosen period. It reads the contract &mdash; salary, daily rate, currency &mdash; straight from the SEA, which is why a wrong SEA shows up here as wrong pay. The whole screen works to a <strong>date range</strong>, and every figure reflects it.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Crew &rarr; Payroll.</p>\n\n<h2 id=\"do\">What you&rsquo;ll do here</h2>\n<ul class=\"bul\">\n<li>Run pay for a period (generate payslips in bulk).</li>\n<li>Mark people Paid or Unpaid.</li>\n<li>Generate or adjust an individual payslip.</li>\n<li>Export a payroll report.</li>\n</ul>\n\n<h2 id=\"period\">Set the period first</h2>\n<p>Everything on the screen is for the <strong>date range</strong> in the top-right picker (it defaults to the current month). Change it and click <strong>Apply</strong> before anything else &mdash; Status, totals and who&rsquo;s eligible to generate all depend on it.</p>\n\n<h2 id=\"read\">Read the list</h2>\n<ul class=\"bul\">\n<li>One row per crew member for the selected range, with their pay components (salary, entitlement, leave, reimbursements, final settlement, bonus, bank charges, deductions, gratuities) and a <strong>TOTAL</strong> row at the bottom.</li>\n<li><strong>Status</strong> is set automatically: <span class=\"chip okchip\">Generated</span> if a payslip exists for that range, otherwise <span class=\"chip neutralchip\">Pending</span>.</li>\n<li><strong>Paid Status</strong> is <span class=\"chip okchip\">Paid</span> / <span class=\"chip badchip\">Unpaid</span>, set per row (it reads <strong>Select</strong> until a payslip exists).</li>\n<li><strong>Filters:</strong> Yacht (fleet) &middot; ID &middot; Status &middot; Paid Status &middot; Rank.</li>\n</ul>\n\n<h2 id=\"generate\">Run pay for a period &mdash; Generate (bulk)</h2>\n<ol class=\"steps\">\n<li>Set the <strong>date range</strong> (defaults to the current month).</li>\n<li>Click <strong>Generate</strong> &mdash; the <strong>Bulk Create Payslip</strong> window opens.</li>\n<li>It lists everyone <strong>eligible</strong>: crew with no payslip yet for that range (Status = Pending), Unpaid, and with an active contract in the period. Remove anyone with the <strong>&times;</strong>, or use <strong>Search employee&hellip;</strong> / the yacht filter.</li>\n<li>Click a person (the <strong>eye</strong>) to review or adjust their payslip; the footer shows <strong>Total Payroll</strong>, grouped by currency.</li>\n<li>Clear any row flagged with a warning (&#9432;) &mdash; &ldquo;{n} employee(s) have validation errors. Please resolve them before saving.&rdquo;</li>\n<li>Click <strong>Create Payslips (N)</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Generating is <strong>append-only</strong> &mdash; it never overwrites anything, there&rsquo;s no delete or regenerate here, and a duplicate range is skipped (&ldquo;Payslip already exists for this date range&rdquo;). Clicking <strong>Create Payslips</strong> submits immediately (no extra confirmation); the result reads &ldquo;Bulk payslip creation completed: X succeeded, Y failed.&rdquo; To change figures afterwards, edit the individual payslip.</p></div>\n\n<h2 id=\"paid\">Mark someone Paid or Unpaid</h2>\n<ol class=\"steps\">\n<li>Find the crew member&rsquo;s row.</li>\n<li>Open the <strong>Paid Status</strong> dropdown.</li>\n<li>Choose <strong>Paid</strong> or <strong>Unpaid</strong> &mdash; it saves instantly (&ldquo;Payslip status updated&rdquo;) and can be toggled back.</li>\n</ol>\n\n<h2 id=\"single\">Generate a single payslip</h2>\n<p>As well as the bulk run above, you can create or adjust a payslip for <strong>one person</strong> two ways:</p>\n<ul class=\"bul\">\n<li>Crew &rarr; Payroll &rarr; the person&rsquo;s row &rarr; <strong>Payslip</strong>, or</li>\n<li>their profile &rarr; <strong>Employment &rarr; Payslip</strong> tab &rarr; <strong>Generate Payslip</strong> (this tab also lists their <strong>Payslip History</strong>, where you can view, edit or delete past payslips).</li>\n</ul>\n<p>Both open the same <strong>Generate Payslip</strong> editor:</p>\n<ol class=\"steps\">\n<li>Set the <strong>Payslip Range Date</strong> (defaults to the current month). Tick <strong>Biweekly</strong> to pay half a month &mdash; the range must be <strong>13&ndash;16 days</strong>.</li>\n<li>Contract details (type, hire date, salary, salary-calculation method, leave terms) are <strong>locked</strong> &mdash; they come from the SEA. <strong>Daily Salary</strong> and <strong>Period Salary</strong> update live.</li>\n<li>Adjust the amounts: Addition, Deduction, Bonus, Gratuity, Social Security, Insurance, Bank Charges, plus <strong>Final Settlement</strong> and <strong>Reimbursement</strong> rows. On a crew member&rsquo;s <em>last</em> payslip, enable <strong>Leave Payout</strong>.</li>\n<li>Click <strong>Confirm</strong> &mdash; the payslip saves (as <span class=\"chip badchip\">Unpaid</span>) and opens for printing.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Editing is <strong>disabled</strong> if you lack Edit access, or the payslip is already <strong>Paid</strong> &mdash; mark it Unpaid first. A duplicate date range is skipped, and you can&rsquo;t generate while a leave request in that period is still pending.</p></div>\n\n<h2 id=\"export\">Export</h2>\n<p>Click <strong>Export</strong> (top right) &rarr; <strong>Payroll Report</strong> (PDF with a column picker, or Excel), plus a <strong>Custom Export</strong>.</p>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>&ldquo;Payslip is not genrated!&rdquo;</strong> (spelling as in the product) &mdash; that row has no payslip for the range; generate one before setting Paid status.</li>\n<li><strong>Generate shows &ldquo;No eligible employees&rdquo;</strong> &mdash; everyone in range already has a payslip, is already Paid, or has no active contract; check the date range.</li>\n<li><strong>A row won&rsquo;t let me edit the payslip</strong> &mdash; it&rsquo;s already Paid (toggle to Unpaid), or you don&rsquo;t have Edit access.</li>\n<li><strong>&ldquo;Payslip already exists for this date range&rdquo;</strong> &mdash; that person already has a payslip for those exact dates; it&rsquo;s skipped to avoid duplicates.</li>\n<li><strong>&ldquo;Create a contract to generate payslip&rdquo;</strong> &mdash; set up the person&rsquo;s SEA first.</li>\n<li><strong>&ldquo;You can&rsquo;t generate a payslip for selected period until leave is approved or rejected&rdquo;</strong> &mdash; clear any pending leave in that period first.</li>\n<li><strong>&ldquo;Leave payout must be enabled because this is last payslip of the user&rdquo;</strong> &mdash; turn on Leave Payout for a final payslip.</li>\n<li><strong>Figures look wrong</strong> &mdash; check the crew member&rsquo;s SEA (salary, currency, salary-calculation method); Payroll reads straight from it.</li>\n</ul>\n\n<h2 id=\"who\">Who can do this</h2>\n<ul class=\"bul\">\n<li><strong>View / Export:</strong> View access to Payroll.</li>\n<li><strong>Generate, edit a payslip, change Paid Status:</strong> Edit access to Payroll. Admins always have full access.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I run payroll?</summary><div class=\"faq-a\"><p>Set the date range, click <strong>Generate</strong>, review the prepared payslips, and create them in one batch. It includes crew who don&rsquo;t yet have a payslip for that period.</p></div></details>\n<details><summary>Why is the Payslip button greyed out?</summary><div class=\"faq-a\"><p>Either you don&rsquo;t have Edit access to Payroll, or that payslip is already marked <strong>Paid</strong>.</p></div></details>\n<details><summary>What&rsquo;s the difference between &ldquo;Generated&rdquo; and &ldquo;Pending&rdquo;?</summary><div class=\"faq-a\"><p><strong>Generated</strong> means a payslip exists for the selected period; <strong>Pending</strong> means it hasn&rsquo;t been created yet.</p></div></details>\n</div>\n"}, {"id": "certificates", "name": "Certificates", "icon": "badge", "body": "\n<p class=\"lead\">A per-crew certificate-tracking calendar &mdash; each crew member expands to their certificates, and each expiry sits under its month, colour-coded by how soon it lapses. It&rsquo;s your fleet-wide compliance view: what&rsquo;s expired, what&rsquo;s expiring, and whether each rank meets Safe Manning.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Crew &rarr; Certificates.</p>\n\n<h2 id=\"do\">What you&rsquo;ll do here</h2>\n<ul class=\"bul\">\n<li>See what&rsquo;s expired or expiring across the fleet at a glance.</li>\n<li>Check a rank against its Safe Manning requirements.</li>\n<li>Add, update or upload a crew member&rsquo;s certificates.</li>\n<li>Export a certificates report.</li>\n</ul>\n\n<h2 id=\"read\">Read the tracking calendar</h2>\n<ul class=\"bul\">\n<li>Each crew member expands to show their certificates against the 12 months (JAN&ndash;DEC), with the expiry under its month.</li>\n<li>A <strong>year selector</strong> (two years back to five ahead) sits in the December column.</li>\n<li>The eye icon opens a read-only view of a certificate.</li>\n<li><strong>Export</strong> &rarr; &ldquo;Crew Certificates Report&rdquo; (PDF).</li>\n</ul>\n\n<h2 id=\"cards\">Summary cards &amp; Safe Manning</h2>\n<p>Four cards give fleet-wide compliance at a glance: <span class=\"chip badchip\">Expired</span> &middot; <span class=\"chip warnchip\">0&ndash;90 days</span> &middot; <span class=\"chip okchip\">90+ days</span> &middot; <span class=\"chip neutralchip\">Safe Manning</span> (the certificates each rank must carry).</p>\n<ul class=\"bul\">\n<li>Each rank has <strong>required</strong> and <strong>optional</strong> certificates; required ones show a &ldquo;Safe Manning &ndash; Required&rdquo; badge.</li>\n<li>Certificates a person is missing appear as empty placeholder rows, so gaps are visible.</li>\n</ul>\n\n<h2 id=\"colours\">Expiry colours</h2>\n<ul class=\"bul\">\n<li><span class=\"chip badchip\">Red</span> &mdash; expired.</li>\n<li><span class=\"chip warnchip\">Orange</span> &mdash; within 90 days.</li>\n<li><span class=\"chip okchip\">Green</span> &mdash; more than 90 days out.</li>\n</ul>\n\n<h2 id=\"add\">Add or edit a certificate</h2>\n<p>Certificates are managed on the profile &mdash; Admin Console &rarr; Users &rarr; the person &rarr; <strong>Certificates</strong> tab.</p>\n<ol class=\"steps\">\n<li>Open the profile&rsquo;s <strong>Certificates</strong> tab and add a certificate.</li>\n<li>Give it a <strong>name</strong> and an <strong>issue date</strong>, and attach the <strong>file</strong>.</li>\n<li>Add any extra detail you have &mdash; issuer, expiry, frequency, notes &mdash; then <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout warn\"><div class=\"co-h\">Good to know</div><p>The file isn&rsquo;t really optional &mdash; save without one and you&rsquo;ll see &ldquo;Certificate Not Uploaded!&rdquo;. Issuer offers the usual flags and registries (MCA, Cayman, Marshall Islands, ABS, DNV, Lloyds&hellip;), and frequency runs from one-off up to every 10 years.</p></div>\n\n<h2 id=\"bulk\">Bulk Upload</h2>\n<ol class=\"steps\">\n<li>On the Certificates tab, click <strong>Bulk Upload</strong>.</li>\n<li>Drag &amp; drop images or PDFs, or browse to select them.</li>\n<li>The files upload and process into certificate records.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">File limits</div><p>Accepted types: PNG, JPG, PDF, Office docs (DOC/DOCX/XLS/XLSX) and CSV; up to <strong>100&nbsp;MB</strong> per file and up to <strong>5 files</strong> at a time. Messages cover wrong type, too many, and over-size files.</p></div>\n\n<h2 id=\"filters\">Filters</h2>\n<p>Yacht (fleet) &middot; Safe Manning (Required/Optional) &middot; Expiring Status (Green/Red/Orange/None) &middot; Issuer &middot; Expiry Date (range) &middot; Uploaded File (Yes/No) &middot; Rank.</p>\n\n<h2 id=\"who\">Who can do this</h2>\n<ul class=\"bul\">\n<li><strong>View / Export:</strong> View access to Certificates.</li>\n<li><strong>Adding, editing, uploading or removing certificates:</strong> Edit access (on the profile&rsquo;s Certificates tab). Admins always have full access.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>What files can I upload, and how big?</summary><div class=\"faq-a\"><p>PNG, JPG, PDF, Office documents and CSV &mdash; up to <strong>100&nbsp;MB</strong> each.</p></div></details>\n<details><summary>What do the colours mean?</summary><div class=\"faq-a\"><p><span class=\"chip badchip\">Red</span>&nbsp; expired &nbsp;&middot;&nbsp; <span class=\"chip warnchip\">Orange</span>&nbsp; expiring within 90 days &nbsp;&middot;&nbsp; <span class=\"chip okchip\">Green</span>&nbsp; valid for more than 90 days.</p></div></details>\n<details><summary>What are required vs optional certificates?</summary><div class=\"faq-a\"><p>Each rank has a required and optional list (set in account settings). Missing required ones show as gaps so you can chase them.</p></div></details>\n</div>\n"}, {"id": "leave", "name": "Leave &amp; Rotation", "icon": "calendar", "body": "\n<p class=\"lead\">Each crew member&rsquo;s leave entitlement, accrual and balances, plus a duty-status badge &mdash; and the Rotation tool for on/off-duty groups.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Crew &rarr; Leave.</p>\n\n<h2 id=\"do\">What you&rsquo;ll do here</h2>\n<ul class=\"bul\">\n<li>Check leave balances and who&rsquo;s on or off duty.</li>\n<li>Request leave (your own or a crew member&rsquo;s).</li>\n<li>Approve or reject leave requests.</li>\n<li>Set up and run rotation groups.</li>\n<li>Export a leave report.</li>\n</ul>\n\n<h2 id=\"read\">Read the Leave grid</h2>\n<ul class=\"bul\">\n<li>One row per crew member: Leave Type, Renewal, Entitlement, Carried Over, Approved, Daily Accrued, Available, Pending, and Status (<strong>On Duty / Off Duty</strong>).</li>\n<li><strong>Available Leave</strong> turns <span class=\"chip badchip\">red</span> when negative &mdash; the person is overdrawn.</li>\n<li>Balances are always recalculated from approved leave, so they update on the next refresh.</li>\n<li><strong>Filters:</strong> Yacht (fleet) &middot; ID &middot; Leave Type &middot; Status (On/Off Duty) &middot; Pending Leaves &middot; Leave Entitlement.</li>\n</ul>\n\n<h2 id=\"request\">Request leave</h2>\n<p>Leave requests are made on a person&rsquo;s <strong>profile</strong>, not on the Crew &rarr; Leave grid (that grid is for <em>approving</em> them).</p>\n<ol class=\"steps\">\n<li>Open the profile &rarr; <strong>Leave</strong> tab, then click <strong>Leave</strong> (top right) &mdash; the <strong>Request Leave</strong> window opens.</li>\n<li>Pick the <strong>Leave Type</strong>: Annual, Compassionate, Compensatory, Rest Days, Shore, Sick, Study or Unpaid.</li>\n<li>Choose the <strong>Leave Date Range</strong> (start and end).</li>\n<li><em>Optional:</em> add <strong>Travel Days</strong> rows, a <strong>Flight Deducted</strong> figure, <strong>Comments</strong>, and attach files.</li>\n<li><strong>Leave Days Deducted</strong> is worked out for you (leave days minus travel days). Click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The request is created as <span class=\"chip neutralchip\">Pending</span> and shows on the Crew &rarr; Leave screen for a manager to <strong>Approve</strong> or <strong>Reject</strong>. Sick, Study, Unpaid and Shore leave don&rsquo;t deduct from the balance. A crew member can always request <strong>their own</strong> leave; requesting it on someone else&rsquo;s profile needs Edit access to Leave.</p></div>\n<div class=\"callout warn\"><div class=\"co-h\">Common messages</div><p>&ldquo;Leave is already taken for one or more dates in this range&rdquo; (overlaps an existing request) &middot; &ldquo;Leave end date must be on or after start date&rdquo; &middot; &ldquo;Travel days range must be between or on start date and end date&rdquo; &middot; &ldquo;Payslip is already generated for the selected date range&hellip;&rdquo; (that period has already been paid, so leave can&rsquo;t be added over it).</p></div>\n\n<h2 id=\"approve\">Approve or reject leave</h2>\n<ol class=\"steps\">\n<li>Click <strong>View</strong> on the crew member&rsquo;s row to open their leave requests (type, dates, days, travel, comments, attachments).</li>\n<li>Find the <strong>pending</strong> request.</li>\n<li>Click <strong>Approve</strong> (&#10003;) or <strong>Reject</strong> (&#10007;).</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What approve/reject actually does</div><p>It changes the request&rsquo;s status only &mdash; <strong>no email is sent</strong>. Approving counts the leave as taken (balances drop on refresh); rejecting has no balance effect. The &#10003;/&#10007; controls are hidden on rotation rows and disabled once a request is decided.</p></div>\n\n<h2 id=\"who-approve\">Who can approve</h2>\n<p>Approving or rejecting needs <strong>Edit access to Leave</strong> <em>and</em> a manager/admin-level account &mdash; standard crew (&ldquo;user&rdquo;) accounts cannot, even with Edit.</p>\n\n<h2 id=\"rotation\">Rotation</h2>\n<p>Within Leave, <strong>Rotation</strong> manages on/off-duty groups, organised into tabs by state (Active / Disabled / Rotation Ended). Each group has on-duty and off-duty day counts, a colour, and members with individual schedules.</p>\n<ol class=\"steps\">\n<li>On Leave, click <strong>Rotation</strong>.</li>\n<li>Click <strong>+ Group</strong>.</li>\n<li>Set the group <strong>Name</strong>, <strong>Days On Duty</strong> and <strong>Days Off Duty</strong>.</li>\n<li>Add <strong>Users</strong> and pick a <strong>Colour</strong>.</li>\n<li>Click <strong>Save</strong>, then <strong>Start</strong> to begin the rotation.</li>\n</ol>\n\n<h2 id=\"rotation-controls\">Rotation controls</h2>\n<table class=\"ftab\"><thead><tr><th>Control</th><th>What it does</th><th>Reversible?</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Create / Edit group</td><td>Name, on/off days, colour, members. Members can&rsquo;t change once started; an ended group can&rsquo;t be edited.</td><td>Until started/ended</td></tr>\n<tr><td class=\"t-name\">Start</td><td>Begins the rotation (sets each member&rsquo;s first schedule).</td><td>&mdash;</td></tr>\n<tr><td class=\"t-name\">Switch</td><td>Switches members On/Off duty (or extends). Only when a switch is pending and there&rsquo;s no future schedule.</td><td>Latest segment deletable</td></tr>\n<tr><td class=\"t-name\">End Rotation</td><td>Sets end dates, moves the group to &ldquo;Rotation Ended&rdquo;, records history.</td><td><span class=\"chip badchip\">No &mdash; terminal</span></td></tr>\n<tr><td class=\"t-name\">Enable / Disable</td><td>Disables a group (with an end date) or re-enables it.</td><td><span class=\"chip okchip\">Yes</span></td></tr>\n<tr><td class=\"t-name\">Add User &middot; History</td><td>Adds crew not already in a group; History is a read-only audit log.</td><td>&mdash;</td></tr>\n<tr><td class=\"t-name\">Delete group / schedule</td><td>Deletes and resets affected leave calculations (latest schedule only).</td><td><span class=\"chip badchip\">No</span></td></tr>\n</tbody></table>\n\n<h2 id=\"rotation-rules\">Rotation rules &amp; warnings</h2>\n<ul class=\"bul\">\n<li>Group name is required; on/off days must be greater than 0; at least one member.</li>\n<li>Travel days count as work days but do <strong>not</strong> accrue leave.</li>\n</ul>\n<div class=\"callout warn\"><div class=\"co-h\">Verbatim warnings</div><p><strong>End Rotation:</strong> &ldquo;Once ended, no further switches will be possible.&rdquo; &nbsp;<strong>Delete group:</strong> resets leave calculations for the users and &ldquo;is irreversible.&rdquo; &nbsp;<strong>Delete schedule:</strong> &ldquo;You can only delete the latest schedule for a user in their group.&rdquo;</p></div>\n\n<h2 id=\"who\">Who can do this</h2>\n<ul class=\"bul\">\n<li><strong>View / Export &amp; History:</strong> View access to Leave.</li>\n<li><strong>Approve/reject, and rotation create/start/switch/end/enable/add-user:</strong> Edit access (approvals also need a manager/admin-level account).</li>\n<li><strong>Delete group or schedule:</strong> Delete access. Admins always have full access.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I apply for leave?</summary><div class=\"faq-a\"><p>On the person&rsquo;s profile &rarr; <strong>Leave</strong> tab, click <strong>Leave</strong> to open <strong>Request Leave</strong> (see <em>Request leave</em> above). A crew member can request their own leave.</p></div></details>\n<details><summary>What happens when I approve or reject leave?</summary><div class=\"faq-a\"><p><strong>Approve</strong> reduces the person&rsquo;s available balance; <strong>reject</strong> doesn&rsquo;t. No email is sent &mdash; it&rsquo;s a status change.</p></div></details>\n<details><summary>Why can&rsquo;t I approve a leave request?</summary><div class=\"faq-a\"><p>You need Edit access to Leave and a manager/admin-level account. Standard crew accounts can&rsquo;t approve or reject.</p></div></details>\n<details><summary>What&rsquo;s the difference between disabling and ending a rotation?</summary><div class=\"faq-a\"><p><strong>Disabling</strong> is reversible &mdash; you can re-enable it later. <strong>Ending</strong> a rotation is permanent.</p></div></details>\n</div>\n"}, {"id": "emergency", "name": "Emergency Contacts", "icon": "phone", "body": "\n<p class=\"lead\">Each crew member&rsquo;s single next-of-kin / emergency contact &mdash; one row per person (not a list).</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> Crew &rarr; Emergency Contacts.</p>\n\n<h2 id=\"do\">What you&rsquo;ll do here</h2>\n<ul class=\"bul\">\n<li>Look up a crew member&rsquo;s next of kin.</li>\n<li>Keep an emergency contact current.</li>\n<li>Export the emergency-contact list.</li>\n</ul>\n\n<h2 id=\"read\">Read the list</h2>\n<ul class=\"bul\">\n<li>One row per crew member: Next of Kin, Relationship, Phone, Email, Address, Country, City, State, Post Code and &ldquo;English?&rdquo;.</li>\n<li>The row&rsquo;s <strong>View</strong> opens an Emergency Contact Details panel.</li>\n<li><strong>Filters:</strong> Yacht (fleet) &middot; ID &middot; Country.</li>\n</ul>\n\n<h2 id=\"edit\">Edit a contact</h2>\n<ol class=\"steps\">\n<li>Click <strong>Edit</strong> on the crew member&rsquo;s row.</li>\n<li>Their profile opens on the <strong>Emergency Contact</strong> tab.</li>\n<li>Fill the fields, then <strong>Save</strong>.</li>\n</ol>\n\n<h2 id=\"rules\">Rules</h2>\n<ul class=\"bul\">\n<li>One contact per crew member.</li>\n<li>All fields are optional <em>except</em> Email, which must be valid if entered.</li>\n<li>Country comes from the 252-country list; &ldquo;Does the contact speak English?&rdquo; is free text (Yes/No suggested, not enforced).</li>\n<li>Export success: &ldquo;Report download started.&rdquo;</li>\n</ul>\n\n<h2 id=\"export\">Export</h2>\n<p>Click <strong>Export</strong> &rarr; &ldquo;Emergency Contacts Report&rdquo; (PDF with column selection, or Excel).</p>\n\n<h2 id=\"who\">Who can do this</h2>\n<ul class=\"bul\">\n<li><strong>View / Export:</strong> View access to Emergency Contacts.</li>\n<li><strong>Editing:</strong> Edit access (on the profile&rsquo;s Emergency Contact tab). Admins always have full access.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How many emergency contacts can someone have, and where do I edit it?</summary><div class=\"faq-a\"><p>One per crew member, edited from their profile&rsquo;s <strong>Emergency Contact</strong> tab. All fields are optional except a valid email.</p></div></details>\n</div>\n"}]}</script>
