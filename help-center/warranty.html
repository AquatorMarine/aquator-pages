    <script id="kb" type="application/json">

          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Track and resolve warranty defects on your yacht as <strong>tickets</strong> &mdash; from raising a claim against the builder&rsquo;s after-sales department through to approval &mdash; and monitor the costs against a warranty budget.</p>\n\n<h2 id=\"inside\">What&rsquo;s inside</h2>\n<p>The Warranty module has five sub-areas, all under <strong>Warranty</strong>:</p>\n<ul class=\"bul\">\n<li><strong>Tickets</strong> &mdash; raise, track and resolve each warranty defect as a ticket.</li>\n<li><strong>Calendar</strong> &mdash; see tickets placed by their due dates.</li>\n<li><strong>Project Planner</strong> &mdash; plan the warranty work.</li>\n<li><strong>Gantt Chart</strong> &mdash; view tickets along a timeline.</li>\n<li><strong>Project Finance (Cost Tracking)</strong> &mdash; track warranty spend against a budget.</li>\n</ul>\n\n<h2 id=\"people\">Two parties on every ticket</h2>\n<p>Each ticket records both who owns it internally and who is liable externally &mdash; confusing the two is a common source of questions.</p>\n<ul class=\"bul\">\n<li><strong>Assign To User</strong> &mdash; the internal owner (a crew member) managing the ticket day to day.</li>\n<li><strong>Assign To Participant</strong> &mdash; the external party, such as the builder&rsquo;s after-sales department (shown in the demo as &ldquo;Yacht Builder After-Sales Dept.&rdquo;).</li>\n</ul>\n<div class=\"callout tip\"><div class=\"co-h\">Tip</div><p>When you raise a claim against the builder, set the after-sales department as the <strong>Participant</strong> and the responsible crew member as the <strong>User</strong>.</p></div>\n\n<h2 id=\"start\">Before you start</h2>\n<ul class=\"bul\">\n<li>Decide which <strong>Department</strong> the defect sits under (e.g. Engineering, Interior) and who should own it &mdash; you assign both during creation.</li>\n<li>If the claim is against an external party, have the participant name ready.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Where do I start?</summary><div class=\"faq-a\"><p>Go to <strong>Home &rarr; Applications &rarr; Warranty &rarr; Tickets</strong> and click <strong>Add</strong> to raise your first ticket. See <strong>Tickets</strong> for the full walkthrough.</p></div></details>\n<details><summary>What&rsquo;s the difference between Tickets and Cost Tracking?</summary><div class=\"faq-a\"><p>Tickets track the defects and their resolution; cost-tracking projects track the money. They are separate areas of the module.</p></div></details>\n</div>\n"
          },
          {
            "id": "tickets",
            "name": "Tickets",
            "icon": "contract",
            "body": "\n<p class=\"lead\">A warranty ticket is one defect &mdash; raised against the responsible party, worked through a status workflow, and tracked to approval. Everything here lives under <strong>Warranty &rarr; Tickets</strong>.</p>\n\n<h2 id=\"raise\">Raise a ticket</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>Decide the <strong>Department</strong> and internal owner, and &mdash; if the claim is against an external party &mdash; have the participant name ready for <strong>Assign To Participant</strong>.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Home &rarr; Applications &rarr; Warranty &rarr; Tickets</strong>.</li>\n<li>Click <strong>Add</strong> (top right).</li>\n<li>Enter the <strong>ID</strong> (e.g. your WAR reference) and a <strong>Title</strong> describing the defect.</li>\n<li>Fill in <strong>Description</strong> and, if relevant, <strong>Shipyard Requirements</strong> using the rich-text editors.</li>\n<li>Add any <strong>Sub Tasks</strong> with <strong>+ Add Sub Task</strong> to break the fix into steps.</li>\n<li>Set the <strong>Start Date</strong> and <strong>End Date</strong>.</li>\n<li>Choose <strong>Assign To User</strong> (internal owner) and <strong>Assign To Participant</strong> (external party, e.g. the after-sales department).</li>\n<li>Set <strong>Priority</strong> (None, Low, Medium, High) and <strong>Department</strong>.</li>\n<li>Optionally set <strong>Categories</strong> and attach evidence under <strong>Images / Files</strong>.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The ticket appears in the list with a status of <span class=\"chip neutralchip\">Open</span> and is immediately searchable and filterable.</p>\n<div class=\"callout warn\"><div class=\"co-h\">Files won&rsquo;t upload?</div><p>The drop zone accepts <strong>PNG, JPG, PDF, DOC, XLS</strong> up to <strong>100&nbsp;MB</strong> each. Convert or compress anything outside those limits.</p></div>\n\n<h2 id=\"actions\">View, edit or delete</h2>\n<p>Scroll the table right to the <strong>Actions</strong> column and click the <strong>&#8942;</strong> icon on the ticket&rsquo;s row, then choose:</p>\n<ul class=\"bul\">\n<li><strong>View</strong> &mdash; the full detail: status workflow, progress bar, sub tasks, participant, comments and history.</li>\n<li><strong>Edit</strong> &mdash; reopens the same form used when adding, to change any field.</li>\n<li><strong>Calendar</strong> &mdash; places / views the ticket on the calendar.</li>\n<li><strong>Delete</strong> &mdash; removes the ticket.</li>\n</ul>\n<div class=\"callout warn\"><div class=\"co-h\">Before you delete</div><p>It is not yet confirmed whether <strong>Delete</strong> is permanent or sends the ticket to a trash/recycle area &mdash; the demo did not expose a recovery path. Treat deletion as permanent until confirmed.</p></div>\n<div class=\"callout note\"><div class=\"co-h\">Can&rsquo;t find the Actions menu?</div><p>The <strong>Actions</strong> column is the far-right column &mdash; scroll the table horizontally to reveal the <strong>&#8942;</strong> icon.</p></div>\n\n<h2 id=\"status\">Update a ticket&rsquo;s status</h2>\n<p>There are two ways to change status. <strong>From the list:</strong> click the dropdown arrow in the <strong>Status</strong> column on the ticket&rsquo;s row and pick the new status. <strong>From the ticket:</strong> open it via <strong>&#8942; &rarr; View</strong> and click the matching status button at the top (Open / On Hold / In Progress / Done / Approved / Rejected).</p>\n<p>The status badge updates immediately and the change is recorded in the ticket&rsquo;s activity log (e.g. &ldquo;Started progress on the task&rdquo;). See <strong>Statuses &amp; Progress</strong> for what each status means.</p>\n\n<h2 id=\"filter\">Filter the list</h2>\n<ol class=\"steps\">\n<li>On <strong>Warranty &rarr; Tickets</strong>, click <strong>Filters</strong>.</li>\n<li>Pick a category: Assign To User, Assign To Participant, End Date, Priority, Category, Department or Status.</li>\n<li>The bar shows <strong>Active View</strong> with a count of how many filters are applied.</li>\n<li>To remove filters, use <strong>Clear All</strong> in the filter panel or on the Active View bar.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Tickets seem to be missing?</div><p>Check for an active filter &mdash; the number badge on <strong>Filters</strong> shows how many are applied. Click <strong>Clear All</strong> to see every ticket. An empty list can also simply mean none have been raised yet.</p></div>\n\n<h2 id=\"export\">Export a report</h2>\n<p>Click <strong>Export</strong> (top right) and choose:</p>\n<ul class=\"bul\">\n<li><strong>Ticket Report</strong> &mdash; available as a document or grid/spreadsheet format (icons beside the option).</li>\n<li><strong>Custom Project Report</strong> &mdash; a document-format report.</li>\n</ul>\n<p>The selected report is generated for download.</p>\n\n<h2 id=\"history\">History &amp; comments</h2>\n<p>Open a ticket via <strong>&#8942; &rarr; View</strong> and scroll to the bottom. You&rsquo;ll see <strong>Created By</strong> and <strong>Last updated By</strong> with timestamps, a <strong>Comments</strong> box (type and click <strong>Send</strong>, with an option to attach a link), and a chronological activity log. Status changes, due-date changes and creation are all recorded automatically.</p>\n\n<h2 id=\"recurring\">Recurring tickets</h2>\n<p>A ticket can be set to recur &mdash; the ticket view shows a <strong>Repeatability</strong> line such as &ldquo;Repeats every 1 month on 22nd day of the month.&rdquo; Each occurrence appears as its own row sharing the same ID (e.g. two WAR004 rows with different dates).</p>\n<div class=\"callout tip\"><div class=\"co-h\">Not a duplicate</div><p>If you notice what looks like a duplicate ticket in the list, it&rsquo;s most likely a recurrence, not an error.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why is the Tickets list empty?</summary><div class=\"faq-a\"><p>Either no tickets have been raised yet, or an active filter is hiding them. Click <strong>Clear All</strong> to check.</p></div></details>\n<details><summary>Can a ticket repeat automatically?</summary><div class=\"faq-a\"><p>Yes &mdash; set <strong>Repeatability</strong> on the ticket. Each occurrence shows as a separate row sharing the same ID.</p></div></details>\n<details><summary>Which file types can I attach?</summary><div class=\"faq-a\"><p>PNG, JPG, PDF, DOC and XLS, up to 100&nbsp;MB each.</p></div></details>\n</div>\n"
          },
          {
            "id": "statuses",
            "name": "Statuses &amp; Progress",
            "icon": "badge",
            "body": "\n<p class=\"lead\">A warranty ticket moves through six statuses, while its progress bar is driven separately by sub tasks. This page explains both, plus the two parties attached to every ticket.</p>\n\n<h2 id=\"six\">The six statuses</h2>\n<p>Selectable from the list or the ticket view:</p>\n<table class=\"ftab\"><thead><tr><th>Status</th><th>What it means</th></tr></thead><tbody>\n<tr><td><span class=\"chip neutralchip\">Open</span></td><td>The starting state for any newly raised ticket &mdash; the defect is logged but work hasn&rsquo;t begun.</td></tr>\n<tr><td><span class=\"chip warnchip\">In Progress</span></td><td>The fix is actively being worked.</td></tr>\n<tr><td><span class=\"chip warnchip\">On Hold</span></td><td>Paused without closing &mdash; for example, while waiting on parts or a response from the builder.</td></tr>\n<tr><td><span class=\"chip neutralchip\">Done</span></td><td>The work itself is finished.</td></tr>\n<tr><td><span class=\"chip okchip\">Approved</span></td><td>The sign-off state &mdash; the responsible party or the yacht has accepted the resolution. The meaningful &ldquo;closed and accepted&rdquo; outcome for a warranty claim.</td></tr>\n<tr><td><span class=\"chip badchip\">Rejected</span></td><td>The claim or the proposed resolution is not accepted.</td></tr>\n</tbody></table>\n\n<h2 id=\"done-approved\">Done vs Approved</h2>\n<p>The distinction users most often miss: marking a ticket <strong>Done</strong> records that the work is complete, but <strong>Approved</strong> is the formal acceptance. A ticket can be Done without yet being Approved. Every status change is timestamped in the activity log, so you can see who moved it and when.</p>\n\n<h2 id=\"progress\">How progress is calculated</h2>\n<p>The <strong>Progress</strong> bar reflects how many of a ticket&rsquo;s <strong>Sub Tasks</strong> are complete &mdash; not its status. As you tick off sub tasks (for example &ldquo;Run diagnostics,&rdquo; &ldquo;Inspect filters,&rdquo; &ldquo;Replace membrane if needed&rdquo;) in the ticket view, the percentage rises. A ticket with three sub tasks and one checked shows partial progress rather than 0% or 100%. This means a ticket can be In Progress with a low percentage, or show high progress before it&rsquo;s formally Approved.</p>\n<div class=\"callout best\"><div class=\"co-h\">Best practice</div><p>Break each fix into sub tasks rather than leaving it as a single item &mdash; that&rsquo;s what makes the progress bar meaningful.</p></div>\n\n<h2 id=\"parties\">Assign To User vs Participant</h2>\n<p><strong>Assign To User</strong> is the internal owner &mdash; the crew member responsible for the ticket day to day. <strong>Assign To Participant</strong> is the external party associated with the claim, such as the builder&rsquo;s after-sales department. This separation lets you track who owns the resolution internally while recording which outside organisation is liable under the warranty.</p>\n"
          },
          {
            "id": "cost",
            "name": "Cost Tracking",
            "icon": "cash",
            "body": "\n<p class=\"lead\">The Project Finance area lets you track warranty-related spend against a budget, separately from individual tickets. Path: <strong>Warranty &rarr; Cost Tracking &rarr; Projects</strong>.</p>\n\n<h2 id=\"how\">How cost tracking works</h2>\n<p>Each row is a finance project. Tickets track the defects and their resolution; cost-tracking projects track the money. Use this to see, at a glance, how much of your allocated warranty budget remains.</p>\n<table class=\"ftab\"><thead><tr><th>Column</th><th>What it shows</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Name</td><td>The finance project name, e.g. &ldquo;Warranty Expenses.&rdquo;</td></tr>\n<tr><td class=\"t-name\">Project Date</td><td>The date range the project covers.</td></tr>\n<tr><td class=\"t-name\">Yacht</td><td>The yacht the project belongs to.</td></tr>\n<tr><td class=\"t-name\">Budget</td><td>The amount allocated.</td></tr>\n<tr><td class=\"t-name\">Balance</td><td>What remains after costs are logged.</td></tr>\n</tbody></table>\n<div class=\"callout warn\"><div class=\"co-h\">To confirm before relying on this</div><p>How individual costs / line items are added inside a project &mdash; and whether tickets link directly to a finance project &mdash; has not yet been documented. Currency behaviour also varies (the demo showed one project in &euro; and another in $), so confirm the currency on each project.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Is cost tracking the same as a ticket?</summary><div class=\"faq-a\"><p>No. Tickets track defects and their resolution; cost-tracking projects track spend against a budget. They are separate areas of the Warranty module.</p></div></details>\n<details><summary>Where do I find it?</summary><div class=\"faq-a\"><p><strong>Warranty &rarr; Cost Tracking &rarr; Projects</strong>.</p></div></details>\n</div>\n"
          }
        ]
      }
