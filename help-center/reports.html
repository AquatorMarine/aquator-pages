    {
      "id": "overview",
      "name": "Introduction",
      "icon": "compass",
      "body": "\n<p class=\"lead\">The Reports module turns the data already captured across Aquator into clean, shareable documents. Instead of exporting one screen at a time, Reports lets you pull figures from across the platform &mdash; accounts, technical/PMS, crew, compliance, charters and more &mdash; and produce a single document for owners, accountants, captains and auditors.</p>\n\n<h2 id=\"where\">Where to find Reports</h2>\n<p>Reports sits in the left navigation under <strong>Applications</strong>, with its own icon between <strong>File Manager</strong> and <strong>Integrations</strong>. Inside it you&rsquo;ll find two areas covered in this guide: <strong>Standard</strong> and <strong>Application</strong>.</p>\n<table class=\"ftab\"><thead><tr><th>Area</th><th>What it&rsquo;s for</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Standard</td><td>Ready-made, pre-built reports you generate with one click and a date range. No setup required.</td></tr>\n<tr><td class=\"t-name\">Application</td><td>A build-your-own report tool. Tick the sections you want (pulled from across the platform), name and categorise the report, then save it to reuse later.</td></tr>\n</tbody></table>\n\n<h2 id=\"who\">Who uses it</h2>\n<ul class=\"bul\">\n<li>Owners and management who want a single rollup instead of several separate exports.</li>\n<li>Accountants running the monthly close.</li>\n<li>Captains, HR officers and yacht managers preparing crew and flag-state evidence.</li>\n<li>Power users who want to assemble and reuse their own report templates.</li>\n</ul>\n\n<h2 id=\"access\">Roles &amp; access</h2>\n<p>Access follows Aquator&rsquo;s <strong>company &rarr; fleet &rarr; yacht</strong> hierarchy, with per-module <strong>view / edit / delete</strong> rights. What you see in Reports is driven entirely by the permissions your role and plan grant &mdash; the menu, the report cards and even individual sections appear only where you have access.</p>\n<ul class=\"bul\">\n<li><strong>See the Reports menu</strong> &mdash; any role granted view on Reports for its scope.</li>\n<li><strong>Generate a Standard report</strong> &mdash; you need view on that specific report, and the report&rsquo;s module must be enabled for your account. Each card shows the roles that qualify (e.g. Yacht Manager).</li>\n<li><strong>Build &amp; save an Application report</strong> &mdash; roles with view/edit on the Application area; deleting a saved report needs delete rights.</li>\n<li><strong>Admin / superadmin</strong> roles have the broadest access.</li>\n</ul>\n<div class=\"callout note\"><div class=\"co-h\">Availability is data-driven, not tied to plan names</div><p>Your plan tier and your role together determine which modules, standard reports and sections are switched on; Aquator simply renders what your permission profile allows. If a report or section doesn&rsquo;t appear, it hasn&rsquo;t been enabled for your account.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Do I need special access to use Reports?</summary><div class=\"faq-a\"><p>Yes &mdash; the Reports menu, each report card and each Application section only appear where your role has been granted access for your company, fleet or yacht. If you can&rsquo;t see something you expect, ask your administrator to enable it for your role.</p></div></details>\n<details><summary>I see &ldquo;No report categories are available for your account&rdquo; &mdash; why?</summary><div class=\"faq-a\"><p>No report areas are enabled for your plan or role. Contact your administrator to have the reports you need switched on.</p></div></details>\n</div>\n"
    },
    {
      "id": "standard",
      "name": "Standard Reports",
      "icon": "chart",
      "body": "\n<p class=\"lead\">Standard Reports are the fastest route to a finished document. Each one is a single PDF that rolls up several underlying reports for a date range you choose.</p>\n\n<h2 id=\"available\">The available standard reports</h2>\n<table class=\"ftab\"><thead><tr><th>Report</th><th>What it covers</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Owner Report</td><td>A single-document rollup of Account, Technical, Crew &amp; Compliance information &mdash; period spend versus budget, open critical defects, crew certification compliance and certificates expiring. Built for the owner who wants one PDF, not four.</td></tr>\n<tr><td class=\"t-name\">Accounting Report</td><td>Accounting, finance, procurement and payroll in one document &mdash; P&amp;L summary, budget versus actual, transaction journal, AR/AP ageing, purchase orders, top suppliers and a payroll summary. The source document for your monthly close.</td></tr>\n<tr><td class=\"t-name\">Crew Report</td><td>Roster, certifications, hours of rest, leave balances and retention risk in a single document. Supports MLC 2006 evidence, crew planning and flag-state inspections &mdash; built for the captain, HR officer and yacht manager.</td></tr>\n<tr><td class=\"t-name\">Compliance Report</td><td>An SMS and ISM evidence pack &mdash; open SMS items by priority, drill completion by type, vessel certificate expiry status and HoWR captain sign-off rate. The submission-ready evidence document for flag-state and ISM auditors.</td></tr>\n</tbody></table>\n\n<h2 id=\"generate\">To generate a standard report</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Reports &rarr; Standard</strong>.</li>\n<li>Find the report card you need. Each card shows its format (PDF) and the roles that can use it.</li>\n<li>Click <strong>Generate</strong> on that card.</li>\n<li>In the <strong>Select the reporting period</strong> dialog, set the <strong>Date Range</strong>. It defaults to 1 January of the current year through the end of the current month &mdash; adjust if you need a different window.</li>\n<li>Click <strong>Generate Report</strong>. Aquator builds the document for your date range and opens the finished PDF in a new browser tab.</li>\n</ol>\n\n<h2 id=\"visibility\">Which cards you see</h2>\n<p>The cards on the Standard page are filtered to your account:</p>\n<ul class=\"bul\">\n<li>A report only appears if its <strong>module is enabled</strong> for your account <em>and</em> your role has <strong>view</strong> (or higher) on that report.</li>\n<li>The <strong>Compliance Report</strong> only appears when you are viewing a <strong>specific yacht</strong>. At company or fleet level it is hidden &mdash; select a yacht to generate it.</li>\n</ul>\n<div class=\"callout warn\"><div class=\"co-h\">If a report can&rsquo;t be built</div><p>You&rsquo;ll see a <strong>&ldquo;Failed to generate report&rdquo;</strong> message. The most common cause is no data in the selected period &mdash; widen the date range or confirm the underlying module has data, then try again.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why do I only see three Standard reports when there are four?</summary><div class=\"faq-a\"><p>The <strong>Compliance Report</strong> only shows when you have a specific yacht selected &mdash; at company or fleet level it&rsquo;s hidden. A report can also be hidden if its module isn&rsquo;t enabled for your account or your role doesn&rsquo;t have view on it. Select a yacht, or ask your administrator to enable the report for your role.</p></div></details>\n<details><summary>What date range does a Standard report use by default?</summary><div class=\"faq-a\"><p>From 1 January of the current year to the end of the current month. You can change it in the date-range dialog before generating.</p></div></details>\n<details><summary>Where does the finished report open?</summary><div class=\"faq-a\"><p>In a new browser tab. If nothing opens, check that your browser isn&rsquo;t blocking pop-ups for Aquator.</p></div></details>\n<details><summary>Can I report on a single yacht or the whole fleet?</summary><div class=\"faq-a\"><p>Both. When you generate from a specific yacht, the report is scoped to that yacht; at fleet/company level it aggregates across the yachts you have access to (note the Compliance Report is yacht-level only).</p></div></details>\n<details><summary>What happens with no data, or with a very large fleet?</summary><div class=\"faq-a\"><p>With no data the report still generates, but the relevant sections come through empty rather than erroring. Large fleets pull more data, so wide date ranges across many yachts take longer to build &mdash; narrow the range or scope where you can.</p></div></details>\n<details><summary>How are mixed currencies handled in the Accounting / Owner reports?</summary><div class=\"faq-a\"><p>Financial figures follow how amounts are recorded in the underlying accounting modules. Where multiple currencies are in play, review the source figures rather than assuming a single converted total.</p></div></details>\n</div>\n"
    },
    {
      "id": "application",
      "name": "Application Report",
      "icon": "contract",
      "body": "\n<p class=\"lead\">The Application Report lets you assemble a custom document from sections across the whole platform, preview it live, then save it for reuse.</p>\n\n<h2 id=\"toolbar\">The toolbar</h2>\n<table class=\"ftab\"><thead><tr><th>Button</th><th>What it does</th></tr></thead><tbody>\n<tr><td class=\"t-name\">New</td><td>Start a fresh, empty report.</td></tr>\n<tr><td class=\"t-name\">Select</td><td>Open the <strong>Report Sections</strong> picker &mdash; choose the date range and tick the sections to include.</td></tr>\n<tr><td class=\"t-name\">Save</td><td>Save the current report. You&rsquo;ll be asked for a name and category the first time.</td></tr>\n<tr><td class=\"t-name\">Load</td><td>Reopen one of your saved reports, grouped by category.</td></tr>\n</tbody></table>\n\n<h2 id=\"build\">To build a new report</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Reports &rarr; Application</strong> and click <strong>New</strong>.</li>\n<li>Click <strong>Select</strong> to open the <strong>Report Sections</strong> picker.</li>\n<li>Set the <strong>date range</strong> at the top of the picker (it defaults to roughly the last 30 days).</li>\n<li>Tick the sections you want. Click <strong>Full Report</strong> to include everything available to you, or pick individual sections, then click <strong>Save</strong> in the picker.</li>\n<li>The report renders in the viewer. Use the toolbar to page through, zoom, switch between single-page and continuous view, search the content, print, or export.</li>\n</ol>\n\n<h2 id=\"sections\">The sections you can include</h2>\n<p>The picker is built from the modules <em>you</em> have access to that contain reportable data, grouped by module &mdash; for example <strong>Company</strong> (Profile), <strong>Fleet</strong> (Yachts, AIS Tracker, Calendar, Task Tracker), <strong>SMS</strong> (Editor, Library, Templates, Populated) and <strong>Operations</strong> (To Do, Team, Personal Information, Employment, Payroll, Leave, Emergency Contacts, and more). Your exact list depends on your plan and permissions, so it may be longer or shorter than this.</p>\n<p>Sections marked <strong>Coming Soon</strong> can be seen but aren&rsquo;t generatable yet &mdash; they&rsquo;re disabled, so tick only the sections without that label for now.</p>\n\n<h2 id=\"save\">Save, load and delete</h2>\n<ul class=\"bul\">\n<li><strong>Save</strong> &mdash; Click <strong>Save</strong>, give the report a <strong>Report Name</strong> and optionally assign a <strong>Category</strong>. Names must be unique &mdash; you&rsquo;ll see &ldquo;Report name already exists&rdquo; if one clashes. The built-in categories are Charter, Equipment, Maintenance, Provisions, Refit and Safety, and you can type your own.</li>\n<li><strong>Load</strong> &mdash; Click <strong>Load</strong> to reopen any saved report. Reports are grouped by category, with uncategorised ones under <strong>Other</strong>. You can also rename a loaded report with the edit icon next to its name.</li>\n<li><strong>Delete</strong> &mdash; In the <strong>Load</strong> list, click the <strong>&times;</strong> on a saved report and confirm in the prompt. Deletions are permanent, so do these yourself rather than relying on automation.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why is a section greyed out or labelled &ldquo;Coming Soon&rdquo;?</summary><div class=\"faq-a\"><p>Those sections are shown so you know they&rsquo;re planned, but they&rsquo;re disabled and can&rsquo;t be generated yet. Tick only the sections without the &ldquo;Coming Soon&rdquo; label.</p></div></details>\n<details><summary>What date range does the Application report use by default?</summary><div class=\"faq-a\"><p>Roughly the last 30 days. Change it in the date-range field at the top of the Report Sections picker before generating. (Standard reports use a different default &mdash; 1 January to the end of the current month.)</p></div></details>\n<details><summary>Can I reuse or edit a report I built?</summary><div class=\"faq-a\"><p>Yes. Click <strong>Save</strong> with a unique name and category, then reopen it any time via <strong>Load</strong>. Open it, change the sections or rename it, and Save again.</p></div></details>\n<details><summary>Who can delete a saved report?</summary><div class=\"faq-a\"><p>Only roles with delete rights, and deletions are permanent &mdash; so delete saved reports yourself rather than relying on automation.</p></div></details>\n</div>\n"
    },
    {
      "id": "export",
      "name": "Export &amp; data sources",
      "icon": "receipt",
      "body": "\n<p class=\"lead\">Reports generate on demand. Standard reports come out as PDF; the Application report viewer can export to several formats.</p>\n\n<h2 id=\"formats\">Formats</h2>\n<ul class=\"bul\">\n<li><strong>Standard reports</strong> &mdash; open as <strong>PDF</strong>.</li>\n<li><strong>Application reports</strong> &mdash; from the viewer toolbar you can export to <strong>PDF, Excel, HTML or Word</strong>.</li>\n<li><strong>Other module exports</strong> across the platform &mdash; many offer both <strong>PDF and Excel</strong> (for example work-in-progress, inventory-on-hand, inventory movement and the purchase-order import report). Check the export options on the specific report.</li>\n</ul>\n\n<h2 id=\"generation\">How generation works</h2>\n<p>When you generate a report, Aquator builds it on demand for your chosen date range, saves an export record, then opens the finished file in a new tab. Documents are produced fresh each time &mdash; there is no cached copy. Standard reports are built for your browser&rsquo;s current time zone.</p>\n\n<div class=\"callout note\"><div class=\"co-h\">Reports carry your branding</div><p>On white-labelled accounts, generated reports use your brand &mdash; logo, brand name, colours and footer links &mdash; in the header and footer. See <strong>White Labeling</strong> for how that&rsquo;s set up.</p></div>\n\n<h2 id=\"scheduling\">Scheduling</h2>\n<div class=\"callout note\"><div class=\"co-h\">No automated recurring delivery yet</div><p>There is currently no built-in scheduling in the Reports module &mdash; reports are generated on demand. If you need a report regularly, generate it manually for each period (for example, monthly for the accounting close).</p></div>\n\n<h2 id=\"sources\">Data sources</h2>\n<p>Reports pull live from across Aquator, including:</p>\n<ul class=\"bul\">\n<li><strong>PMS / technical</strong> &mdash; work orders, equipment, inventory, logs, purchase orders, audits</li>\n<li><strong>Refit / yacht production</strong> &mdash; planning, BOM, WIP, finance</li>\n<li><strong>Crew</strong> &mdash; qualifications, personal information, employment, payroll, leave, emergency contacts</li>\n<li><strong>IMO</strong> &mdash; crew and passenger lists</li>\n<li><strong>ISM / SMS</strong> &mdash; forms, library, drill matrix, certificate tracking</li>\n<li><strong>Hours of Work &amp; Rest</strong></li>\n<li><strong>Charters</strong> &mdash; APA, payment details, guest profiles</li>\n<li><strong>Accounting</strong> &mdash; transactions, budget, category, budget-vs-actual</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Can I schedule reports to run automatically?</summary><div class=\"faq-a\"><p>Not currently. Reports are generated on demand, so you&rsquo;ll need to regenerate them each period (for example, each month for the accounting close).</p></div></details>\n<details><summary>What formats can I export?</summary><div class=\"faq-a\"><p>Standard reports open as PDF. The Application report viewer can export to PDF, Excel, HTML or Word. Many other module exports offer PDF and Excel &mdash; check the options on the specific report.</p></div></details>\n<details><summary>Will reports show my company branding?</summary><div class=\"faq-a\"><p>On white-labelled accounts, yes &mdash; your logo, brand name, colours and footer links appear in the report header and footer automatically. See the <strong>White Labeling</strong> guide to set this up.</p></div></details>\n<details><summary>Are my generated reports stored?</summary><div class=\"faq-a\"><p>An export record is kept, but the document itself is built fresh every time you generate &mdash; there&rsquo;s no cached file to re-download, so regenerate when you need a current copy.</p></div></details>\n</div>\n"
    }
  ]
}
