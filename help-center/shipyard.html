    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "overview",
            "name": "Introduction",
            "icon": "compass",
            "body": "\n<p class=\"lead\">The shipyard build-and-procurement module. Define what parts a build needs (Bill of Materials), schedule the work (Planning), track stock (Inventory), and turn material requirements into purchase orders (Purchase List &rarr; Purchase Orders).</p>\n\n<h2 id=\"where\">Where to find it</h2>\n<p>Open <strong>Shipyard</strong> from the left sidebar &mdash; it opens to <strong>Shipyard ERP</strong>. The sub-nav has two groups: <strong>Shipyard ERP</strong> (Bill Of Materials, Planning, Inventory) and <strong>Purchase</strong> (Purchase List, Purchase Orders). Breadcrumb: <strong>Home &rsaquo; Applications &rsaquo; Shipyard ERP &rsaquo; [section]</strong>.</p>\n\n<h2 id=\"flow\">The workflow, in order</h2>\n<p>The module moves a build from &ldquo;what materials do we need&rdquo; to &ldquo;the parts are on order,&rdquo; and the sections are meant to be used in that order:</p>\n<ul class=\"bul\">\n<li><strong>Bill Of Materials (BOM)</strong> &mdash; list every part a build requires, under numbered <strong>Work Centers</strong> (1. Hull &amp; Structure &hellip; 7. Testing &amp; QA). Each line carries part, supplier, required qty, unit price, lead time and live status badges.</li>\n<li><strong>Inventory</strong> &mdash; your stock record: what&rsquo;s on hand, free, and allocated to a build. A part&rsquo;s <strong>Free Stock</strong> can go negative &mdash; the signal to order more.</li>\n<li><strong>Purchase List</strong> &mdash; the procurement worklist: parts that still need ordering, grouped by project and work center, each <strong>To Order</strong> or <strong>PO Generated</strong>.</li>\n<li><strong>Purchase Orders</strong> &mdash; the record of POs you&rsquo;ve raised (PO number, supplier, paid status, paid %, delivery dates).</li>\n<li><strong>Planning</strong> &mdash; schedules the labour per work center (start/end dates, required vs worked hours, completion bar).</li>\n</ul>\n\n<h2 id=\"badges\">What the status badges mean</h2>\n<p>The BOM and Purchase tables carry several colour-coded status columns that track a part from requirement to payment. They look similar but answer different questions &mdash; read each on its own:</p>\n<table class=\"ftab\"><thead><tr><th>Badge</th><th>Answers</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Allocation Status</td><td>Whether stock is committed to or pulled for the build &mdash; e.g. <strong>Issued</strong> means stock has been issued against this line.</td></tr>\n<tr><td class=\"t-name\">Order Status</td><td>Does this still need ordering? <strong>To Order</strong> (no PO yet) or <strong>PO Generated</strong>.</td></tr>\n<tr><td class=\"t-name\">PO Status</td><td>The purchase order&rsquo;s delivery progress &mdash; e.g. <strong>Received</strong> once goods arrive.</td></tr>\n<tr><td class=\"t-name\">Paid Status</td><td>Payment against the PO &mdash; e.g. <strong>Partial</strong>, alongside a <strong>Paid %</strong> on the Purchase Orders screen.</td></tr>\n</tbody></table>\n<div class=\"callout tip\"><div class=\"co-h\">They&rsquo;re independent</div><p>A single line can read <strong>Issued / PO Generated / Received / Partial</strong> at once &mdash; issued to the build, ordered, delivered, but only partly paid. One badge doesn&rsquo;t imply the others.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why is my Purchase List (or Inventory) empty when I know there&rsquo;s data?</summary><div class=\"faq-a\"><p>These screens open with a default filter applied (the <strong>Filters</strong> button shows a count badge). Click <strong>Clear All</strong> on the Active View bar, or adjust the filter, to reveal all rows.</p></div></details>\n<details><summary>Can I order more parts than I have in stock?</summary><div class=\"faq-a\"><p>Yes. When required/allocated units exceed stock on hand, the BOM line&rsquo;s <strong>Free Stock</strong> shows a negative number &mdash; the signal it needs procuring. It then surfaces in the Purchase List as <strong>To Order</strong>.</p></div></details>\n</div>\n"
          },
          {
            "id": "bom",
            "name": "Bill of Materials",
            "icon": "receipt",
            "body": "\n<p class=\"lead\">The Bill of Materials lists every part a build requires, grouped under numbered Work Centers and Categories. Parts come from Inventory; shortages flow to the Purchase List.</p>\n\n<h2 id=\"add\">Add a BOM line</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>The <strong>Part</strong> must already exist in <strong>Inventory</strong> &mdash; the Part dropdown only lists existing items (shown as &ldquo;Part Name &ndash; Part Number&rdquo;). Know which <strong>Work Center</strong> and <strong>Category</strong> the line belongs to.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Shipyard &rsaquo; Bill Of Materials</strong> and click <strong>Add</strong> (top right).</li>\n<li>In <strong>Work Center</strong>, select a work center (e.g. &ldquo;1. Hull &amp; Structure&rdquo;).</li>\n<li>In <strong>Categories</strong> (required, labelled red), select one or more &mdash; a new &ldquo;Select&hellip;&rdquo; row appears so you can add more.</li>\n<li>Under <strong>Part 1</strong>, choose the <strong>Part</strong> and enter <strong>Required Units</strong>.</li>\n<li>To add more parts to the same line, click <strong>+ Add Part</strong> and repeat.</li>\n<li>(Optional) Attach files under <strong>Images / Files</strong> (PNG, JPG, PDF, DOC, XLS; max 100&nbsp;MB).</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>A green toast reads <strong>&ldquo;Bill Of Material added&rdquo;</strong> and the line appears under its work center/category grouping; the category subtotal and work center total update to include it.</p>\n<div class=\"callout note\"><div class=\"co-h\">Negative Free Stock isn&rsquo;t an error</div><p>A saved line showing <strong>Free Stock</strong> like <strong>-74</strong> means required/allocated quantity exceeds stock on hand &mdash; you need to procure more, and the line will appear in the Purchase List.</p></div>\n\n<h2 id=\"edit\">Edit a BOM line</h2>\n<div class=\"callout note\"><div class=\"co-h\">Find the Actions menu</div><p>The <strong>Actions</strong> column is the far-right column of the BOM table &mdash; scroll the table horizontally to reveal it. Row cells aren&rsquo;t editable inline; clicking a cell only highlights the row.</p></div>\n<ol class=\"steps\">\n<li>Scroll the table right to the <strong>Actions</strong> column and click the three-dot (<strong>&#8942;</strong>) menu on the line.</li>\n<li>Choose <strong>Edit</strong> (the menu also offers <strong>View, Delete</strong> and <strong>Create Purchase Order</strong>).</li>\n<li>Update fields &mdash; e.g. Required Units, Work Center, Categories, Part or Actual Delivery Date.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The line updates in place and the category subtotal and work center total recalculate automatically.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Where do I find the Edit / Delete options for a BOM line?</summary><div class=\"faq-a\"><p>In the <strong>Actions</strong> column at the far right &mdash; scroll horizontally, then click the <strong>&#8942;</strong> icon. The menu has View, Edit, Delete and Create Purchase Order.</p></div></details>\n<details><summary>Can I raise a purchase order straight from a BOM line?</summary><div class=\"faq-a\"><p>Yes &mdash; open the line&rsquo;s <strong>&#8942;</strong> menu and choose <strong>Create Purchase Order</strong> (or use <strong>Generate PO</strong> on the Purchase List).</p></div></details>\n</div>\n"
          },
          {
            "id": "inventory",
            "name": "Inventory",
            "icon": "tag",
            "body": "\n<p class=\"lead\">Inventory is your stock record of parts. Adding an item here is what makes it selectable later as a <strong>Part</strong> in the Bill of Materials.</p>\n\n<h2 id=\"add\">Add an inventory item</h2>\n<div class=\"callout note\"><div class=\"co-h\">Before you start</div><p>You can&rsquo;t set on-hand stock in this form &mdash; <strong>Total Stock</strong> notes &ldquo;Adjust quantity via the adjust stock,&rdquo; so quantity changes happen through a separate stock-adjust action, not the Add form.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Shipyard &rsaquo; Inventory</strong> and click <strong>Add</strong>.</li>\n<li>Complete the fields: <strong>Name, Part Number, Serial Number, Manufacturer, Supplier, Supplier Description, Categories, Unit Of Measure (UOM), Unit Weight, Unit Price (Supplier), Unit Price (Inventory), Minimum Free Stock</strong> and <strong>Description</strong>.</li>\n<li>(Optional) Add an image.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<p>The item appears in the Inventory list with a <strong>QC Status</strong> badge (e.g. &ldquo;QC Pending&rdquo; or &ldquo;QC Done&rdquo;) and is now selectable as a Part in the Bill of Materials.</p>\n<div class=\"callout note\"><div class=\"co-h\">Reading Inventory</div><p>The three cards at the top &mdash; <strong>Total Value of Stock, Total Value of Free Stock, Total Value of Allocated Stock</strong> &mdash; summarise your stock value. If the list shows &ldquo;No Rows To Show,&rdquo; a filter is applied; clear it to see all items.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why can&rsquo;t I set the stock quantity when adding an item?</summary><div class=\"faq-a\"><p>The <strong>Total Stock</strong> field is informational on the Add form (&ldquo;Adjust quantity via the adjust stock&rdquo;). Quantity is changed through the separate <strong>stock-adjust</strong> action, not the Add/Edit form.</p></div></details>\n</div>\n"
          },
          {
            "id": "purchase",
            "name": "Purchase",
            "icon": "cash",
            "body": "\n<p class=\"lead\">The Purchase group turns material requirements into orders: the <strong>Purchase List</strong> shows what still needs ordering, and <strong>Purchase Orders</strong> is the register of POs you&rsquo;ve raised.</p>\n\n<h2 id=\"list\">Read and use the Purchase List</h2>\n<div class=\"callout note\"><div class=\"co-h\">Opens filtered</div><p>The Purchase List opens with a default filter applied (the <strong>Filters</strong> button shows a &ldquo;1&rdquo; badge), so it may look empty (&ldquo;No Rows To Show&rdquo;) on first open. Click <strong>Clear All</strong> on the Active View bar to reveal all rows.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Shipyard &rsaquo; Purchase List</strong>.</li>\n<li>Review the columns: Project, Work Center, Part Name, Part Number, Unit Price, Order Status, Date To Order, Quantity To Order.</li>\n<li>Look for lines with Order Status <strong>To Order</strong> &mdash; these still need a PO. <strong>PO Generated</strong> lines are already ordered.</li>\n</ol>\n<p>Only parts that need ordering appear; fully stocked or already-ordered parts won&rsquo;t show as &ldquo;To Order.&rdquo;</p>\n\n<h2 id=\"generate\">Generate a Purchase Order</h2>\n<div class=\"callout note\"><div class=\"co-h\">Two entry points</div><p>The <strong>Generate PO</strong> button on the Purchase List, or <strong>Create Purchase Order</strong> in the <strong>&#8942;</strong> Actions menu of a Bill Of Materials line. <strong>Supplier</strong> is required on the form.</p></div>\n<ol class=\"steps\">\n<li>On the Purchase List, click <strong>Generate PO</strong> (top right) &mdash; or use a BOM line&rsquo;s <strong>&#8942; &rarr; Create Purchase Order</strong>.</li>\n<li>The <strong>PO Number</strong> is auto-generated (e.g. PO-06-2026-0001). Enter a <strong>PO Title</strong>.</li>\n<li>Select the <strong>Supplier</strong>.</li>\n<li>Add line items: choose <strong>Part Name</strong>, then enter <strong>Quantity</strong> and <strong>Cost</strong> &mdash; the <strong>Amount</strong> calculates automatically. Click <strong>+ Add an item</strong> for more.</li>\n<li>(Optional) Use <strong>+ Add taxes and cost</strong> and <strong>+ Add extra fees</strong> to adjust the Subtotal/Total. Set the <strong>Fx Rate</strong> for another currency &mdash; <strong>Total (Primary)</strong> shows the converted total.</li>\n<li>Fill in the <strong>Shipping Address</strong> (scroll down) and <strong>Save</strong>.</li>\n</ol>\n<p>The PO appears under <strong>Purchase Orders</strong>, and the related parts move from <strong>To Order</strong> to <strong>PO Generated</strong> in the Purchase List.</p>\n<div class=\"callout note\"><div class=\"co-h\">Total shows $0.00?</div><p>No line item has a Quantity and Cost yet &mdash; add at least one with values. For a wrong-currency total, check the <strong>Fx Rate</strong>; <strong>Total (Primary)</strong> reflects your base currency after conversion.</p></div>\n\n<h2 id=\"orders\">Track purchase orders</h2>\n<p>Go to <strong>Shipyard &rsaquo; Purchase Orders</strong> &mdash; the live register of all raised POs. Review by <strong>PO Title, PO Number, Supplier, Paid Status, Paid %, Order Date, Delivery Date</strong> (scroll right for more), and use <strong>Search, Filters</strong> or <strong>Export</strong>. <strong>Paid Status</strong> (e.g. &ldquo;Partial&rdquo;) and <strong>Paid %</strong> show payment progress at a glance. <strong>&ldquo;No Rows To Show&rdquo;</strong> means no POs have been generated yet.</p>\n"
          },
          {
            "id": "planning",
            "name": "Planning",
            "icon": "calendar",
            "body": "\n<p class=\"lead\">Planning is the labour-scheduling view for the build, organised by the same numbered Work Centers as the Bill of Materials.</p>\n\n<h2 id=\"how\">How Planning works</h2>\n<p>Each row tracks <strong>Start Date, End Date, Required Labour Hours</strong> and <strong>Labour Hours Worked</strong>, and the page header shows an overall completion progress bar with a date stamp (e.g. &ldquo;0% complete as of 08/06/2026&rdquo;). This is where you compare planned effort against logged effort per work center to see how the build is tracking.</p>\n<p>Because it uses the same numbered work centers as the BOM, the two views line up. The screen includes <strong>Filters, Search, Export</strong> and an additional chart/graph view toggle for visualising progress. When nothing is scheduled yet, it shows <strong>&ldquo;No Rows To Show.&rdquo;</strong></p>\n"
          }
        ]
      }
