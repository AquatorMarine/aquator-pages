    <script id="kb" type="application/json">
      {
        "modules": [
          {
            "id": "welcome",
            "name": "Welcome to Aquator",
            "icon": "rocket",
            "body": "\n<p class=\"lead\">Aquator Marine is an all-in-one platform for running a yacht or a whole fleet &mdash; from accounts, crew and maintenance to safety, charters and documents, in one place. This guide walks you through your first steps, from choosing how to start through to opening your first module.</p>\n\n<h2 id=\"what\">What you can do with Aquator</h2>\n<p>The platform is organised into modules, each with its own guide. The main groups you&rsquo;ll see in the sidebar are:</p>\n<ul class=\"bul\">\n<li><strong>Company</strong> &mdash; your dashboard and company profile.</li>\n<li><strong>Fleet</strong> &mdash; yachts, AIS Tracker and SMS.</li>\n<li><strong>Operations</strong> &mdash; Management, Smart Documents, Shipyard ERP, Team, Accounting, File Manager, Reports and Integrations.</li>\n<li><strong>Admin Console</strong> &mdash; Company, Yacht, Users and Billing settings.</li>\n</ul>\n\n<h2 id=\"who\">Who it&rsquo;s for</h2>\n<p>Aquator is built for everyone involved in running a vessel &mdash; owners and family offices who need oversight, yacht and fleet managers, captains and heads of department who run day-to-day operations, shipyards handling refits and builds, and crew who log work and check in. What each person can see and do is controlled by their <strong>role</strong> (see <strong>Add your team</strong>).</p>\n\n<h2 id=\"two-ways\">Two ways to get started</h2>\n<p>How you begin depends on the size of your operation:</p>\n<table class=\"ftab\"><thead><tr><th>If you are&hellip;</th><th>How to start</th></tr></thead><tbody>\n<tr><td class=\"t-name\">A single yacht or superyacht</td><td>Sign up online and start a <strong>14-day free trial</strong> &mdash; see <strong>Create your account</strong>.</td></tr>\n<tr><td class=\"t-name\">A fleet, management company, shipyard or family office</td><td><strong>Book a demo</strong> and our team builds a plan around the modules you need &mdash; see <strong>Book a demo</strong>.</td></tr>\n</tbody></table>\n<div class=\"callout tip\"><div class=\"co-h\">Not sure which fits?</div><p>If you run more than one vessel, or need custom modules, integrations or onboarding support, the <strong>demo</strong> route is for you &mdash; Business (fleet) plans are priced by conversation, not off a fixed list. Single-vessel owners and captains can simply sign up and try Aquator free.</p></div>\n"
          },
          {
            "id": "account",
            "name": "Create your account",
            "icon": "id",
            "body": "\n<p class=\"lead\">For a single yacht or superyacht you can set everything up yourself: sign up, verify your email, add your details, and start a free trial. Your account is then reviewed by our team before you can log in.</p>\n<div class=\"callout note\"><div class=\"co-h\">Running a fleet?</div><p>Multi-vessel, management-company, shipyard and family-office (Business) plans aren&rsquo;t self-serve &mdash; head to <strong>Book a demo</strong> instead and we&rsquo;ll set you up.</p></div>\n\n<h2 id=\"signup\">Sign up</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Get Started</strong> page and click <strong>Continue</strong>.</li>\n<li><strong>Account</strong> &mdash; enter your name, email and password (or continue with Google / Apple), then click <strong>Continue</strong>.</li>\n<li><strong>Verify Email</strong> &mdash; type the 6-digit code we email you and click <strong>Verify</strong>. Use <strong>Resend</strong> if it doesn&rsquo;t arrive.</li>\n<li><strong>Profile</strong> &mdash; add your vessel, role and company details, then click <strong>Next</strong>.</li>\n<li><strong>Plan</strong> &mdash; choose <strong>Get Started Free</strong> for the free Starter plan, or <strong>Start 14-Day Free Trial</strong> for a paid plan.</li>\n</ol>\n\n<h2 id=\"approval\">Email verification &amp; approval</h2>\n<div class=\"callout note\"><div class=\"co-h\">Why you can&rsquo;t log in straight away</div><p>After sign-up you&rsquo;re taken to the <strong>Login</strong> page, but access is granted only after our admin team reviews and approves your account &mdash; <strong>typically within 24 hours</strong> on business days. You&rsquo;ll get a confirmation email once it&rsquo;s approved.</p></div>\n<p>If you haven&rsquo;t received an approval email after 24 hours, contact <a href=\"mailto:info@aquatormarine.com\">info@aquatormarine.com</a>.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How does the registration and approval process work?</summary><div class=\"faq-a\"><p>Once you complete registration, your account is submitted for verification. Our admin team reviews your details and approves your account, usually within 24 hours. You&rsquo;ll receive a confirmation email, and only then can you log in.</p></div></details>\n<details><summary>Why can&rsquo;t I log in after registering?</summary><div class=\"faq-a\"><p>Access is granted only after your account has been reviewed and approved. Allow up to 24 hours; if it&rsquo;s been longer, email <a href=\"mailto:info@aquatormarine.com\">info@aquatormarine.com</a>.</p></div></details>\n</div>\n<p class=\"muted\">More detail in the <a href=\"yacht-plans-subscription.html#registration\">Account &amp; Registration</a> guide.</p>\n"
          },
          {
            "id": "demo",
            "name": "Book a demo (fleet &amp; enterprise)",
            "icon": "phone",
            "body": "\n<p class=\"lead\">If you run a fleet or multiple vessels, a management company, a shipyard or a family office, you don&rsquo;t sign up online &mdash; you book a demo and we tailor a plan to the modules you actually need. Business plans are priced by conversation, not off a fixed list.</p>\n\n<h2 id=\"why\">Why fleet customers start with a demo</h2>\n<ul class=\"bul\">\n<li><strong>You choose the modules.</strong> Business plans are custom-quoted around your fleet size, the modules you want, and any integrations &mdash; with no per-vessel surprises.</li>\n<li><strong>You see it first.</strong> The demo is a personalised walkthrough tailored to your operation, showing the modules in action &mdash; crew, compliance, finance and more.</li>\n<li><strong>You get guided onboarding.</strong> Enterprise plans include a dedicated account manager, technical support, and help migrating your data and configuring the platform before go-live.</li>\n</ul>\n\n<h2 id=\"book\">Book your demo</h2>\n<ol class=\"steps\">\n<li>Go to <a href=\"https://aquatormarine.com/contact#book-demo\" target=\"_blank\" rel=\"noopener noreferrer\">aquatormarine.com</a> and click <strong>Book a demo</strong> (or <strong>Contact Sales</strong>).</li>\n<li>Tell us your <strong>Company Type</strong> &mdash; Yacht Owner, Fleet Manager, Shipyard, Charter Company, Brokerage, Captain, Crew or Other.</li>\n<li>Select your <strong>Number of Vessels</strong> &mdash; 1, 2&ndash;5, 6&ndash;20 or 20+.</li>\n<li>Pick your <strong>Primary Interest</strong> &mdash; Full Platform, a Specific Module, AI Solutions, Custom Development or Third-Party API Integrations.</li>\n<li>Submit. <strong>Our team will reach out within one business day</strong> to schedule your walkthrough.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Which Business plan?</div><p>Business plans come in three shapes: <strong>Fleet Management</strong> (yacht managers and charter operators), <strong>Refit &amp; Project</strong> (shipyards and refit operations) and <strong>Owner Oversight</strong> (family offices and private wealth). Your account manager helps you pick the right fit during the demo.</p></div>\n\n<h2 id=\"prefer-self\">Just one vessel?</h2>\n<p>If you only run a single yacht or superyacht, you don&rsquo;t need a demo &mdash; you can sign up and start a free trial straight away. See <strong>Create your account</strong>.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Can I just sign up for a fleet / Business plan online?</summary><div class=\"faq-a\"><p>No &mdash; fleet and Business plans are custom-built around your modules and vessel count, so they&rsquo;re arranged with our team. Book a demo and we&rsquo;ll quote and set up the right plan for you.</p></div></details>\n<details><summary>Do you offer a demo before I commit?</summary><div class=\"faq-a\"><p>Yes. Every fleet and enterprise enquiry starts with a personalised walkthrough of the platform, tailored to your operation. Request one at <a href=\"https://aquatormarine.com/contact#book-demo\" target=\"_blank\" rel=\"noopener noreferrer\">aquatormarine.com</a> and we&rsquo;ll be in touch within one business day.</p></div></details>\n<details><summary>How soon will someone contact me?</summary><div class=\"faq-a\"><p>Within <strong>one business day</strong> of submitting the demo form. For anything urgent, email <a href=\"mailto:info@aquatormarine.com\">info@aquatormarine.com</a>.</p></div></details>\n</div>\n"
          },
          {
            "id": "login",
            "name": "First login &amp; layout",
            "icon": "compass",
            "body": "\n<p class=\"lead\">Once your account is set up, log in and get your bearings. The sidebar is how you move around; the Applications launcher is how you jump between tools.</p>\n\n<h2 id=\"login\">Log in</h2>\n<ol class=\"steps\">\n<li>Open the <strong>Login</strong> page and enter the email and password you registered with (or use Google / Apple).</li>\n<li>Click <strong>Sign In</strong>. You&rsquo;ll land on your <strong>Dashboard</strong>.</li>\n</ol>\n\n<h2 id=\"sidebar\">The left sidebar</h2>\n<p>Everything is reached from the left sidebar, grouped into four areas:</p>\n<table class=\"ftab\"><thead><tr><th>Group</th><th>What&rsquo;s inside</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Company</td><td>Dashboard and Profile.</td></tr>\n<tr><td class=\"t-name\">Fleet</td><td>Yachts, AIS Tracker, SMS.</td></tr>\n<tr><td class=\"t-name\">Operations</td><td>Management, Smart Documents, Shipyard ERP, Team, Accounting, File Manager, Reports, Integrations.</td></tr>\n<tr><td class=\"t-name\">Admin Console</td><td>Company, Yacht, Users, Billing.</td></tr>\n</tbody></table>\n<div class=\"callout note\"><div class=\"co-h\">Don&rsquo;t see something?</div><p>What appears in your sidebar depends on your <strong>role</strong> and your <strong>plan</strong>. If a module is missing, your role may not have access to it, or it may not be part of your subscription &mdash; see <strong>Add your team</strong> and <strong>Plans &amp; billing</strong>.</p></div>\n\n<h2 id=\"apps\">The Applications launcher</h2>\n<p>From <strong>Home &rarr; Applications</strong> you can open individual tools directly (for example the <strong>In/Out Board</strong>). It&rsquo;s a quick way to jump to a specific app without hunting through the sidebar.</p>\n"
          },
          {
            "id": "yacht",
            "name": "Set up your yacht",
            "icon": "anchor",
            "body": "\n<p class=\"lead\">Before you start logging work and money against a vessel, add the yacht and set its primary currency. This only takes a few minutes and unlocks the rest of the platform.</p>\n\n<h2 id=\"add\">Add your yacht</h2>\n<ol class=\"steps\">\n<li>In the left sidebar, open <strong>Admin Console</strong>.</li>\n<li>Click <strong>Yacht</strong> and add the vessel&rsquo;s details (name, type, length and so on).</li>\n<li>Save. The yacht becomes available across the Fleet and Operations modules.</li>\n</ol>\n\n<h2 id=\"currency\">Set your primary currency</h2>\n<div class=\"callout warn\"><div class=\"co-h\">Do this early</div><p>You can&rsquo;t create accounting transactions until a <strong>Primary Currency</strong> is set for the yacht, and every report is shown in that currency. Set it now to avoid a &ldquo;Primary Currency Required&rdquo; message later.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Admin Console &rarr; Settings &rarr; Currencies</strong>.</li>\n<li>Choose your <strong>Primary Currency</strong> and save.</li>\n</ol>\n<p>Amounts entered in other currencies are converted to your primary currency using the FX rate.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>Why does it say &ldquo;Primary Currency Required&rdquo; when I add a transaction?</summary><div class=\"faq-a\"><p>No primary currency is configured yet. Go to <strong>Admin Console &rarr; Settings &rarr; Currencies</strong>, set one, then return to Accounting.</p></div></details>\n</div>\n"
          },
          {
            "id": "team",
            "name": "Add your team",
            "icon": "users",
            "body": "\n<p class=\"lead\">Give your colleagues access by creating roles, then inviting people and assigning each a role. Always create the role first &mdash; you can&rsquo;t invite someone without one.</p>\n\n<h2 id=\"roles\">1. Create a role</h2>\n<div class=\"callout warn\"><div class=\"co-h\">Roles are account-scoped</div><p>Each role belongs to a single <strong>Account</strong>. A role created under one account won&rsquo;t appear under another &mdash; if a user&rsquo;s access looks wrong, the role was often created under the wrong account.</p></div>\n<ol class=\"steps\">\n<li>Go to <strong>Admin Console &rarr; Users &rarr; Roles</strong> and click <strong>Add Role</strong>.</li>\n<li>Enter a <strong>Role Name</strong> and choose the <strong>Account</strong>.</li>\n<li>Set permissions with the <strong>View / Edit / Delete</strong> toggles for each area, then click <strong>Save</strong>.</li>\n</ol>\n\n<h2 id=\"invite\">2. Invite a user</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Admin Console &rarr; Users &rarr; Invite User</strong>.</li>\n<li>Fill in <strong>First Name, Last Name</strong> and <strong>Email</strong>.</li>\n<li>Choose a <strong>Role</strong> from the dropdown (only existing roles appear).</li>\n<li>Turn on <strong>Send Email</strong> and click <strong>Add</strong>. You can queue several people, then send all invitations together.</li>\n</ol>\n<p>Invited people then appear on the <strong>Users</strong> tab, where you can change roles and status inline.</p>\n<p class=\"muted\">Full detail in the <a href=\"user-management.html\">User Management</a> guide.</p>\n"
          },
          {
            "id": "plan",
            "name": "Plans &amp; billing",
            "icon": "cash",
            "body": "\n<p class=\"lead\">Aquator has plans for every size of operation. Single-vessel plans are self-serve with a free trial; fleet plans are arranged with our team.</p>\n\n<h2 id=\"families\">The plan families</h2>\n<ul class=\"bul\">\n<li><strong>Yacht Plans</strong> &mdash; for yachts under 50m: Starter (free), Essential, Advanced and Pro. Sign up online.</li>\n<li><strong>Superyacht Plans</strong> &mdash; for larger vessels (24m and above): Alpha through Foxtrot, priced per vessel by length. Sign up online (the largest, Foxtrot, is custom-quoted &mdash; contact sales).</li>\n<li><strong>Business Plans</strong> &mdash; for fleets, management companies, shipyards and family offices: custom-quoted around your modules and vessel count. <strong>Book a demo / Get in touch</strong> (see <strong>Book a demo</strong>).</li>\n</ul>\n\n<h2 id=\"trial\">Start your free trial</h2>\n<p>On self-serve plans, click <strong>Start 14-Day Free Trial</strong> at sign-up (or on a plan card in Billing) and confirm. You get full access to your plan&rsquo;s features for 14 days &mdash; no credit card required &mdash; and you&rsquo;re never charged automatically.</p>\n\n<h2 id=\"subscribe\">Subscribe to a plan</h2>\n<ol class=\"steps\">\n<li>In the left sidebar, open <strong>Admin Console &rarr; Billing</strong> (the <strong>Subscription</strong> tab).</li>\n<li>Click your plan to open its details, review what&rsquo;s included, then click <strong>Proceed to Checkout</strong>.</li>\n<li>Choose a saved card or add a payment method, then click <strong>Subscribe</strong>. For custom-priced (Business / fleet) plans you&rsquo;ll see <strong>Get in touch</strong> instead &mdash; that routes you to our team.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Billing has three tabs: <strong>Subscription</strong> (your plan, payment methods and cancellation), <strong>History</strong> (a timeline of changes) and <strong>Invoices</strong> (downloadable PDFs).</p></div>\n<p class=\"muted\">For billing cycles and managing add-ons, see the <a href=\"yacht-plans-subscription.html\">Yacht Plans &amp; Subscription</a> guide.</p>\n"
          },
          {
            "id": "explore",
            "name": "Explore the modules",
            "icon": "help",
            "body": "\n<p class=\"lead\">With your account, yacht and team set up, you&rsquo;re ready to dive into the tools. Each module has its own step-by-step guide &mdash; here&rsquo;s where to go next.</p>\n\n<h2 id=\"guides\">Module guides</h2>\n<table class=\"ftab\"><thead><tr><th>Module</th><th>What it&rsquo;s for</th></tr></thead><tbody>\n<tr><td class=\"t-name\"><a href=\"accounting.html\">Accounting</a></td><td>Budgets, categories, budget vs actual, and transactions.</td></tr>\n<tr><td class=\"t-name\"><a href=\"crew-management.html\">Crew Management</a></td><td>Personal info, employment &amp; SEA, and payroll.</td></tr>\n<tr><td class=\"t-name\"><a href=\"pms.html\">PMS</a></td><td>Planned maintenance: logs, tasks, purchase orders, equipment, inventory.</td></tr>\n<tr><td class=\"t-name\"><a href=\"technical-management.html\">Technical Management</a></td><td>Track defects and compliance items as work orders, pinned to the GA drawings.</td></tr>\n<tr><td class=\"t-name\"><a href=\"yacht-management.html\">Yacht Management</a></td><td>Manage vessel data and day-to-day operations.</td></tr>\n<tr><td class=\"t-name\"><a href=\"in-out-board.html\">In/Out Board</a></td><td>Track who is on or off the yacht.</td></tr>\n<tr><td class=\"t-name\"><a href=\"ais-tracker.html\">AIS Tracker</a></td><td>Live vessel positions and tracking.</td></tr>\n<tr><td class=\"t-name\"><a href=\"ism.html\">ISM</a> / <a href=\"sms.html\">SMS</a></td><td>Safety management and compliance.</td></tr>\n<tr><td class=\"t-name\"><a href=\"charter.html\">Charter</a></td><td>Manage charters end to end.</td></tr>\n<tr><td class=\"t-name\"><a href=\"smart-documents.html\">Smart Documents</a> / <a href=\"file-manager.html\">File Manager</a></td><td>Create, store and manage documents and files.</td></tr>\n<tr><td class=\"t-name\"><a href=\"warranty.html\">Warranty</a> / <a href=\"refits.html\">Refits</a> / <a href=\"new-builds.html\">New Builds</a> / <a href=\"shipyard.html\">Shipyard</a></td><td>Track defects, refit and build projects, and shipyard work.</td></tr>\n<tr><td class=\"t-name\"><a href=\"user-management.html\">User Management</a></td><td>Roles, permissions and user records.</td></tr>\n</tbody></table>\n\n<h2 id=\"help\">Still need a hand?</h2>\n<p>Use the search box on the <a href=\"home.html\">Help Center home</a> to find any topic fast, or email <a href=\"mailto:info@aquatormarine.com\">info@aquatormarine.com</a> and our team will help.</p>\n"
          }
        ]
      }
    </script>
