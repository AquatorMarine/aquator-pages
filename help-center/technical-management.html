<script id="kb" type="application/json">{"modules": [{"id": "overview", "name": "Introduction", "icon": "compass", "body": "\n<p class=\"lead\">Technical Management is where a defect, job or observation on the vessel becomes a <strong>tracked work item</strong> &mdash; and where you pin it to the exact spot on the yacht&rsquo;s <strong>General Arrangement (GA) drawings</strong>.</p>\n\n<h2 id=\"inside\">What&rsquo;s inside</h2>\n<p>Two linked areas, both under <strong>Technical Management</strong> in the sidebar:</p>\n<ul class=\"bul\">\n<li><strong>Work List</strong> &mdash; every defect, compliance item and redline as a trackable work item, with status, priority, deck and dates.</li>\n<li><strong>Editor</strong> &mdash; the yacht&rsquo;s GA (General Arrangement) drawings, with pins and mark-ups linked back to those work items.</li>\n</ul>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>A <strong>Technical Dashboard</strong> also lives under Technical Management, giving an at-a-glance summary of open items &mdash; this guide covers Work List and the Editor.</p></div>\n\n<h2 id=\"connect\">How the areas connect</h2>\n<ul class=\"bul\">\n<li>Dropping a <strong>pin</strong> in the Editor <strong>creates a Work List item</strong> tied to that deck and location.</li>\n<li>A work item&rsquo;s <strong>Layer</strong> (Defects, Maintenance, Equipment, Compliance, Redlines) sets which coloured layer it lives on in the drawing.</li>\n<li>Hiding a layer in the Editor hides its pins; a pin&rsquo;s <strong>status and priority</strong> stay in step with the Work List row, either way you edit them.</li>\n</ul>\n\n<h2 id=\"shared\">The same on every screen</h2>\n<ul class=\"bul\">\n<li>Top-right controls: <strong>Filters</strong>, view toggle (<strong>List / Board / Gantt Chart / Calendar</strong>), <strong>Search</strong>, <strong>Export</strong> and <strong>Add</strong>.</li>\n<li>Each row&rsquo;s <strong>Actions</strong> (three-dot) menu: <strong>View</strong>, <strong>Edit</strong>, <strong>Delete</strong> &mdash; Delete is hidden once an item reaches a final status (Completed / Cancelled).</li>\n<li>Selecting rows with the checkbox opens a bulk bar to <strong>Mark In Progress</strong>, <strong>Mark Completed</strong> or <strong>Defer</strong> several items at once.</li>\n</ul>\n<div class=\"callout warn\"><div class=\"co-h\">Different from other modules</div><p>Unlike PMS, ISM and most other modules, the Work List&rsquo;s Add/Edit form does <strong>not</strong> accept file attachments &mdash; there&rsquo;s no drag-and-drop upload on the item form itself. Drawings are uploaded separately, in the <strong>Editor &rarr; Manage Images</strong>.</p></div>\n\n<h2 id=\"access\">Access &amp; what you can see</h2>\n<ul class=\"bul\">\n<li>Access is granted per area as <strong>view</strong>, <strong>edit</strong> or <strong>delete</strong>. On a row&rsquo;s Actions menu, <strong>Edit</strong> and <strong>Delete</strong> grey out without that level.</li>\n<li>Without full access to the Work List, you only see items <strong>assigned to you</strong> &mdash; not the whole register.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>What&rsquo;s the difference between a Type and a Layer?</summary><div class=\"faq-a\"><p><strong>Type</strong> classifies the work (Defect, Maintenance, Equipment, Compliance, Redline). <strong>Layer</strong> is the drawing layer it sits on in the Editor (Defects, Maintenance, Equipment, Compliance, Redlines) and drives its pin colour. They&rsquo;re set independently on the same form.</p></div></details>\n<details><summary>Do pins and work items stay in sync?</summary><div class=\"faq-a\"><p>Yes &mdash; a pin <em>is</em> a work item shown on a drawing. Edit it from either side and the change is reflected in the other; delete the item and its pin goes with it.</p></div></details>\n</div>\n"}, {"id": "worklist", "name": "Work List", "icon": "clipboard", "body": "\n<p class=\"lead\">The <strong>Work List</strong> is the register of every technical work item on the vessel &mdash; defects, maintenance, compliance items and redlines &mdash; each with a status, priority, deck and dates.</p>\n<p class=\"crumbline\">Where to find it: <strong>Technical Management &rarr; Work List</strong>.</p>\n\n<h2 id=\"before\">Before you start</h2>\n<p>Decks and layers come from the vessel&rsquo;s GA drawings in the <strong>Editor</strong>. A work item can reference a deck once at least one drawing exists &mdash; but you can log an item without one and pin it later from the Editor.</p>\n\n<h2 id=\"add\">Add a work item</h2>\n<ol class=\"steps\">\n<li>Go to <strong>Technical Management &rarr; Work List</strong> and click <strong>Add</strong> (top right).</li>\n<li>In the <strong>Add Work List</strong> form, enter a <strong>Title</strong> (required, up to 100 characters) and, optionally, a <strong>Description</strong>.</li>\n<li>Choose the <strong>Type</strong> (Defect, Maintenance, Equipment, Compliance, Redline) and <strong>Layer</strong> (Defects, Maintenance, Equipment, Compliance, Redlines).</li>\n<li>Set the <strong>Priority</strong> (Critical, High, Medium, Low) and <strong>Status</strong> (Draft, Open, In&nbsp;Progress, Pending&nbsp;Parts, Pending&nbsp;Inspection, Completed, Deferred, Cancelled).</li>\n<li>(Optional) set <strong>Assigned to</strong>, <strong>How found</strong> (Routine Inspection, Owner Report, Surveyor, Class, Crew Report), <strong>Category</strong>, <strong>Date reported</strong>, <strong>Due date</strong>, <strong>Est. parts cost</strong> / <strong>Est. labour cost</strong>, <strong>Zone / Area</strong>, and the <strong>Safety risk</strong> / <strong>Class related</strong> checkboxes.</li>\n<li>Click <strong>Create Item</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The item opens on its own page with <strong>Details</strong>, <strong>History</strong> and <strong>Comments</strong> tabs, and appears at the top of the Work List. The History tab logs who created it and when.</p></div>\n<div class=\"callout warn\"><div class=\"co-h\">No attachments here</div><p>The Add/Edit form has no file-upload field. To attach a drawing to an item, place or open its pin in the <strong>Editor</strong> instead.</p></div>\n\n<h2 id=\"status\">Change status or priority inline</h2>\n<ol class=\"steps\">\n<li>In the list, click the <strong>Status</strong> or <strong>Priority</strong> chevron on a row.</li>\n<li>Pick a new value from the drop-down.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The change saves immediately &mdash; no need to open the item &mdash; and holds after a refresh.</p></div>\n\n<h2 id=\"bulk\">Bulk actions</h2>\n<p>Tick the checkbox on one or more rows and a bar appears above the list showing <strong>&ldquo;{n} selected&rdquo;</strong> with:</p>\n<ul class=\"bul\">\n<li><strong>Mark In Progress</strong> &mdash; sets every selected item&rsquo;s status to In Progress.</li>\n<li><strong>Mark Completed</strong> &mdash; sets every selected item&rsquo;s status to Completed.</li>\n<li><strong>Defer</strong> &mdash; sets every selected item&rsquo;s status to Deferred.</li>\n<li><strong>Clear</strong> &mdash; deselects all rows without changing anything.</li>\n</ul>\n\n<h2 id=\"edit\">Edit or delete an item</h2>\n<ol class=\"steps\">\n<li>On a row, open <strong>Actions</strong> (three-dot) &rarr; <strong>Edit</strong> to change any field, then <strong>Save Changes</strong>.</li>\n<li>Or choose <strong>Delete</strong> and confirm on the <strong>Delete item</strong> dialog.</li>\n</ol>\n<div class=\"callout warn\"><div class=\"co-h\">Heads up</div><p><strong>Delete is permanent</strong> &mdash; the confirmation reads &ldquo;Delete &lsquo;{title}&rsquo;? This cannot be undone.&rdquo; Delete is also hidden on items that are already Completed or Cancelled.</p></div>\n\n<h2 id=\"views\">Switch views</h2>\n<p>Use the <strong>view toggle</strong> (top-right) to see the same items as a:</p>\n<ul class=\"bul\">\n<li><strong>List</strong> &mdash; the full grid with sortable, hide-able columns.</li>\n<li><strong>Board</strong> &mdash; a kanban grouped by status (Open, In&nbsp;Progress, Pending Parts, Pending Inspection, Completed, Deferred).</li>\n<li><strong>Gantt Chart</strong> &mdash; items across a timeline.</li>\n<li><strong>Calendar</strong> &mdash; items by date.</li>\n</ul>\n\n<h2 id=\"filter\">Find, filter &amp; export</h2>\n<ul class=\"bul\">\n<li><strong>Search</strong> by title from the top bar.</li>\n<li><strong>Filters</strong> by Status, Priority, Type, Layer, Assigned&nbsp;To, Category, Tags, <strong>Has GA Pin</strong>, Recurring, Due&nbsp;Date and Date&nbsp;Reported &mdash; combine several, then <strong>Clear All</strong> to reset.</li>\n<li><strong>Save View</strong> keeps a filtered/sorted set as an <em>Active View</em> you can return to.</li>\n<li><strong>Export</strong> &rarr; <strong>Work List Report</strong> &rarr; <strong>Choose Report Columns</strong> lets you pick which columns to include, then export as <strong>PDF</strong> or <strong>Excel</strong>.</li>\n</ul>\n\n<h2 id=\"comments\">Comments &amp; history</h2>\n<p>On any item, use the <strong>Comments</strong> tab (type a note, click <strong>Post</strong>) to discuss it with the crew, and the <strong>History</strong> tab for a time-stamped audit trail of changes. Each shows &ldquo;No comments yet&rdquo; / &ldquo;No history yet&rdquo; until there&rsquo;s something to show.</p>\n\n<h2 id=\"trouble\">Troubleshooting &amp; FAQs</h2>\n<ul class=\"bul\">\n<li><strong>A row shows a pin icon</strong> &mdash; hover it (&ldquo;View on Editor&rdquo;) or click it to jump straight to that pin on the GA drawing.</li>\n<li><strong>List says &ldquo;No Rows To Show&rdquo;</strong> &mdash; the list loads against the active view/filters; clear filters or reload.</li>\n</ul>\n<div class=\"faq\">\n<details><summary>Can I hide or reorder columns?</summary><div class=\"faq-a\"><p>Yes &mdash; open a column&rsquo;s three-dot menu and use <strong>Hide column</strong>, <strong>Pin to left / right</strong> or <strong>Manage columns</strong> to toggle any column back on.</p></div></details>\n<details><summary>How do I filter to only pinned items?</summary><div class=\"faq-a\"><p>Open <strong>Filters</strong> and switch on <strong>Has GA Pin</strong>.</p></div></details>\n</div>\n"}, {"id": "editor", "name": "Editor", "icon": "layers", "body": "\n<p class=\"lead\">The <strong>Editor</strong> holds the yacht&rsquo;s General Arrangement (GA) drawings. Upload a deck plan, <strong>drop pins that become work items</strong>, and mark it up with shapes, text and coloured layers.</p>\n<p class=\"crumbline\">Where to find it: <strong>Technical Management &rarr; Editor</strong>.</p>\n\n<h2 id=\"before\">Before you start</h2>\n<p>Each <strong>deck</strong> is a drawing you upload. You can keep several <strong>versions</strong> per deck and choose which one is active &mdash; so a redrawn plan never loses the pins placed on it.</p>\n\n<h2 id=\"upload\">Add a deck &amp; upload a drawing</h2>\n<ol class=\"steps\">\n<li>Click <strong>Manage Images</strong> (top right) &mdash; this opens the <strong>Image Management</strong> window.</li>\n<li>Type a deck name and click <strong>Add Deck</strong> (or pick an existing deck).</li>\n<li><strong>Drag &amp; drop</strong> a file into the deck&rsquo;s upload area, or click <strong>browse</strong> &mdash; one file per upload (PNG, JPG, PDF, DOC, XLS &mdash; max 100&nbsp;MB).</li>\n<li>Click <strong>Done</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The drawing renders as the active version and gets a deck tab at the top of the editor. On an inactive version, <strong>Set active</strong> switches to it; the upload label reads <strong>&ldquo;Upload new version (replaces active drawing)&rdquo;</strong> once a deck has an active drawing, or <strong>&ldquo;Upload drawing&rdquo;</strong> when it doesn&rsquo;t &mdash; either way the version history is kept.</p></div>\n\n<h2 id=\"pin\">Drop a pin (create a work item)</h2>\n<ol class=\"steps\">\n<li>Select the <strong>pin tool</strong> from the toolbar (tooltip: &ldquo;Place pin (new item)&rdquo;).</li>\n<li>Click the exact spot on the drawing.</li>\n<li>Fill the <strong>Add Work List</strong> form (Title, Type, Layer, Priority&hellip;).</li>\n<li>Click <strong>Create Item</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>A coloured pin appears at that point, the item is added to the <strong>Work List</strong> against this deck, and it&rsquo;s listed in the <strong>Annotations</strong> panel. Click the pin any time to open and edit the item (<strong>Save Changes</strong>).</p></div>\n\n<h2 id=\"markup\">Mark up the drawing</h2>\n<ul class=\"bul\">\n<li>Toolbar tools: <strong>Select / move</strong>, <strong>Pan</strong>, <strong>Pin</strong>, then <strong>Line</strong>, <strong>Arrow</strong>, <strong>Rectangle</strong>, <strong>Ellipse</strong>, <strong>Text label</strong> and <strong>Freehand</strong> to annotate, plus an <strong>Eraser</strong> to remove an annotation.</li>\n<li>Pick a colour from the <strong>palette</strong> (or a <strong>Custom colour</strong>) before you draw.</li>\n<li><strong>Undo</strong> (Ctrl+Z) / <strong>Redo</strong> (Ctrl+Y) step back and forward through mark-up changes.</li>\n<li>The status bar along the bottom shows zoom %, cursor coordinates, the active layer, and toggles for <strong>Grid</strong> and <strong>Snap</strong> (25px).</li>\n</ul>\n\n<h2 id=\"layers\">Work with layers</h2>\n<ul class=\"bul\">\n<li>The <strong>Layers</strong> panel &mdash; Defects, Maintenance, Equipment, Compliance, Redlines &mdash; shows a live item count (and a critical count) per layer.</li>\n<li>The <strong>eye</strong> icon toggles a layer&rsquo;s visibility on the drawing; the <strong>lock</strong> icon blocks pins and annotations on that layer from being moved or edited.</li>\n<li>The <strong>Annotations</strong> panel lists every pin, with a search box (&ldquo;Search title, ID, tags&hellip;&rdquo;) and status filter chips; use the collapse arrow to hide it and reclaim canvas space.</li>\n</ul>\n\n<h2 id=\"trouble\">Troubleshooting &amp; FAQs</h2>\n<ul class=\"bul\">\n<li><strong>My pin isn&rsquo;t showing</strong> &mdash; its layer may be hidden or locked; re-enable the layer&rsquo;s eye in the Layers panel.</li>\n<li><strong>Wrong deck open</strong> &mdash; the editor opens on the first deck; use the deck tabs to switch.</li>\n</ul>\n<div class=\"faq\">\n<details><summary>How do I edit a pinned item?</summary><div class=\"faq-a\"><p>Click the pin on the drawing to open its edit form, change any field, then <strong>Save Changes</strong>. You can also open it from the Work List &mdash; the row&rsquo;s pin icon links straight to it on the drawing.</p></div></details>\n<details><summary>What file types can I upload for a deck?</summary><div class=\"faq-a\"><p>PNG, JPG, PDF, DOC or XLS, up to <strong>100&nbsp;MB</strong> &mdash; one file per upload.</p></div></details>\n</div>\n"}]}</script>
