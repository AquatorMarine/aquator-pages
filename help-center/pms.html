<script id="kb" type="application/json">{"modules": [{"id": "overview", "name": "Introduction", "icon": "compass", "body": "\n<p class=\"lead\">PMS (Planned Maintenance System) keeps your equipment healthy &mdash; it ties together meter readings, scheduled and triggered maintenance, parts stock and purchasing.</p>\n\n<h2 id=\"inside\">What&rsquo;s inside</h2>\n<p>Five linked areas, each under <strong>PMS</strong>:</p>\n<ul class=\"bul\">\n<li><strong>Logs</strong> &mdash; meter readings (running hours, RPM, temperature&hellip;).</li>\n<li><strong>Tasks</strong> &mdash; the work to be done, one-off or recurring.</li>\n<li><strong>Purchase Orders</strong> &mdash; buying parts from suppliers.</li>\n<li><strong>Equipment</strong> &mdash; the assets you maintain.</li>\n<li><strong>Inventory</strong> &mdash; parts and spares in stock.</li>\n</ul>\n\n<h2 id=\"connect\">How the areas connect</h2>\n<ul class=\"bul\">\n<li>Log readings can <strong>auto-create Tasks</strong> (via triggers) and drive <strong>Usage-based</strong> task scheduling.</li>\n<li><strong>Purchase Orders restock Inventory</strong> when you fulfill them; <strong>completing a Task</strong> with parts draws stock back down.</li>\n<li><strong>Equipment</strong> links its Logs, Storage and Suppliers in one place.</li>\n</ul>\n\n<h2 id=\"shared\">The same on every screen</h2>\n<ul class=\"bul\">\n<li>Top-right controls: <strong>Filters</strong>, two view toggles, <strong>Search</strong>, <strong>Export</strong> and <strong>Add</strong>.</li>\n<li>Each row&rsquo;s <strong>Actions</strong> (three-dot) menu: <strong>View</strong>, <strong>Edit</strong>, <strong>Delete</strong>.</li>\n<li>Add/Edit forms accept <strong>Images / Files</strong> by drag &amp; drop (PNG, JPG, PDF, DOC, XLS &mdash; max 100 MB).</li>\n</ul>\n\n<h2 id=\"access\">Access &amp; what you can see</h2>\n<ul class=\"bul\">\n<li>Access is granted per area as <strong>view</strong>, <strong>edit</strong> or <strong>delete</strong>. If <strong>Add</strong>, <strong>Edit</strong> or an action looks greyed out, you don&rsquo;t have that level.</li>\n<li>Without full access to <strong>Tasks</strong>, you only see tasks <strong>assigned to you</strong> &mdash; not the whole list.</li>\n</ul>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I export a PMS list?</summary><div class=\"faq-a\"><p>On any PMS list page, click <strong>Export</strong>. The dropdown offers the relevant report (e.g. &ldquo;Inventory Report&rdquo;) with a <strong>PDF</strong> icon and an <strong>Excel</strong>/spreadsheet icon &mdash; pick the format you need.</p></div></details>\n<details><summary>How do I generate a QR or barcode?</summary><div class=\"faq-a\"><p>On the Add/Edit form for <strong>Equipment</strong> or <strong>Inventory</strong>, type your own value into the <strong>QR code</strong> / <strong>Bar code</strong> field, or click <strong>Generate Code</strong> beneath it. The rendered QR image then appears on the item&rsquo;s View page.</p></div></details>\n</div>\n"}, {"id": "logs", "name": "Logs", "icon": "gauge", "body": "\n<p class=\"lead\">Logs are your meter reading points &mdash; running hours, RPM, temperature, cycles. Record readings here, and let them drive maintenance automatically.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> PMS &rarr; Logs.</p>\n\n<h2 id=\"before\">Before you start</h2>\n<p>The <strong>Equipment</strong> a log attaches to must exist (you pick it on the form). Create it under <strong>PMS &rarr; Equipment</strong> first if it&rsquo;s missing.</p>\n\n<h2 id=\"add\">Add a log (reading meter)</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Logs</strong> and click <strong>Add</strong>.</li>\n<li>Enter the <strong>ID</strong> and <strong>Name</strong>.</li>\n<li>Choose a <strong>Measurement Unit</strong> (e.g. Hours, RPM, Cycles, Celsius, Liters).</li>\n<li>(Optional) add a <strong>Description</strong>.</li>\n<li>Set the <strong>Reading Frequency</strong> &mdash; None, Hour, Day, Week, Month or Year. This is how often a reading is <em>expected</em>, not a maintenance schedule, and it doesn&rsquo;t send reminders.</li>\n<li>Select the <strong>Equipment</strong> this log belongs to. (Optional) attach files.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The log appears with its Name, ID, Unit, Equipment, Frequency and Last Reading. New logs show no reading until you record one.</p></div>\n\n<h2 id=\"record\">Record a reading</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Logs</strong> and open the log (Actions &rarr; <strong>View</strong>, or click the row).</li>\n<li>On the <strong>Details</strong> tab, click <strong>Record Reading</strong>.</li>\n<li>Enter the value under <strong>Submit New Log Reading</strong>. (Optional) attach files.</li>\n<li>Click <strong>Confirm Reading</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The <strong>Last Reading Value</strong> updates on Details and in the list, and the entry is saved to the <strong>Reading History</strong> tab. If a Task Trigger&rsquo;s condition is now met, a <strong>Task is generated automatically</strong>.</p></div>\n\n<h2 id=\"trigger\">Set up a task trigger</h2>\n<ol class=\"steps\">\n<li>Open the log &rarr; <strong>View</strong>.</li>\n<li>Under <strong>Task Triggers</strong>, click <strong>New Task Trigger</strong>.</li>\n<li>In <strong>When Log Reading</strong>, choose the condition: is above, is below, is equal to, is increases by, or is decreases by.</li>\n<li>Enter the <strong>Value</strong> (threshold or change amount).</li>\n<li>Fill the task template that fires: ID, Title, Assign To, Priority, Storage, Categories, Suppliers, Equipment, Description. (Optional) Add Part and attach files.</li>\n<li>Click <strong>Save</strong>.</li>\n</ol>\n\n<h2 id=\"triggers-concept\">How task triggers work</h2>\n<p>A trigger lives on a log and generates a Task when a reading meets its condition. The conditions come in two families:</p>\n<table class=\"ftab\"><thead><tr><th>Condition</th><th>Compares against</th><th>Use it for</th></tr></thead><tbody>\n<tr><td class=\"t-name\">is above / is below / is equal to</td><td>a <strong>fixed Value</strong></td><td>thresholds &mdash; &ldquo;inspect when oil temp <strong>is above</strong> 90&deg;C&rdquo;</td></tr>\n<tr><td class=\"t-name\">is increases by / is decreases by</td><td>the <strong>change since the last reading</strong></td><td>usage intervals &mdash; &ldquo;service each time hours <strong>increase by</strong> 250&rdquo;</td></tr>\n</tbody></table>\n<p>When a trigger fires, the Task is built from the template you defined (Title, Assign To, Priority, Equipment, Parts&hellip;), so it lands in Tasks already populated.</p>\n\n<h2 id=\"trouble\">Troubleshooting &amp; FAQs</h2>\n<ul class=\"bul\">\n<li><strong>Equipment dropdown is empty</strong> &mdash; no equipment exists yet; add it under PMS &rarr; Equipment first.</li>\n<li><strong>Frequency shows &ldquo;None&rdquo;</strong> &mdash; that&rsquo;s the default; the log won&rsquo;t prompt for readings on a schedule until you change it.</li>\n<li><strong>I corrected a reading but nothing changed</strong> &mdash; editing or deleting a reading doesn&rsquo;t re-fire triggers or recompute usage-based tasks. Triggers only evaluate when a <em>new</em> reading is recorded.</li>\n</ul>\n<div class=\"faq\">\n<details><summary>Why didn&rsquo;t my log reading create a task?</summary><div class=\"faq-a\"><p>A task is only generated if the log has a <strong>Task Trigger</strong> and the new reading satisfies its condition. Open the log &rarr; View &rarr; <strong>Task Triggers</strong> to confirm one exists and that your value crosses its threshold (or change amount). No trigger means no automatic task.</p></div></details>\n</div>\n"}, {"id": "tasks", "name": "Tasks", "icon": "clipboard", "body": "\n<p class=\"lead\">Tasks are the work to be done &mdash; inspections, services, jobs. They can be one-off or recurring, assigned, prioritized, and linked to equipment and parts.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> PMS &rarr; Tasks.</p>\n\n<h2 id=\"create\">Create a task</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Tasks</strong> and click <strong>Add</strong>.</li>\n<li>Enter <strong>ID</strong> and <strong>Title</strong>.</li>\n<li>Set <strong>Job Category</strong>, <strong>Job Type</strong> and <strong>Department</strong>.</li>\n<li>Add a <strong>Description</strong>, and optionally break the work down with <strong>Add Sub Task</strong>.</li>\n<li>Set <strong>Assign To</strong> and <strong>Priority</strong>.</li>\n<li>Link <strong>Equipment</strong>, <strong>Suppliers</strong>, <strong>Categories</strong> and <strong>Storage &rarr; Primary</strong> as needed.</li>\n<li>Set a <strong>Due Date</strong> (date + time).</li>\n<li>Choose a <strong>Frequency</strong>: One Off, Time, Usage, or Time &amp; Usage.</li>\n<li>(Optional) Add Part and attach files. Click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The task appears with its status (defaulting to <strong>Open</strong>), Priority, Assignee, Due Date and Frequency.</p></div>\n\n<h2 id=\"frequency\">How task frequency works</h2>\n<table class=\"ftab\"><thead><tr><th>Frequency</th><th>How it recurs</th></tr></thead><tbody>\n<tr><td class=\"t-name\">One Off</td><td>A single task, no repetition.</td></tr>\n<tr><td class=\"t-name\">Time</td><td>Repeats on a calendar basis (due date + a time interval).</td></tr>\n<tr><td class=\"t-name\">Usage</td><td>Repeats based on equipment use measured through <strong>Log readings</strong> (e.g. running hours) &mdash; tied to a meter, not the calendar.</td></tr>\n<tr><td class=\"t-name\">Time &amp; Usage</td><td>Both &mdash; comes due whenever either interval is reached first (&ldquo;every 6 months or every 500 hours, whichever comes sooner&rdquo;).</td></tr>\n</tbody></table>\n<p>Choosing <strong>Usage</strong> or <strong>Time &amp; Usage</strong> is what links a task to the Logs system &mdash; the readings you record drive when the next instance becomes due.</p>\n\n<h2 id=\"status\">Update a task&rsquo;s status</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Tasks</strong>.</li>\n<li>In the <strong>Status</strong> column, click the status chevron on the task&rsquo;s row.</li>\n<li>Choose: <strong>Open</strong>, <strong>On Hold</strong>, <strong>In Progress</strong>, <strong>Completed</strong> or <strong>Postponed</strong> &mdash; it updates inline immediately.</li>\n</ol>\n\n<h2 id=\"complete\">What completing a task does</h2>\n<p>Marking a task <strong>Completed</strong> has two automatic effects beyond changing the status:</p>\n<ul class=\"bul\">\n<li><strong>Parts are drawn from Inventory.</strong> Any Parts on the task are deducted from stock when you complete it. Reopening the task (Completed &rarr; any other status) <strong>puts the parts back</strong>.</li>\n<li><strong>Recurring tasks spawn the next occurrence.</strong> For a Time, Usage or Time &amp; Usage task, completing it automatically creates the next instance in <strong>Tasks</strong> &mdash; that&rsquo;s when the next one appears.</li>\n</ul>\n<div class=\"callout note\"><div class=\"co-h\">Good to know</div><p>Stock isn&rsquo;t physically removed until completion, but an <strong>open</strong> task&rsquo;s parts already reduce each item&rsquo;s <strong>Available Quantity</strong> in Inventory &mdash; see <strong>Inventory</strong>.</p></div>\n\n<h2 id=\"events\">Events &mdash; group &amp; run tasks</h2>\n<p>An <strong>Event</strong> bundles multiple tasks (e.g. &ldquo;Charter preparation &mdash; 2 tasks&rdquo;) so they can be reused and applied together rather than created one by one.</p>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Tasks</strong> and click <strong>Events</strong> (top right).</li>\n<li>In the Events panel (&ldquo;All Events&rdquo;), click <strong>Create</strong> to make a new event, or use the row icons to <strong>run</strong> (play), <strong>edit</strong> or <strong>delete</strong> one.</li>\n</ol>\n\n<h2 id=\"trouble\">Troubleshooting</h2>\n<ul class=\"bul\">\n<li><strong>Tasks list says &ldquo;No Rows To Show&rdquo;</strong> &mdash; the list loads against the active view/filters; clear filters or reload, and existing tasks reappear.</li>\n<li><strong>I can only see some tasks</strong> &mdash; without full access to Tasks you only see tasks assigned to you.</li>\n</ul>\n"}, {"id": "purchase-orders", "name": "Purchase Orders", "icon": "cart", "body": "\n<p class=\"lead\">Purchase Orders track what you order from suppliers &mdash; and restock Inventory when the goods arrive.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> PMS &rarr; Purchase Orders.</p>\n\n<h2 id=\"before\">Before you start</h2>\n<p>The <strong>Supplier</strong> and any catalogued <strong>Items / Parts</strong> should exist so you can select them.</p>\n\n<h2 id=\"create\">Create a purchase order</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Purchase Orders</strong> and click <strong>Add</strong>.</li>\n<li>Enter the <strong>PO Title</strong>. The <strong>PO Number</strong> is auto-generated (e.g. PO-06-2026-0001); add a <strong>Reference</strong> if needed.</li>\n<li>Select the <strong>Supplier</strong>.</li>\n<li>For each line, set <strong>Item Name</strong>, <strong>Part Number</strong>, <strong>Quantity</strong> and <strong>Cost</strong> &mdash; the <strong>Amount</strong> calculates automatically. Use <strong>Add an item</strong> for more lines.</li>\n<li>(Optional) click <strong>Add taxes and cost</strong> to adjust the Subtotal/Total.</li>\n<li>Fill delivery details: Shipping Address, Consign To, Contact Name/Email/Phone, Billing Address (or tick <strong>Use the same Shipping and Billing Address</strong>), Start Date, Delivery Date, Delivery Instructions.</li>\n<li>(Optional) add a <strong>Note</strong> and <strong>Invoice Note</strong> (you can <strong>Set as default</strong>), and attach files. Click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The PO appears as <strong>Pending</strong>, with its Supplier, Delivery Date and Total.</p></div>\n\n<h2 id=\"lifecycle\">The purchase order lifecycle</h2>\n<p>A PO is <strong>status-driven</strong> &mdash; the button you see depends on where it is:</p>\n<table class=\"ftab\"><thead><tr><th>Status</th><th>What you can do</th></tr></thead><tbody>\n<tr><td class=\"t-name\">Pending</td><td><strong>Approve Purchase Order</strong> &mdash; it must be approved before it can be received.</td></tr>\n<tr><td class=\"t-name\">Approved</td><td><strong>Fulfill</strong> &mdash; record what arrived (see below).</td></tr>\n<tr><td class=\"t-name\">Partially Fulfilled</td><td><strong>Fulfill</strong> again, or mark <strong>Completed</strong>.</td></tr>\n<tr><td class=\"t-name\">Completed</td><td>Closed &mdash; it can no longer be edited.</td></tr>\n</tbody></table>\n<ul class=\"bul\">\n<li>You can&rsquo;t Fulfill a <strong>Pending</strong> PO &mdash; approve it first.</li>\n<li>Fulfilling sets the PO to <strong>Partially Fulfilled</strong> (even if everything arrived); you mark it <strong>Completed</strong> yourself when you&rsquo;re done &mdash; nothing forces you to receive the full quantity first.</li>\n<li>Once a line has been partially received its fields lock, and once the PO is <strong>Completed</strong> it can&rsquo;t be edited.</li>\n</ul>\n\n<h2 id=\"fulfill\">Fulfill (restock) a purchase order</h2>\n<ol class=\"steps\">\n<li>Open the PO &rarr; <strong>View</strong>.</li>\n<li>Click <strong>Fulfill</strong> (available once the PO is <strong>Approved</strong>).</li>\n<li>In the <strong>Restock Items</strong> dialog, enter <strong>Units Received</strong> for each item (the Price and Total update as you do).</li>\n<li>Click <strong>Confirm Restock</strong>.</li>\n</ol>\n\n<h2 id=\"restock-concept\">How purchase orders restock inventory</h2>\n<p>A PO records what you ordered (<strong>Units Ordered</strong>, <strong>Unit Cost</strong>). When goods arrive, <strong>Fulfill</strong> &rarr; enter <strong>Units Received</strong> per line &rarr; <strong>Confirm Restock</strong> does two things:</p>\n<ul class=\"bul\">\n<li>It <strong>records receipt against the PO</strong> &mdash; the detail then shows Units Received and Cost of Units Received alongside the ordered figures.</li>\n<li>It <strong>adds the received quantities into Inventory</strong> stock.</li>\n</ul>\n<p>Because receiving is entered per line, <strong>partial deliveries are supported</strong> &mdash; record only what actually arrived, and the PO reflects the shortfall.</p>\n\n<h2 id=\"trouble\">Troubleshooting &amp; FAQs</h2>\n<ul class=\"bul\">\n<li><strong>There&rsquo;s no Fulfill button</strong> &mdash; the PO is still <strong>Pending</strong>; approve it first.</li>\n<li><strong>Total shows $0.00</strong> &mdash; no line items have a Quantity and Cost yet, or taxes/costs haven&rsquo;t been added.</li>\n<li><strong>Received fewer than ordered</strong> &mdash; enter the actual quantity received; the PO records partial fulfillment rather than the full ordered amount.</li>\n</ul>\n<div class=\"faq\">\n<details><summary>Can I receive only part of a purchase order?</summary><div class=\"faq-a\"><p>Yes. Click <strong>Fulfill</strong> and enter the actual <strong>Units Received</strong> per line (less than Units Ordered is fine), then <strong>Confirm Restock</strong>. The PO records the received amount and inventory increases only by what arrived.</p></div></details>\n<details><summary>Does a purchase order show up in Accounting?</summary><div class=\"faq-a\"><p>No. PMS Purchase Orders aren&rsquo;t linked to the Accounting module &mdash; approving or fulfilling one doesn&rsquo;t create an expense or transaction there. They only update PMS <strong>Inventory</strong>.</p></div></details>\n</div>\n"}, {"id": "equipment", "name": "Equipment", "icon": "cog", "body": "\n<p class=\"lead\">Equipment is the register of assets you maintain &mdash; engines, pumps, generators &mdash; with identifiers, classification flags, and linked logs, parts and suppliers.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> PMS &rarr; Equipment.</p>\n\n<h2 id=\"add\">Add equipment</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Equipment</strong> and click <strong>Add</strong>.</li>\n<li>Enter <strong>ID</strong>, <strong>Name</strong>, <strong>Categories</strong> and a <strong>Description</strong>.</li>\n<li>Add identifiers: <strong>Serial Number</strong>, <strong>Model</strong>, <strong>Manufacturer</strong>, <strong>Year</strong>.</li>\n<li>Set a <strong>QR code</strong> and <strong>Bar code</strong> &mdash; type your own or click <strong>Generate Code</strong> beside each.</li>\n<li>Link <strong>Suppliers</strong> and <strong>Parts</strong>.</li>\n<li>(Optional) set <strong>Parent Equipment</strong> (to nest this asset under another), <strong>Class Equipment</strong>, <strong>Critical Equipment</strong> and <strong>Owners Critical</strong> flags.</li>\n<li>Set <strong>Storage &rarr; Primary</strong> and attach files. Click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The equipment appears in the list (Name, ID, Suppliers, Serial Number, Model, Class, Critical, Owners). Its <strong>View</strong> page shows linked Logs, the rendered QR code, Storage, Suppliers and a <strong>History</strong> tab.</p></div>\n\n<h2 id=\"flags\">How class &amp; critical flags work</h2>\n<p>Classification flags drive how an asset is treated, badged and filtered:</p>\n<ul class=\"bul\">\n<li><strong>Class vs Non-Class</strong> &mdash; whether the item is subject to classification-society oversight.</li>\n<li><strong>Critical vs Non-Critical</strong> &mdash; operational criticality for safety / propulsion.</li>\n<li><strong>Owners Critical vs Non-Owners Critical</strong> &mdash; items the owner has flagged as important.</li>\n</ul>\n<p>These appear as coloured badges and let you filter equipment and work orders. They&rsquo;re <strong>organisational only</strong> &mdash; they don&rsquo;t enforce any maintenance schedule or safety rule on their own. Equipment can also be <strong>nested</strong> via <strong>Parent Equipment</strong> (e.g. a pump under an engine). Each record links its Logs, Storage and Suppliers in one place, plus a History tab for its record over time.</p>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>How do I generate a QR or barcode for equipment?</summary><div class=\"faq-a\"><p>On the Add/Edit form, type your own value into the <strong>QR code</strong> / <strong>Bar code</strong> field, or click <strong>Generate Code</strong> beneath it. The rendered QR image is then visible on the item&rsquo;s View page.</p></div></details>\n<details><summary>Why can&rsquo;t I delete this equipment (or a part, category or storage location)?</summary><div class=\"faq-a\"><p>PMS blocks deleting anything still referenced by a task. If an item, category or storage location is used on any work order you&rsquo;ll see &ldquo;&hellip;because it has X workorders related.&rdquo; Remove it from those tasks first, then delete.</p></div></details>\n</div>\n"}, {"id": "inventory", "name": "Inventory", "icon": "cube", "body": "\n<p class=\"lead\">Inventory is your parts and spares stock &mdash; quantities on hand, costs, low-stock thresholds, and where each item is stored.</p>\n<p class=\"crumbline\"><strong>Where to find it:</strong> PMS &rarr; Inventory.</p>\n\n<h2 id=\"add\">Add an inventory item</h2>\n<ol class=\"steps\">\n<li>Go to <strong>PMS &rarr; Inventory</strong> and click <strong>Add</strong>.</li>\n<li>Enter <strong>ID</strong>, <strong>Name</strong> and <strong>Categories</strong>.</li>\n<li>Set <strong>Units in Stock</strong>, <strong>Unit Cost</strong> and <strong>Minimum in Stock</strong> (your low-stock threshold).</li>\n<li>Add a <strong>Description</strong>, <strong>Part Number</strong>, <strong>Serial Number</strong>, <strong>Manufacturer</strong> and <strong>Area</strong>.</li>\n<li>Set a <strong>QR code</strong> / <strong>Bar code</strong> (or <strong>Generate Code</strong>).</li>\n<li>Set <strong>Storage &rarr; Primary</strong> and link a supplier with <strong>Add Supplier</strong>.</li>\n<li>Attach files and click <strong>Save</strong>.</li>\n</ol>\n<div class=\"callout note\"><div class=\"co-h\">What happens next</div><p>The item appears showing <strong>Stock</strong>, <strong>Available Quantity</strong> and <strong>Cost</strong>. If Stock falls to or below <strong>Minimum in Stock</strong>, the Stock value is highlighted <span class=\"chip badchip\">red</span> as a low-stock warning (a flag only &mdash; it doesn&rsquo;t send alerts or auto-reorder).</p></div>\n\n<h2 id=\"stock\">How stock vs. available quantity works</h2>\n<p>Each item shows both <strong>Stock</strong> and <strong>Available Quantity</strong>, and they aren&rsquo;t always the same:</p>\n<ul class=\"bul\">\n<li><strong>Stock</strong> &mdash; the physical units on hand.</li>\n<li><strong>Available Quantity</strong> &mdash; what&rsquo;s free to use after the parts on <strong>open tasks</strong> (any task not yet Completed) are subtracted. <em>Purchase-order lines don&rsquo;t reserve stock &mdash; only open tasks do.</em> So you may see Stock 8 but Available 7, or even a <strong>negative</strong> Available when commitments exceed what&rsquo;s on hand.</li>\n</ul>\n<p><strong>Minimum in Stock</strong> is the low-stock threshold &mdash; when Stock reaches or drops below it, the figure is flagged red so you can reorder. A negative Stock or Available figure signals consumption recorded beyond what was received, and should be reconciled with a restock.</p>\n<div class=\"callout note\"><div class=\"co-h\">What moves stock</div><p>Stock goes <strong>up</strong> when you <strong>Fulfill</strong> a Purchase Order, and <strong>down</strong> when you <strong>Complete</strong> a task that has Parts (reopening the task adds them back). See <strong>Purchase Orders</strong> and <strong>Tasks</strong>.</p></div>\n\n<h2 id=\"faqs\">FAQs</h2>\n<div class=\"faq\">\n<details><summary>What&rsquo;s the difference between Stock and Available Quantity?</summary><div class=\"faq-a\"><p><strong>Stock</strong> is the physical units on hand; <strong>Available Quantity</strong> is what&rsquo;s left after the parts on <strong>open tasks</strong> are reserved. They differ when stock is committed to a task that hasn&rsquo;t been completed, and Available can go negative if commitments exceed what&rsquo;s on hand. Purchase-order lines don&rsquo;t reserve stock.</p></div></details>\n</div>\n"}]}</script>
