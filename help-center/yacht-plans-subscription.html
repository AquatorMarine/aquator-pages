{"id":"overview","name":"Introduction","icon":"compass","body":"<p class='lead'>Yacht Plans &amp; Subscription is where you choose a plan, start a free trial, pay, and manage everything about your subscription &mdash; all from one place.</p><h2>Plans for every vessel</h2><p>There are three plan families, sized to your vessel and operation:</p><ul class='bul'><li><strong>Yacht Plans</strong> &mdash; Starter, Essential, Advanced and Pro, priced by yacht length (LOA).</li><li><strong>Superyacht Plans</strong> &mdash; Alpha through Foxtrot, for larger vessels (24m and above).</li><li><strong>Business Plans</strong> &mdash; Fleet, Refit and Owner Oversight, for multi-vessel and portfolio operations (custom-priced).</li></ul><h2>Free trial</h2><p>Every paid plan starts with a <strong>14-day free trial</strong> &mdash; no credit card required. You get full access to everything in your chosen plan so you can explore before you commit.</p><h2>Billing cycles</h2><p>Choose <strong>Monthly</strong> or <strong>Annual</strong> billing at checkout. Annual billing saves <strong>15%</strong> on standard subscription plans (the discount does not apply to add-ons).</p><h2>Where everything lives</h2><p>You manage your subscription under <strong>Admin Console &rarr; Billing</strong>, which has three tabs:</p><ul class='bul'><li><strong>Subscription</strong> &mdash; your current plan, add-ons, payment methods and cancellation.</li><li><strong>History</strong> &mdash; a timeline of every change.</li><li><strong>Invoices</strong> &mdash; downloadable invoice PDFs.</li></ul><div class='callout tip'><div class='co-h'>Good to know</div><p>Two things to remember: plan upgrades and downgrades are locked once a plan is approved, and &lsquo;Cancel subscription&rsquo; turns off auto-renew rather than cutting access immediately. Both are explained in the sections that follow.</p></div>"},
{"id":"plans","name":"Plans &amp; Pricing","icon":"tag","body":"<p class='lead'>Every plan family, side by side &mdash; pick the tier that matches your vessel&rsquo;s length and how you operate. The figures below are indicative; the always-current pricing lives at <a href='https://aquatormarine.com/pricing' target='_blank' rel='noopener noreferrer'>aquatormarine.com/pricing</a>.</p><h2>Yacht Plans (single yachts up to 80ft)</h2><p>Transparent per-vessel pricing by length (LOA). Every Yacht Plan includes <strong>8 core modules</strong> &mdash; Profile, Task Management, Chat, Maintenance Manager, Certificate Tracking, Settings, File Manager and Calendar &mdash; plus mobile access and 24/7 support.</p><table class='ftab'><thead><tr><th>Plan</th><th>Length</th><th>Annual</th><th>Monthly</th><th>Users</th><th>Highlights</th></tr></thead><tbody><tr><td class='t-name'>Starter</td><td>Under 50ft</td><td><strong>Free</strong></td><td>&mdash;</td><td>2</td><td>8 core modules, mobile access, 24/7 support, add-on modules available</td></tr><tr><td class='t-name'>Essential</td><td>50&ndash;60ft</td><td>$99/yr</td><td>$9/mo</td><td>4</td><td>Adds Maintenance Tasks, Equipment List and Inventory List</td></tr><tr><td class='t-name'>Advanced</td><td>60&ndash;70ft</td><td>$299/yr</td><td>$29/mo</td><td>6</td><td>Everything in Essential, plus Accounting Transactions and Budget</td></tr><tr><td class='t-name'>Pro</td><td>70&ndash;80ft</td><td>$999/yr</td><td>$99/mo</td><td>8</td><td>Everything in Advanced, plus Crew Lists, Crew Leave &amp; Payslips and 1 integration</td></tr></tbody></table><p class='muted'>Additional users $60/year each.</p><h2>Superyacht Plans (24m and above)</h2><p>Enterprise-grade pricing by vessel length. Every Superyacht Plan includes <strong>all 10 core modules</strong> &mdash; Profile, Yacht Management, PMS, Accounting, Finance, ISM, File Manager, Settings, Reports and In/Out Board &mdash; plus the AI Support Agent, knowledge base and training demos.</p><table class='ftab'><thead><tr><th>Plan</th><th>Length</th><th>Annual</th><th>Monthly</th><th>Users</th><th>Included</th></tr></thead><tbody><tr><td class='t-name'>Alpha</td><td>24&ndash;35m</td><td>$2,500/yr</td><td>$245/mo</td><td>4</td><td>Extra modules as add-ons</td></tr><tr><td class='t-name'>Bravo</td><td>35&ndash;50m</td><td>$4,000/yr</td><td>$390/mo</td><td>6</td><td>1 integration, settings setup</td></tr><tr><td class='t-name'>Charlie</td><td>50&ndash;65m</td><td>$7,000/yr</td><td>$685/mo</td><td>9</td><td>2 integrations, PMS data migration</td></tr><tr><td class='t-name'>Delta</td><td>65&ndash;80m</td><td>$13,000/yr</td><td>$1,275/mo</td><td>12</td><td>3 integrations, PMS + Accounting migration</td></tr><tr><td class='t-name'>Echo</td><td>80&ndash;100m</td><td>$20,000/yr</td><td>$1,960/mo</td><td>18</td><td>4 integrations, PMS + Accounting migration, Assist support included</td></tr><tr><td class='t-name'>Foxtrot</td><td>100m+</td><td><strong>Custom</strong></td><td>&mdash;</td><td>Custom</td><td>All integrations, full data migration, dedicated account team, bespoke reporting</td></tr></tbody></table><p class='muted'>Additional users $120/year each.</p><h2>Billing at a glance</h2><ul class='bul'><li><strong>14-day free trial</strong> on any paid plan &mdash; no credit card required.</li><li><strong>Annual billing saves 15%</strong> versus monthly on standard plans (the discount does not apply to add-ons).</li><li>Monthly billing is available on every priced tier.</li></ul><div class='callout note'><div class='co-h'>Prices may change</div><p>The figures here are a guide. For the latest pricing and any current offers, see <a href='https://aquatormarine.com/pricing' target='_blank' rel='noopener noreferrer'>aquatormarine.com/pricing</a> or ask our team.</p></div>"},
{"id":"custom-plans","name":"Custom &amp; Business Plans","icon":"badge","body":"<p class='lead'>For multi-vessel operations, shipyards and owner-side teams, Aquator offers <strong>custom-quoted Business Plans</strong> &mdash; priced by conversation, not by the module &mdash; alongside the bespoke <strong>Foxtrot</strong> tier for the largest vessels.</p><h2>Fleet Management</h2><p>For yacht management companies, charter operators and fleet managers (typically 5&ndash;50 vessels).</p><ul class='bul'><li>Multi-vessel fleet dashboard with live KPIs</li><li>Planned maintenance system (PMS) across all vessels</li><li>Crew lifecycle &mdash; certs, rotations, leave, payslips</li><li>ISM, ISPS and MLC compliance automation</li><li>Multi-currency accounting and financial reporting</li><li>Charter module &mdash; bookings, APA, guest profiles</li><li>Owner reporting, per vessel and fleet-wide</li><li>Custom integrations and API access</li></ul><h2>Refit &amp; Project</h2><p>For shipyards, refit operations and new-build facilities. Scoped by active project count, team size and ERP modules.</p><ul class='bul'><li>Gantt project management with critical-path tracking</li><li>Subcontractor coordination and work-order management</li><li>Refit scoping, budgeting and spend tracking</li><li>Warranty tracking and claims management</li><li>Client reporting portal and milestone sign-off</li><li>Technical documentation and GA plan management</li><li>New-build ERP suite (optional)</li><li>Digital vessel handover package</li></ul><h2>Owner Oversight</h2><p>For family offices, private wealth managers and owner-side teams. Scoped by portfolio size, reporting requirements and wealth integration.</p><ul class='bul'><li>Full portfolio financial dashboard &mdash; actual vs budget</li><li>Asset depreciation tracking and valuation trail</li><li>Charter P&amp;L &mdash; income, broker commissions, APA</li><li>Approval workflows for expenses above a threshold</li><li>VAT and tax reporting by jurisdiction</li><li>Insurance and certificate renewal tracking</li><li>Manager performance and spend analytics</li><li>Custom owner reporting cadence and format</li></ul><p>Every Business Plan includes platform setup, custom configuration, team training, unlimited vessels, dedicated onboarding, priority support, data migration and custom integrations. Most clients go live within 48 hours.</p><h2>Operational support services</h2><p>Optional managed-support tiers you can add to any plan:</p><table class='ftab'><thead><tr><th>Service</th><th>Price</th><th>Best for</th><th>Includes</th></tr></thead><tbody><tr><td class='t-name'>Assist</td><td>$500/mo</td><td>Established fleets running smoothly</td><td>Monthly check-in, platform health review, usage optimisation, 4-hour priority response</td></tr><tr><td class='t-name'>Plus</td><td>$1,500/mo</td><td>Growing fleets and active charters</td><td>Weekly check-in, dedicated WhatsApp channel, proactive compliance monitoring, quarterly review</td></tr><tr><td class='t-name'>Pro</td><td>$3,000/mo</td><td>Enterprise fleets and complex portfolios</td><td>Strategic advisory, annual onboard visit, priority custom development, dedicated account manager</td></tr></tbody></table><div class='callout tip'><div class='co-h'>Get a quote</div><p>Business Plans and Foxtrot are tailored to your operation. Click <strong>Get in touch</strong> on a custom plan in Billing, or contact <a href='mailto:info@aquatormarine.com'>info@aquatormarine.com</a>, to get a quote.</p></div>"},
{"id":"registration","name":"Account &amp; Registration","icon":"id","body":"<p class='lead'>Create your account, verify your email, and choose the plan that fits your vessel.</p><h2>Sign up &amp; choose a plan</h2><ol class='steps'><li>Open the <strong>Get Started</strong> page and click <strong>Continue</strong>.</li><li><strong>Account</strong> &mdash; enter your name, email and password (or continue with Google / Apple), then click <strong>Continue</strong>.</li><li><strong>Verify Email</strong> &mdash; type the 6-digit code we email you and click <strong>Verify</strong>. Use <strong>Resend</strong> if it does not arrive.</li><li><strong>Profile</strong> &mdash; add your vessel, role and company details, then click <strong>Next</strong>.</li><li><strong>Plan</strong> &mdash; choose your plan: click <strong>Get Started Free</strong> for the free plan, or <strong>Start 14-Day Free Trial</strong> for a paid plan.</li></ol><div class='callout note'><div class='co-h'>After you finish</div><p>You are taken to the <strong>Login</strong> page. Your account is reviewed and approved by our team &mdash; typically within 24 hours &mdash; before you can log in. See the FAQs below.</p></div><h2>FAQs</h2><div class='faq'><details><summary>How does the account registration and approval process work?</summary><div class='faq-a'><p>Once you complete <a href='https://aquatormarine-application.com/register' target='_blank' rel='noopener noreferrer'>registration</a>, your account is submitted for verification. Our admin team reviews your details and approves your account &mdash; <strong>typically within 24 hours</strong>.</p><p>You will receive a confirmation email once your account has been approved. Only after approval will you be able to log in and access the platform.</p><div class='note'><strong>Approval timeline:</strong> Account verification is completed within <strong>24 hours</strong> of registration on business days. If you have not received an approval email after 24 hours, please contact <a href='mailto:info@aquatormarine.com'>info@aquatormarine.com</a>.</div></div></details><details><summary>Why can&rsquo;t I log in after registering?</summary><div class='faq-a'><p>Access to the platform is granted <strong>only after your account has been reviewed and approved by our admin team</strong>. If you have just registered, please allow up to 24 hours for the verification process to complete.</p><p>Once approved, you will receive a confirmation email with a link to log in. If you have been waiting longer than 24 hours, please reach out to <a href='mailto:info@aquatormarine.com'>info@aquatormarine.com</a> and our team will assist you.</p></div></details></div>"},
{"id":"trial","name":"Free Trial","icon":"calendar","body":"<p class='lead'>Try Aquator free for 14 days with full access to your plan&rsquo;s features &mdash; no credit card needed.</p><h2>Start your free trial</h2><ol class='steps'><li>On the <strong>Plan</strong> step at sign-up (or on a plan card in <strong>Billing</strong>), click <strong>Start 14-Day Free Trial</strong>.</li><li>Confirm in the <strong>Free Trial</strong> dialog by clicking <strong>Start Free Trial</strong>.</li><li>Your trial begins immediately &mdash; you will see &lsquo;Free trial started!&rsquo; and the days remaining on your Subscription tab.</li></ol><h2>When the trial ends</h2><p>After 14 days your account is paused until you activate a paid subscription. <strong>You are never charged automatically</strong>, and we email a reminder before the trial ends so you have time to decide.</p><div class='callout warn'><div class='co-h'>Need more time?</div><p>Trial extensions are available case-by-case &mdash; contact support with your account email and the reason for the extension.</p></div><h2>FAQs</h2><div class='faq'><details><summary>How long is the free trial period?</summary><div class='faq-a'><p>Your free trial lasts <strong>14 days</strong> from the moment you <a href='https://aquatormarine-application.com/register' target='_blank' rel='noopener noreferrer'>sign up</a> &mdash; no credit card required. You will have full access to all features included in your chosen plan during this period so you can explore everything before committing.</p></div></details><details><summary>What happens when my free trial ends?</summary><div class='faq-a'><p>Once your 14-day trial expires, your account is paused until you activate a paid subscription. <strong>You will not be charged automatically.</strong> We will send a reminder email before the trial ends so you have time to decide.</p></div></details><details><summary>Can I extend my free trial beyond 14 days?</summary><div class='faq-a'><p>Yes &mdash; trial extensions are available on a case-by-case basis. To request one, please contact the support team at <a href='mailto:info@aquatormarine.com'>info@aquatormarine.com</a>. Extensions are granted at their discretion, typically for valid evaluation or business reasons.</p><div class='note'><strong>How to request:</strong> Reach out to the <a href='mailto:info@aquatormarine.com'>support team</a> with your account email and reason for the extension. Allow 1&ndash;2 business days for a response.</div></div></details></div>"},
{"id":"subscription","name":"Subscription &amp; Plan","icon":"contract","body":"<p class='lead'>Activate a paid plan, see your current subscription, and control auto-renewal.</p><h2>Open Billing</h2><ol class='steps'><li>In the left sidebar, open <strong>Admin Console</strong>.</li><li>Click <strong>Billing</strong> to open the Billing page on the <strong>Subscription</strong> tab.</li></ol><h2>Subscribe to a plan</h2><p>From the <strong>Subscription</strong> tab, here is what each button does:</p><table class='ftab'><thead><tr><th>You click</th><th>What happens</th></tr></thead><tbody><tr><td class='t-name'>Subscribe / View Plan</td><td>Opens the <strong>Plan Detail</strong> dialog.</td></tr><tr><td class='t-name'>Annual / Monthly toggle</td><td>Switches the prices shown (Annual saves 15%).</td></tr><tr><td class='t-name'>Add-on checkboxes / steppers</td><td>Updates the running total in the dialog.</td></tr><tr><td class='t-name'>Proceed to Checkout</td><td>Takes you to the <strong>Checkout</strong> page to pay.</td></tr><tr><td class='t-name'>Get in touch</td><td>For custom-priced plans &mdash; contact sales.</td></tr></tbody></table><h2>Auto-renew &amp; cancelling</h2><ul class='bul'><li>Your plan renews automatically each cycle. We email a reminder <strong>7 days before</strong> renewal.</li><li>Click <strong>Cancel subscription</strong> to turn off auto-renew &mdash; you keep access until the period ends.</li><li>Changed your mind? Click <strong>Don&rsquo;t cancel</strong> to switch auto-renew back on.</li></ul><div class='callout warn'><div class='co-h'>Cancelling does not end access immediately</div><p>&lsquo;Cancel subscription&rsquo; turns off auto-renew. Your subscription stays active until the end of the current billing period, and you can reverse it any time before then.</p></div><div class='callout warn'><div class='co-h'>Plan changes are locked after approval</div><p>Once a plan is approved and active, upgrades and downgrades are not available during the billing cycle. Contact support to discuss your options at renewal.</p></div><h2>FAQs</h2><div class='faq'><details><summary>How do I activate my subscription after the trial?</summary><div class='faq-a'><p>Head to <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing &rarr; Subscription</strong></a> in your dashboard. Select the plan that fits your vessel or fleet, add your payment method, and confirm. Your plan activates immediately upon approval.</p></div></details><details><summary>Can I upgrade or downgrade my plan after it&rsquo;s been approved?</summary><div class='faq-a'><p>Once your subscription plan has been <strong>approved and activated, plan changes &mdash; upgrades or downgrades &mdash; are not permitted</strong> during the active billing cycle. This ensures pricing integrity and service consistency for all accounts.</p><p>If your needs change significantly, please contact our <a href='mailto:info@aquatormarine.com'>support team</a> to discuss your options at the next renewal cycle.</p><div class='note'><strong>Important:</strong> Plan modifications are locked upon approval. Review plan tiers carefully during setup &mdash; your account manager can help you choose the right fit before confirming.</div></div></details><details><summary>How does auto-renewal work?</summary><div class='faq-a'><p>Your subscription renews <strong>automatically</strong> at the end of each billing cycle (monthly or annually, depending on your plan). We send an email reminder <strong>7 days before renewal</strong>. You can turn off auto-renewal at any time from <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing &rarr; Subscription</strong></a> (cancel or resume auto-renew).</p></div></details><details><summary>Can I cancel my subscription?</summary><div class='faq-a'><p>Yes, you can cancel at any time. Go to <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing &rarr; Subscription</strong></a> and use the cancel subscription option. Your access continues until the end of the current billing period &mdash; you will not be charged again after cancellation.</p></div></details></div>"},
{"id":"addons","name":"Add-Ons","icon":"addon","body":"<p class='lead'>Add-ons extend your plan with extra modules or seats. They are available once you are on a paid subscription.</p><h2>Add an add-on</h2><ol class='steps'><li>Go to <strong>Admin Console &rarr; Billing &rarr; Subscription</strong> and find <strong>Manage Add-ons</strong>.</li><li>Click <strong>Add-on</strong> and choose the add-ons you want (set a quantity where shown).</li><li>Click <strong>Confirm</strong> to purchase. The cost is pro-rated from today.</li></ol><h2>Remove an add-on</h2><ol class='steps'><li>In <strong>Manage Add-ons</strong>, click <strong>Remove Add-on</strong> and select the one to remove.</li><li>Confirm &mdash; it stays active until the period ends, then will not renew.</li><li>Changed your mind? Click <strong>Undo</strong> before the period ends to keep it.</li></ol><table class='ftab'><thead><tr><th>You click</th><th>What happens</th></tr></thead><tbody><tr><td class='t-name'>Add-on</td><td>Opens the dialog to choose and confirm new add-ons.</td></tr><tr><td class='t-name'>Remove Add-on</td><td>Schedules an add-on to end at the period&rsquo;s close.</td></tr><tr><td class='t-name'>Undo</td><td>Cancels a scheduled removal so the add-on keeps renewing.</td></tr></tbody></table><h2>FAQs</h2><div class='faq'><details><summary>Can I add add-ons to my subscription?</summary><div class='faq-a'><p>Yes. Add-ons are available <strong>after you have activated a paid subscription</strong>. Browse and purchase from <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing &rarr; Subscription</strong></a> (Manage Add-ons). Each add-on is billed in addition to your base plan and itemised separately on your invoice.</p></div></details><details><summary>Are add-ons available during the free trial?</summary><div class='faq-a'><p>Add-ons are <strong>not available during the free trial period.</strong> They become accessible once you have transitioned to an active paid plan, ensuring they are correctly billed and aligned with your subscription.</p></div></details><details><summary>How are add-ons billed?</summary><div class='faq-a'><p>Add-ons are charged on a <strong>pro-rated basis</strong> from the date of purchase, then included in your regular renewal going forward. They appear as separate line items on your invoice for full transparency.</p></div></details><details><summary>Can I remove an add-on I no longer need?</summary><div class='faq-a'><p>Yes. Go to <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing &rarr; Subscription</strong></a> (Manage Add-ons), select the add-on and click <em>Remove</em>. It stays active until your current billing period ends and will not renew after that.</p></div></details><details><summary>Does the 15% annual discount apply to add-ons?</summary><div class='faq-a'><p>The <strong>15% annual discount applies to standard subscription plans only</strong> (Yacht Plans and Superyacht Plans). It does <strong>not</strong> apply to add-ons.</p><p>Add-ons are billed at their standard rate regardless of whether you are on a monthly or annual subscription. The discounted pricing you see at checkout reflects your base plan savings &mdash; your add-on line items will always show their full price.</p><div class='note'><strong>Summary:</strong> Base plan &mdash; 15% off when billed annually. Add-ons &mdash; always billed at standard rate, no annual discount.</div></div></details></div>"},
{"id":"billing","name":"Billing &amp; Payment","icon":"cash","body":"<p class='lead'>Pay securely, manage your cards, and find every invoice and transaction.</p><h2>Checkout &amp; pay</h2><ol class='steps'><li>From the <strong>Plan Detail</strong> dialog, click <strong>Proceed to Checkout</strong>.</li><li>Review your order on the left, then on the right either select a <strong>saved card</strong> or click <strong>Add new payment method</strong> and enter your card.</li><li>Click <strong>Subscribe</strong>. You will see &lsquo;Subscription activated successfully!&rsquo; and return to the Billing page.</li></ol><p class='muted'>Use <strong>Back to Plans</strong> at any time to return to Billing without paying.</p><h2>Payment methods</h2><table class='ftab'><thead><tr><th>You click</th><th>What happens</th></tr></thead><tbody><tr><td class='t-name'>Add Method</td><td>Opens the secure card form to save a new card.</td></tr><tr><td class='t-name'>Set as Default</td><td>Makes that card the default used for renewals.</td></tr><tr><td class='t-name'>Remove</td><td>Deletes a saved card (you cannot remove the default).</td></tr></tbody></table><h2>Invoices &amp; history</h2><ul class='bul'><li><strong>Invoices tab</strong> &mdash; download invoice PDFs; click <strong>Sync</strong> to refresh the list, or the eye icon to view a single invoice.</li><li><strong>History tab</strong> &mdash; a read-only timeline of cancellations, add-on changes, refunds and more.</li></ul><h2>FAQs</h2><div class='faq'><details><summary>How do I update my payment method?</summary><div class='faq-a'><p>Go to <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing &rarr; Subscription</strong></a> (Payment methods) and add or update your card. Your next billing cycle will use the updated method automatically.</p><div class='note'><strong>Security:</strong> All payment data is encrypted end-to-end. Aquator Marine never stores raw card numbers on its servers.</div></div></details><details><summary>Where can I view my billing history?</summary><div class='faq-a'><p>Your complete billing history is available under <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing</strong></a>, on the <strong>History</strong> tab. It lists every past transaction &mdash; date, amount, plan, and payment method &mdash; going back to your very first charge.</p></div></details><details><summary>How do I download or view my invoices?</summary><div class='faq-a'><p>Invoices are generated automatically after each successful payment. Access them from <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'><strong>Admin Console &rarr; Billing</strong></a>, on the <strong>Invoices</strong> tab. Each invoice is available as a <strong>downloadable PDF</strong> and is also emailed to your registered address, with a full itemised breakdown of your plan and any active add-ons.</p></div></details><details><summary>What happens if my payment fails?</summary><div class='faq-a'><p>If a payment fails we will notify you immediately by email and automatically <strong>retry the charge up to 3 times</strong> over the following days. If all retries fail, your subscription will be paused until a valid payment is received. <a href='https://aquatormarine-application.com/billing' target='_blank' rel='noopener noreferrer'>Updating your payment method</a> in Admin Console &rarr; Billing &rarr; Subscription triggers an immediate retry.</p></div></details></div>"}
]}</script>
