name: Monthly Changelog Generator

on:
  schedule:
    # Runs at 9:00 AM UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate changelog and create PR
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          HELP_SITE_REPO: AquatorMarine/aquator-pages
          ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANGELOG_FILE_PATH: ${{ vars.CHANGELOG_FILE_PATH || 'change-log/index.html' }}
          REVIEWERS: ${{ vars.REVIEWERS || 'nirali,bhargav' }}
        run: node scripts/generate-changelog.js
